<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12181f">
<title>社会（5年後期 第4回：天皇・貴族の政治と人々のくらし／① 栄冠ベース・入門編）</title>
<style>
  :root {
    --bg: #12181f;
    --card-bg: #1c2733;
    --accent: #ffb347;
    --answer: #7ed6a5;
    --text: #f5f7fa;
    --sub: #9fb0c3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    overflow: hidden;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    width: 100vw;
    height: 100vh;
    padding: 3vh 5vw;
  }
  .topbar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 2.2vw;
    color: var(--sub);
  }
  .category {
    background: rgba(255,179,71,0.15);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 0.6vh 2vw;
    font-weight: bold;
  }
  .progress-wrap {
    width: 100%;
    height: 1.2vh;
    background: #2a3644;
    border-radius: 999px;
    margin-top: 1.5vh;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s linear;
  }
  .card {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 4vh;
  }
  .qlabel {
    font-size: 2vw;
    letter-spacing: 0.3em;
    color: var(--sub);
  }
  .question {
    font-size: 4.4vw;
    font-weight: 800;
    line-height: 1.4;
    max-width: 90vw;
  }
  .answer-box {
    font-size: 3.6vw;
    font-weight: 800;
    color: var(--answer);
    line-height: 1.4;
    max-width: 90vw;
    min-height: 6vw;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .answer-box.show {
    opacity: 1;
    transform: translateY(0);
  }
  .answer-box.no-transition {
    transition: none !important;
  }
  .answer-box .arrow {
    color: var(--sub);
    font-size: 3vw;
    margin-right: 0.4em;
  }
  .bottombar {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 3vw;
    font-size: 1.8vw;
    color: var(--sub);
  }
  button {
    background: #2a3644;
    color: var(--text);
    border: none;
    border-radius: 999px;
    padding: 2.5vh 2.2vw;
    font-size: 1.8vw;
    cursor: pointer;
  }
  button:hover { background: #34445a; }
  ruby { ruby-position: over; }
  rt {
    font-size: 0.42em;
    font-weight: 600;
    color: var(--sub);
    user-select: none;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="category" id="category">社会・第4回・入門（栄冠）</span>
    <span id="counter">1 / 36</span>
    <span id="masteredCounter">✓ おぼえた 0 / 36</span>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <div class="card">
    <div class="qlabel">Q</div>
    <div class="question" id="question">読み込み中…</div>
    <div class="answer-box" id="answerBox"><span class="arrow" id="arrowLabel">A</span><span id="answerText"></span></div>
  </div>

  <div class="bottombar">
    <button id="playPause">⏸ 停止</button>
    <button id="restart">🔀 シャッフル</button>
    <button id="restartOrder">📖 テキスト順</button>
    <button id="masterBtn">✓ 覚えた</button>
    <button id="resetMastered">🔄 リセット</button>
  </div>
</div>

<script>
const DATA = [
  {cat:"律令国家のしくみ", q:"701年に完成した、<ruby>大化の改新<rt>たいかのかいしん</rt></ruby>以来のきまりをまとめた法律は？", a:"<ruby>大宝律令<rt>たいほうりつりょう</rt></ruby>"},
  {cat:"律令国家のしくみ", q:"律令制度のもとで、土地や人民はすべて国のものとする<ruby>原則<rt>げんそく</rt></ruby>を何という？", a:"<ruby>公地公民<rt>こうちこうみん</rt></ruby>"},
  {cat:"律令国家のしくみ", q:"律令制度で、国に置かれた役人を何という？（郡には<ruby>郡司<rt>ぐんじ</rt></ruby>、里には<ruby>里長<rt>さとおさ</rt></ruby>という役人がいた）", a:"<ruby>国司<rt>こくし</rt></ruby>"},
  {cat:"律令国家のしくみ", q:"<ruby>班田収授<rt>はんでんしゅうじゅ</rt></ruby>の法にもとづき、6歳以上の人々にあたえられた田を何という？", a:"<ruby>口分田<rt>くぶんでん</rt></ruby>"},
  {cat:"律令国家のしくみ", q:"稲の<ruby>収穫<rt>しゅうかく</rt></ruby>の約3％を納める税を何という？", a:"<ruby>租<rt>そ</rt></ruby>"},
  {cat:"律令国家のしくみ", q:"布または特産物を納める税を何という？", a:"<ruby>調<rt>ちょう</rt></ruby>"},
  {cat:"律令国家のしくみ", q:"都で働くかわりに布を納める税を何という？", a:"<ruby>庸<rt>よう</rt></ruby>"},
  {cat:"律令国家のしくみ", q:"<ruby>租<rt>そ</rt></ruby>・<ruby>調<rt>ちょう</rt></ruby>・<ruby>庸<rt>よう</rt></ruby>のうち、農民が都まで運んで納めなければならなかった税は？（2つ）", a:"<ruby>調<rt>ちょう</rt></ruby>と<ruby>庸<rt>よう</rt></ruby>"},
  {cat:"律令国家のしくみ", q:"おもに<ruby>東国<rt>とうごく</rt></ruby>の農民が、3年間北九州の沿岸を守った任務を何という？", a:"<ruby>防人<rt>さきもり</rt></ruby>"},
  {cat:"公地公民のくずれ", q:"723年に出された、新しく<ruby>開墾<rt>かいこん</rt></ruby>した土地を3代にわたって私有することを認める法は？", a:"<ruby>三世一身の法<rt>さんぜいっしんのほう</rt></ruby>"},
  {cat:"公地公民のくずれ", q:"743年に出された、<ruby>開墾<rt>かいこん</rt></ruby>した土地を永久に私有することを認める法は？", a:"<ruby>墾田永年私財法<rt>こんでんえいねんしざいほう</rt></ruby>"},
  {cat:"公地公民のくずれ", q:"墾田永年私財法により、貴族や寺社が<ruby>開墾<rt>かいこん</rt></ruby>を進めて増やしていった私有地を何という？", a:"<ruby>荘園<rt>しょうえん</rt></ruby>"},
  {cat:"新しい都・平城京", q:"710年、元明天皇が奈良盆地の北部に移した新しい都は？", a:"<ruby>平城京<rt>へいじょうきょう</rt></ruby>"},
  {cat:"新しい都・平城京", q:"平城京は、唐のどの都をまねてつくられた？", a:"<ruby>長安<rt>ちょうあん</rt></ruby>"},
  {cat:"新しい都・平城京", q:"平城京の東西にある市で使われていた<ruby>貨幣<rt>かへい</rt></ruby>は？", a:"<ruby>和同開珎<rt>わどうかいちん</rt></ruby>"},
  {cat:"新しい都・平城京", q:"平城京跡から大量に見つかった、<ruby>荷札<rt>にふだ</rt></ruby>や役所の<ruby>文書<rt>ぶんしょ</rt></ruby>などに使われた木の札を何という？", a:"<ruby>木簡<rt>もっかん</rt></ruby>"},
  {cat:"歴史書・書物", q:"<ruby>稗田阿礼<rt>ひえだのあれ</rt></ruby>・<ruby>太安万侶<rt>おおのやすまろ</rt></ruby>らによって712年に完成した歴史書は？", a:"<ruby>古事記<rt>こじき</rt></ruby>"},
  {cat:"歴史書・書物", q:"<ruby>舎人親王<rt>とねりしんのう</rt></ruby>らによって720年に完成した歴史書は？", a:"<ruby>日本書紀<rt>にほんしょき</rt></ruby>"},
  {cat:"歴史書・書物", q:"各地の地名の由来や産物などについて書かれた、713年完成の書物は？", a:"<ruby>風土記<rt>ふどき</rt></ruby>"},
  {cat:"歴史書・書物", q:"<ruby>山上憶良<rt>やまのうえのおくら</rt></ruby>の<ruby>貧窮問答歌<rt>ひんきゅうもんどうか</rt></ruby>がおさめられている、日本最古の歌集は？", a:"<ruby>万葉集<rt>まんようしゅう</rt></ruby>"},
  {cat:"天平文化と大仏", q:"724年に位につき、仏教を厚く<ruby>信仰<rt>しんこう</rt></ruby>した天皇は？", a:"<ruby>聖武天皇<rt>しょうむてんのう</rt></ruby>"},
  {cat:"天平文化と大仏", q:"聖武天皇が741年に国ごとに建てさせた2つの寺は？", a:"<ruby>国分寺<rt>こくぶんじ</rt></ruby>と<ruby>国分尼寺<rt>こくぶんにじ</rt></ruby>"},
  {cat:"天平文化と大仏", q:"聖武天皇が大仏をつくらせたのはなぜ？", a:"<ruby>仏教<rt>ぶっきょう</rt></ruby>の力で国を安らかに治めようとしたため"},
  {cat:"天平文化と大仏", q:"都に建てられ、大仏がつくられた寺は？", a:"<ruby>東大寺<rt>とうだいじ</rt></ruby>"},
  {cat:"天平文化と大仏", q:"東大寺に建立されたものは？", a:"<ruby>大仏<rt>だいぶつ</rt></ruby>"},
  {cat:"天平文化と大仏", q:"大仏づくりに協力した、当時<ruby>民衆<rt>みんしゅう</rt></ruby>から親しまれていた僧は？", a:"<ruby>行基<rt>ぎょうき</rt></ruby>"},
  {cat:"天平文化と大仏", q:"東大寺にある、聖武天皇の<ruby>遺品<rt>いひん</rt></ruby>などがおさめられた倉庫を何という？", a:"<ruby>正倉院<rt>しょうそういん</rt></ruby>"},
  {cat:"天平文化と大仏", q:"正倉院のような、三角形の角材を組み合わせたつくりを何という？", a:"<ruby>校倉造<rt>あぜくらづくり</rt></ruby>"},
  {cat:"遣唐使", q:"717年に<ruby>留学生<rt>りゅうがくせい</rt></ruby>として唐に渡り、その後日本に帰れず唐の役人として一生を終えた人物は？", a:"<ruby>阿倍仲麻呂<rt>あべのなかまろ</rt></ruby>"},
  {cat:"遣唐使", q:"唐から日本に渡り、<ruby>失明<rt>しつめい</rt></ruby>しながらも来日して日本の仏教の発展につくした僧は？", a:"<ruby>鑑真<rt>がんじん</rt></ruby>"},
  {cat:"遣唐使", q:"鑑真が建てた寺は？", a:"<ruby>唐招提寺<rt>とうしょうだいじ</rt></ruby>"},
  {cat:"遣唐使", q:"<ruby>阿倍仲麻呂<rt>あべのなかまろ</rt></ruby>がよんだ歌は、次のうちどれ？<br><span style=\"font-size:0.46em\">ア「世の中を　うしとやさしと　思えども　飛び立ちかねつ　鳥にしあらねば」<br>イ「<ruby>韓衣<rt>からころも</rt></ruby>　すそに取りつき　泣く子らを　置きてぞ来ぬや　母なしにして」<br>ウ「天の原　ふりさけ見れば　<ruby>春日<rt>かすが</rt></ruby>なる　<ruby>三笠の山<rt>みかさのやま</rt></ruby>に　いでし月かも」</span>", a:"ウ<br><span style=\"font-size:0.4em\">（天の原　ふりさけ見れば　<ruby>春日<rt>かすが</rt></ruby>なる　<ruby>三笠の山<rt>みかさのやま</rt></ruby>に　いでし月かも）</span>"},
  {cat:"遣唐使", q:"日本人が危険をおかしてでも唐へ渡った理由としてふさわしくないものは？<br><span style=\"font-size:0.68em\">ア「唐の政治や制度を取り入れるため」<br>イ「唐の学問や仏教を学ぶため」<br>ウ「唐から食料や鉄を輸入するため」</span>", a:"ウ<br><span style=\"font-size:0.62em\">「唐から食料や鉄を輸入するため」がまちがい</span>"},
  {cat:"史料・古事記の序文", q:"『古事記』の<ruby>序文<rt>じょぶん</rt></ruby>を天皇に申し上げた人物は？", a:"<ruby>太安万侶<rt>おおのやすまろ</rt></ruby>"},
  {cat:"史料・古事記の序文", q:"天武天皇の<ruby>詔<rt>みことのり</rt></ruby>により、天皇家の<ruby>系図<rt>けいず</rt></ruby>や神話・伝説を記憶していた<ruby>舎人<rt>とねり</rt></ruby>（姓・名）は？", a:"<ruby>稗田阿礼<rt>ひえだのあれ</rt></ruby>"},
  {cat:"演習", q:"次のうち、正倉院におさめられている品物としてふさわしくないものは？<br><ruby>紺瑠璃杯<rt>こんるりのつき</rt></ruby>／<ruby>白瑠璃碗<rt>はくるりのわん</rt></ruby>／<ruby>螺鈿紫檀五絃琵琶<rt>らでんしたんのごげんびわ</rt></ruby>／<ruby>玉虫厨子<rt>たまむしのずし</rt></ruby>", a:"<ruby>玉虫厨子<rt>たまむしのずし</rt></ruby>（法隆寺にある品物のため）"},
];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const CELEBRATION_PHOTOS = ["images/shakai7-complete.jpg", "images/shakai10-complete.jpg", "images/celebration3.jpg", "images/celebration4.jpg", "images/celebration5.jpg", "images/celebration6.jpg"];
const QUESTION_SECONDS = 7;
const ANSWER_SECONDS = 5;
function currentPhaseSeconds() {
  return showingAnswer ? ANSWER_SECONDS : QUESTION_SECONDS;
}
DATA.forEach((item, i) => { item._id = i; });
const TOTAL_COUNT = DATA.length;
let known = new Set();
try {
  const saved = sessionStorage.getItem("shakai10_known");
  if (saved) known = new Set(JSON.parse(saved));
} catch (e) {}
function saveKnown() {
  try { sessionStorage.setItem("shakai10_known", JSON.stringify([...known])); } catch (e) {}
}
function activeData() {
  return DATA.filter(item => !known.has(item._id));
}
let orderMode = "shuffle"; // "shuffle" | "sequential"
function makeDeck() {
  const pool = activeData();
  return orderMode === "sequential" ? pool.slice() : shuffle(pool);
}
let deck = makeDeck();
let idx = 0;
let showingAnswer = false;
let paused = false;
let timer = null;
let tickStart = 0;
let remainingOnPause = QUESTION_SECONDS * 1000;
let finished = false;

const questionEl = document.getElementById("question");
const answerBox = document.getElementById("answerBox");
const answerText = document.getElementById("answerText");
const arrowLabel = document.getElementById("arrowLabel");
const categoryEl = document.getElementById("category");
const counterEl = document.getElementById("counter");
const masteredCounterEl = document.getElementById("masteredCounter");
const progressBar = document.getElementById("progressBar");
const playPauseBtn = document.getElementById("playPause");
const restartBtn = document.getElementById("restart");
const restartOrderBtn = document.getElementById("restartOrder");
const masterBtn = document.getElementById("masterBtn");
const resetMasteredBtn = document.getElementById("resetMastered");

function updateMasteredCounter() {
  masteredCounterEl.textContent = "✓ おぼえた " + known.size + " / " + TOTAL_COUNT;
}

function resetProgressBar() {
  progressBar.style.transition = "none";
  progressBar.style.width = "0%";
  void progressBar.offsetWidth; // force reflow so the reset is committed before re-enabling the transition
}

function renderCard() {
  if (deck.length === 0) {
    finished = true;
    clearTimeout(timer);
    categoryEl.textContent = "🎉 全問クリア";
    counterEl.textContent = TOTAL_COUNT + " / " + TOTAL_COUNT;
    const celebPhoto = CELEBRATION_PHOTOS[Math.floor(Math.random() * CELEBRATION_PHOTOS.length)];
    questionEl.innerHTML = "🎉 全問「おぼえた」にしました！<br><img src=\"" + celebPhoto + "\" alt=\"おめでとう\" style=\"max-width:70vw; max-height:38vh; border-radius:20px; margin-top:2vh; box-shadow:0 4px 20px rgba(0,0,0,0.4);\">";
    answerBox.classList.add("no-transition");
    answerBox.classList.add("show");
    answerText.innerHTML = "";
    arrowLabel.style.display = "none";
    resetProgressBar();
    return;
  }
  finished = false;
  arrowLabel.style.display = "";
  const item = deck[idx];
  categoryEl.textContent = item.cat;
  counterEl.textContent = (idx + 1) + " / " + deck.length;
  questionEl.innerHTML = item.q;

  answerBox.classList.add("no-transition");
  answerBox.classList.remove("show");
  void answerBox.offsetWidth;
  answerText.innerHTML = item.a;
  void answerBox.offsetWidth;
  requestAnimationFrame(() => {
    answerBox.classList.remove("no-transition");
  });

  showingAnswer = false;
}

function step() {
  if (finished) return;
  if (!showingAnswer) {
    answerBox.classList.add("show");
    showingAnswer = true;
  } else {
    idx++;
    if (idx >= deck.length) {
      idx = 0;
      deck = makeDeck();
    }
    renderCard();
  }
  startProgress();
}

function startProgress() {
  const seconds = currentPhaseSeconds();
  resetProgressBar();
  requestAnimationFrame(() => {
    progressBar.style.transition = "width " + seconds + "s linear";
    progressBar.style.width = "100%";
  });
}

function scheduleNext() {
  clearTimeout(timer);
  const seconds = currentPhaseSeconds();
  tickStart = Date.now();
  remainingOnPause = seconds * 1000;
  timer = setTimeout(() => {
    step();
    if (!paused) scheduleNext();
  }, seconds * 1000);
}

function pause() {
  paused = true;
  clearTimeout(timer);
  const elapsed = Date.now() - tickStart;
  remainingOnPause = Math.max(currentPhaseSeconds() * 1000 - elapsed, 0);
  progressBar.style.transition = "none";
  playPauseBtn.textContent = "▶ 再生";
}

function resume() {
  paused = false;
  playPauseBtn.textContent = "⏸ 停止";
  tickStart = Date.now();
  timer = setTimeout(() => {
    step();
    if (!paused) scheduleNext();
  }, remainingOnPause);
  const remainSec = remainingOnPause / 1000;
  requestAnimationFrame(() => {
    progressBar.style.transition = "width " + remainSec + "s linear";
    progressBar.style.width = "100%";
  });
}

playPauseBtn.addEventListener("click", () => {
  if (paused) resume(); else pause();
});

restartBtn.addEventListener("click", () => {
  orderMode = "shuffle";
  deck = makeDeck();
  idx = 0;
  renderCard();
  resetProgressBar();
  if (!paused && !finished) {
    startProgress();
    scheduleNext();
  }
});

restartOrderBtn.addEventListener("click", () => {
  orderMode = "sequential";
  deck = makeDeck();
  idx = 0;
  renderCard();
  resetProgressBar();
  if (!paused && !finished) {
    startProgress();
    scheduleNext();
  }
});

masterBtn.addEventListener("click", () => {
  if (finished || deck.length === 0) return;
  clearTimeout(timer);
  const item = deck[idx];
  known.add(item._id);
  saveKnown();
  updateMasteredCounter();
  deck.splice(idx, 1);
  if (idx >= deck.length) idx = 0;
  renderCard();
  resetProgressBar();
  if (!paused && !finished) {
    startProgress();
    scheduleNext();
  }
});

resetMasteredBtn.addEventListener("click", () => {
  known = new Set();
  saveKnown();
  updateMasteredCounter();
  clearTimeout(timer);
  deck = makeDeck();
  idx = 0;
  renderCard();
  resetProgressBar();
  if (!paused && !finished) {
    startProgress();
    scheduleNext();
  }
});

document.querySelector(".card").addEventListener("click", () => {
  clearTimeout(timer);
  step();
  if (!paused) scheduleNext();
});

updateMasteredCounter();
renderCard();
startProgress();
scheduleNext();
</script>
</body>
</html>
