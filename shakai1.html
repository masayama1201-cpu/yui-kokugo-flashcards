<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12181f">
<title>社会（5年後期 第1回：原始の人々のくらし／① 栄冠ベース・入門編）</title>
<style>
  :root {
    --bg: #12181f;
    --card-bg: #1c2733;
    --accent: #ffb347;
    --answer: #7ed6a5;
    --text: #f5f7fa;
    --sub: #9fb0c3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    overflow: hidden;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    width: 100vw;
    height: 100vh;
    padding: 3vh 5vw;
  }
  .topbar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 2.2vw;
    color: var(--sub);
  }
  .category {
    background: rgba(255,179,71,0.15);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 0.6vh 2vw;
    font-weight: bold;
  }
  .progress-wrap {
    width: 100%;
    height: 1.2vh;
    background: #2a3644;
    border-radius: 999px;
    margin-top: 1.5vh;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s linear;
  }
  .card {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 4vh;
  }
  .qlabel {
    font-size: 2vw;
    letter-spacing: 0.3em;
    color: var(--sub);
  }
  .question {
    font-size: 4.4vw;
    font-weight: 800;
    line-height: 1.4;
    max-width: 90vw;
  }
  .answer-box {
    font-size: 3.6vw;
    font-weight: 800;
    color: var(--answer);
    line-height: 1.4;
    max-width: 90vw;
    min-height: 6vw;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .answer-box.show {
    opacity: 1;
    transform: translateY(0);
  }
  .answer-box.no-transition {
    transition: none !important;
  }
  .answer-box .arrow {
    color: var(--sub);
    font-size: 3vw;
    margin-right: 0.4em;
  }
  .bottombar {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 3vw;
    font-size: 1.8vw;
    color: var(--sub);
  }
  button {
    background: #2a3644;
    color: var(--text);
    border: none;
    border-radius: 999px;
    padding: 1vh 2.2vw;
    font-size: 1.8vw;
    cursor: pointer;
  }
  button:hover { background: #34445a; }
  .hint {
    color: var(--sub);
    font-size: 1.6vw;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="category" id="category">社会・入門（栄冠）</span>
    <span id="counter">1 / 47</span>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <div class="card">
    <div class="qlabel">Q</div>
    <div class="question" id="question">読み込み中…</div>
    <div class="answer-box" id="answerBox"><span class="arrow">A</span><span id="answerText"></span></div>
  </div>

  <div class="bottombar">
    <button id="playPause">⏸ 一時停止</button>
    <button id="restart">🔀 シャッフルして最初から</button>
    <button id="restartOrder">📖 テキスト順に最初から</button>
    <button id="fullscreenBtn">⛶ 全画面</button>
    <span class="hint">問題7秒→答え5秒で自動的に切り替わります（タップでも操作できます）</span>
  </div>
</div>

<script>
const DATA = [
  {cat:"旧石器時代・基本", q:"日本列島に人が住み始めた、土器がまだなかった時代を何という？", a:"旧石器時代"},
  {cat:"旧石器時代・基本", q:"旧石器時代の人々が、石を打ち欠いて作った石器を何という？", a:"打製石器"},
  {cat:"旧石器時代・基本", q:"旧石器時代、日本列島はどのような状態だった？", a:"氷河時代で気候が寒冷、海面が今より低く、ユーラシア大陸と陸続きだった"},
  {cat:"旧石器時代・基本", q:"旧石器時代の人々はどんな生活をしていた？", a:"ナウマンゾウやオオツノジカなどの大型動物を追って、移動しながら狩りや採集をする生活"},
  {cat:"旧石器時代・基本", q:"旧石器時代、日本列島にいた大型動物を3つ挙げると？", a:"ナウマンゾウ・マンモス・オオツノジカ"},
  {cat:"旧石器時代・遺跡", q:"ナウマンゾウやオオツノジカの化石が見つかった長野県の遺跡は？", a:"野尻湖遺跡"},
  {cat:"旧石器時代・遺跡", q:"群馬県にあり、関東ローム層（赤土の層）から打製石器が発見された遺跡は？", a:"岩宿遺跡"},
  {cat:"旧石器時代・遺跡", q:"岩宿遺跡を発見し、日本にも旧石器時代があったことを証明した人物は？", a:"相沢忠洋"},
  {cat:"旧石器時代・遺跡", q:"岩宿遺跡の発見が重要とされる理由は？", a:"それまで「日本には土器のない旧石器時代はなかった」と考えられていた常識をくつがえしたから"},
  {cat:"縄文時代のはじまり", q:"縄文時代は今からおよそ何年前に始まった？", a:"約1万年前"},
  {cat:"縄文時代のはじまり", q:"縄文時代が始まるきっかけとなった気候の変化は？", a:"気候が温暖化し、氷がとけて海面が上昇したこと"},
  {cat:"縄文時代のはじまり", q:"海面が上昇した結果、日本列島はどうなった？", a:"ユーラシア大陸と切り離され、現在に近い形の島々になった"},
  {cat:"縄文時代のはじまり", q:"旧石器時代の打製石器に代わって、縄文時代に使われるようになった、表面を磨いて作る石器は？", a:"磨製石器"},
  {cat:"縄文時代のはじまり", q:"動物の骨や角を加工して作った、縄文時代の道具（釣り針・やじりなど）を何という？", a:"骨角器"},
  {cat:"縄文時代・道具と住居", q:"縄文時代の人々が土をこねて焼いて作った、表面に縄目の文様がある厚手の土器は？", a:"縄文土器"},
  {cat:"縄文時代・道具と住居", q:"縄文土器は主に何のために使われた？", a:"食料を煮炊きするため（生では食べにくいものも食べられるようになった）"},
  {cat:"縄文時代・道具と住居", q:"地面を掘り下げて柱を立て、屋根をふいて作った縄文時代の住居を何という？", a:"たて穴住居"},
  {cat:"縄文時代・道具と住居", q:"一本の丸太をくりぬいて作った、漁や交易の移動に使われた舟は？", a:"丸木舟"},
  {cat:"縄文時代・信仰と風習", q:"縄文時代、女性をかたどって作られた土製の人形を何という？", a:"土偶"},
  {cat:"縄文時代・信仰と風習", q:"土偶は何のために作られたと考えられている？", a:"豊かな収穫や安産などを祈るまじない（呪術）の道具"},
  {cat:"縄文時代・信仰と風習", q:"縄文時代、成人になるための通過儀礼として歯を抜く風習を何という？", a:"抜歯"},
  {cat:"縄文時代・信仰と風習", q:"自然のすべてのものに霊が宿ると考える、縄文時代の人々の信仰のあり方を何という？", a:"アニミズム"},
  {cat:"縄文時代・遺跡", q:"東京都にある、縄文時代の代表的な貝塚は？", a:"大森貝塚"},
  {cat:"縄文時代・遺跡", q:"大森貝塚を発見したアメリカ人動物学者は？", a:"モース"},
  {cat:"縄文時代・遺跡", q:"貝塚とは何か？", a:"縄文時代の人々が貝がらや魚・動物の骨などの生活ごみを捨てた場所"},
  {cat:"縄文時代・遺跡", q:"貝塚を調査すると何がわかる？", a:"当時の人々の食生活や、周辺の自然環境（海や川が近かったかなど）"},
  {cat:"縄文時代・遺跡", q:"貝塚から見つかる貝や魚の種類を調べると、さらに何がわかる？", a:"それらがとれる季節がわかり、その場所でいつごろどのように暮らしていたかの手がかりになる"},
  {cat:"縄文時代・遺跡", q:"貝塚の位置と今の海岸線を比べると、縄文時代の気候についてどんなことがわかる？", a:"今より気温が高く、海面（海岸線）が今より内陸にあったこと"},
  {cat:"縄文時代・遺跡", q:"青森県にある、縄文時代の大規模な集落跡が発見された遺跡は？", a:"三内丸山遺跡"},
  {cat:"縄文時代・遺跡", q:"三内丸山遺跡の発見から何がわかった？", a:"縄文時代にも多くの人が定住する大規模な集落があったこと"},
  {cat:"交易", q:"縄文時代、矢じりなどの材料として遠方から運ばれてきた、黒くて鋭くわれる石は？", a:"黒曜石"},
  {cat:"交易", q:"縄文時代、装飾品の材料として遠方から運ばれてきた緑色の美しい石は？", a:"ひすい"},
  {cat:"交易", q:"黒曜石やひすいが産地から遠く離れた遺跡でも見つかることから、何がわかる？", a:"縄文時代にはすでに遠方の集団どうしでものを交換し合う交易が行われていたこと"},
  {cat:"交易", q:"地層の中の火山灰の層は、遺跡の年代を調べるうえでどう役立つ？", a:"広い範囲に同じ時期の火山灰が積もるため、離れた遺跡どうしの時代を比べる目印（年代の手がかり）になる"},
  {cat:"比較・整理", q:"打製石器と磨製石器のちがいは？", a:"打製石器は石を打ち欠いて作る、磨製石器は表面を磨いて作る"},
  {cat:"比較・整理", q:"打製石器・磨製石器は、それぞれどちらの時代の代表的な道具？", a:"打製石器＝旧石器時代／磨製石器＝縄文時代"},
  {cat:"比較・整理", q:"旧石器時代の人々と縄文時代の人々、住まい方の一番の違いは？", a:"旧石器時代は大型動物を追って移動する生活、縄文時代は食料が安定し定住してたて穴住居に住むようになった"},
  {cat:"比較・整理", q:"旧石器時代の代表遺跡を2つ挙げると？", a:"岩宿遺跡（群馬県）・野尻湖遺跡（長野県）"},
  {cat:"比較・整理", q:"縄文時代の代表遺跡を2つ挙げると？", a:"大森貝塚（東京都）・三内丸山遺跡（青森県）"},
  {cat:"比較・整理", q:"旧石器時代→縄文時代の順番で、時代の古い方はどちら？", a:"旧石器時代（縄文時代より前）"},
  {cat:"人物", q:"岩宿遺跡を発見した人物は？", a:"相沢忠洋"},
  {cat:"人物", q:"大森貝塚を発見したアメリカ人動物学者は？", a:"モース"},
  {cat:"資料読み取り", q:"旧石器時代に大型動物が日本列島にいた理由を、「大陸」という言葉を使って説明すると？", a:"氷河時代で海面が低く、日本列島がユーラシア大陸と陸続きだったため、大陸の動物が歩いて渡ってこられたから"},
  {cat:"資料読み取り", q:"縄文土器の発明で、人々の食生活はどう変わった？", a:"土器で食料を「煮る」ことができるようになり、あく抜きや硬い食材の調理など、食べられるものの種類が増えた"},
  {cat:"資料読み取り", q:"「氷河時代」とはどのような時代？", a:"地球全体が寒冷で、氷河が広がり海面が今より低かった時代（旧石器時代はこの時期にあたる）"},
  {cat:"用語まとめ", q:"「旧石器時代」「縄文時代」の境目となったできごとは？", a:"気候の温暖化による海面上昇（大陸からの切り離し）と、土器・磨製石器の使用開始"},
  {cat:"用語まとめ", q:"縄文時代の人々の主な生業（暮らしの手段）を3つ挙げると？", a:"狩猟（動物をとる）・採集（木の実などをとる）・漁労（魚や貝をとる）"},
];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const QUESTION_SECONDS = 7;
const ANSWER_SECONDS = 5;
function currentPhaseSeconds() {
  return showingAnswer ? ANSWER_SECONDS : QUESTION_SECONDS;
}
let orderMode = "shuffle"; // "shuffle" | "sequential"
function makeDeck() {
  return orderMode === "sequential" ? DATA.slice() : shuffle(DATA);
}
let deck = makeDeck();
let idx = 0;
let showingAnswer = false;
let paused = false;
let timer = null;
let tickStart = 0;
let remainingOnPause = QUESTION_SECONDS * 1000;

const questionEl = document.getElementById("question");
const answerBox = document.getElementById("answerBox");
const answerText = document.getElementById("answerText");
const categoryEl = document.getElementById("category");
const counterEl = document.getElementById("counter");
const progressBar = document.getElementById("progressBar");
const playPauseBtn = document.getElementById("playPause");
const restartBtn = document.getElementById("restart");
const restartOrderBtn = document.getElementById("restartOrder");
const fullscreenBtn = document.getElementById("fullscreenBtn");

function renderCard() {
  const item = deck[idx];
  categoryEl.textContent = item.cat;
  counterEl.textContent = (idx + 1) + " / " + deck.length;
  questionEl.textContent = item.q;

  answerBox.classList.add("no-transition");
  answerBox.classList.remove("show");
  void answerBox.offsetWidth;
  answerText.textContent = item.a;
  void answerBox.offsetWidth;
  requestAnimationFrame(() => {
    answerBox.classList.remove("no-transition");
  });

  showingAnswer = false;
}

function step() {
  if (!showingAnswer) {
    answerBox.classList.add("show");
    showingAnswer = true;
  } else {
    idx++;
    if (idx >= deck.length) {
      idx = 0;
      deck = makeDeck();
    }
    renderCard();
  }
  progressBar.style.width = "0%";
  startProgress();
}

function startProgress() {
  const seconds = currentPhaseSeconds();
  progressBar.style.transition = "none";
  progressBar.style.width = "0%";
  requestAnimationFrame(() => {
    progressBar.style.transition = "width " + seconds + "s linear";
    progressBar.style.width = "100%";
  });
}

function scheduleNext() {
  clearTimeout(timer);
  const seconds = currentPhaseSeconds();
  tickStart = Date.now();
  remainingOnPause = seconds * 1000;
  timer = setTimeout(() => {
    step();
    if (!paused) scheduleNext();
  }, seconds * 1000);
}

function pause() {
  paused = true;
  clearTimeout(timer);
  const elapsed = Date.now() - tickStart;
  remainingOnPause = Math.max(currentPhaseSeconds() * 1000 - elapsed, 0);
  progressBar.style.transition = "none";
  playPauseBtn.textContent = "▶ 再生";
}

function resume() {
  paused = false;
  playPauseBtn.textContent = "⏸ 一時停止";
  tickStart = Date.now();
  timer = setTimeout(() => {
    step();
    if (!paused) scheduleNext();
  }, remainingOnPause);
  const remainSec = remainingOnPause / 1000;
  requestAnimationFrame(() => {
    progressBar.style.transition = "width " + remainSec + "s linear";
    progressBar.style.width = "100%";
  });
}

playPauseBtn.addEventListener("click", () => {
  if (paused) resume(); else pause();
});

restartBtn.addEventListener("click", () => {
  orderMode = "shuffle";
  deck = makeDeck();
  idx = 0;
  renderCard();
  progressBar.style.width = "0%";
  if (!paused) {
    startProgress();
    scheduleNext();
  }
});

restartOrderBtn.addEventListener("click", () => {
  orderMode = "sequential";
  deck = makeDeck();
  idx = 0;
  renderCard();
  progressBar.style.width = "0%";
  if (!paused) {
    startProgress();
    scheduleNext();
  }
});

function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function updateFullscreenBtn() {
  fullscreenBtn.textContent = isFullscreen() ? "⛶ 全画面をやめる" : "⛶ 全画面";
}
fullscreenBtn.addEventListener("click", () => {
  const el = document.documentElement;
  if (!isFullscreen()) {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) {
      req.call(el);
    } else {
      alert("この端末のSafariでは全画面ボタンに対応していないようです。\nホーム画面に追加したアイコンから開くと、アドレスバーなしで表示できます。");
    }
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) exit.call(document);
  }
});
document.addEventListener("fullscreenchange", updateFullscreenBtn);
document.addEventListener("webkitfullscreenchange", updateFullscreenBtn);

document.querySelector(".card").addEventListener("click", () => {
  clearTimeout(timer);
  step();
  if (!paused) scheduleNext();
});

renderCard();
startProgress();
scheduleNext();
</script>
</body>
</html>
