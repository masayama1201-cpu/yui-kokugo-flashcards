<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12181f">
<title>社会（5年後期 第5回：天皇・貴族の政治と人々のくらし／＋α補足）</title>
<style>
  :root {
    --bg: #12181f;
    --card-bg: #1c2733;
    --accent: #ffb347;
    --answer: #7ed6a5;
    --text: #f5f7fa;
    --sub: #9fb0c3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    overflow: hidden;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    width: 100vw;
    height: 100vh;
    padding: 3vh 5vw;
  }
  .topbar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 2.2vw;
    color: var(--sub);
  }
  .category {
    background: rgba(255,179,71,0.15);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 0.6vh 2vw;
    font-weight: bold;
  }
  .progress-wrap {
    width: 100%;
    height: 1.2vh;
    background: #2a3644;
    border-radius: 999px;
    margin-top: 1.5vh;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s linear;
  }
  .card {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 4vh;
  }
  .qlabel {
    font-size: 2vw;
    letter-spacing: 0.3em;
    color: var(--sub);
  }
  .question {
    font-size: 4.4vw;
    font-weight: 800;
    line-height: 1.4;
    max-width: 90vw;
  }
  .answer-box {
    font-size: 3.6vw;
    font-weight: 800;
    color: var(--answer);
    line-height: 1.4;
    max-width: 90vw;
    min-height: 6vw;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .answer-box.show {
    opacity: 1;
    transform: translateY(0);
  }
  .answer-box.no-transition {
    transition: none !important;
  }
  .answer-box .arrow {
    color: var(--sub);
    font-size: 3vw;
    margin-right: 0.4em;
  }
  .bottombar {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 3vw;
    font-size: 1.8vw;
    color: var(--sub);
  }
  button {
    background: #2a3644;
    color: var(--text);
    border: none;
    border-radius: 999px;
    padding: 1vh 2.2vw;
    font-size: 1.8vw;
    cursor: pointer;
  }
  button:hover { background: #34445a; }
  .hint {
    color: var(--sub);
    font-size: 1.6vw;
  }
  ruby { ruby-position: over; }
  rt {
    font-size: 0.42em;
    font-weight: 600;
    color: var(--sub);
    user-select: none;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="category" id="category">社会・第5回・③補足＋α</span>
    <span id="counter">1 / 6</span>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <div class="card">
    <div class="qlabel">Q</div>
    <div class="question" id="question">読み込み中…</div>
    <div class="answer-box" id="answerBox"><span class="arrow">A</span><span id="answerText"></span></div>
  </div>

  <div class="bottombar">
    <button id="playPause">⏸ 一時停止</button>
    <button id="restart">🔀 シャッフルして最初から</button>
    <button id="restartOrder">📖 テキスト順に最初から</button>
    <button id="fullscreenBtn">⛶ 全画面</button>
    <button onclick="window.open('shakai-review-5.html','_blank')">📊 整理</button>
    <span class="hint">問題7秒→答え5秒で自動的に切り替わります（タップでも操作できます）</span>
  </div>
</div>

<script>
const DATA = [
  {cat:"オプション探求", q:"10世紀以降、藤原元命のような国司が訴えられても、朝廷がほとんど対策をしなかったのはなぜ？", a:"班田収授の法が荘園の増加でうまくいかなくなり、朝廷は国司に税の一部を納めさせる代わりに地方政治のほとんどを任せていたから"},
  {cat:"学び直し②", q:"<ruby>紫式部<rt>むらさきしきぶ</rt></ruby>と<ruby>清少納言<rt>せいしょうなごん</rt></ruby>には、それぞれが仕えた娘についてどんな目的があった？", a:"仕えた娘の知性や教養を高めて、天皇の后にふさわしいようにするという目的"},
  {cat:"シナジー", q:"<ruby>紫式部<rt>むらさきしきぶ</rt></ruby>が書いた日記からは、何を知ることができる？", a:"<ruby>紫式部<rt>むらさきしきぶ</rt></ruby>自身の人となりや、当時の都・<ruby>宮中<rt>きゅうちゅう</rt></ruby>のようす"},
  {cat:"ツキを呼びよせた強運の持ち主", q:"<ruby>藤原道長<rt>ふじわらのみちなが</rt></ruby>は兄弟の中で何番目の子として生まれた？", a:"五男"},
  {cat:"ツキを呼びよせた強運の持ち主", q:"病弱でそれほどの出世を考えていなかった<ruby>藤原道長<rt>ふじわらのみちなが</rt></ruby>が政争を制することができた一因は？", a:"兄たちが相次いで病死したこと、姉や妻の支援があったこと"},
  {cat:"社会探検", q:"かな文字が発達する以前、文を書くときに使われていた、漢字を読みだけに用いる書き方を何という？", a:"<ruby>当て字<rt>あてじ</rt></ruby>（<ruby>万葉仮名<rt>まんようがな</rt></ruby>）"},
];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const QUESTION_SECONDS = 7;
const ANSWER_SECONDS = 5;
function currentPhaseSeconds() {
  return showingAnswer ? ANSWER_SECONDS : QUESTION_SECONDS;
}
let orderMode = "shuffle"; // "shuffle" | "sequential"
function makeDeck() {
  return orderMode === "sequential" ? DATA.slice() : shuffle(DATA);
}
let deck = makeDeck();
let idx = 0;
let showingAnswer = false;
let paused = false;
let timer = null;
let tickStart = 0;
let remainingOnPause = QUESTION_SECONDS * 1000;

const questionEl = document.getElementById("question");
const answerBox = document.getElementById("answerBox");
const answerText = document.getElementById("answerText");
const categoryEl = document.getElementById("category");
const counterEl = document.getElementById("counter");
const progressBar = document.getElementById("progressBar");
const playPauseBtn = document.getElementById("playPause");
const restartBtn = document.getElementById("restart");
const restartOrderBtn = document.getElementById("restartOrder");
const fullscreenBtn = document.getElementById("fullscreenBtn");

function renderCard() {
  const item = deck[idx];
  categoryEl.textContent = item.cat;
  counterEl.textContent = (idx + 1) + " / " + deck.length;
  questionEl.innerHTML = item.q;

  answerBox.classList.add("no-transition");
  answerBox.classList.remove("show");
  void answerBox.offsetWidth;
  answerText.innerHTML = item.a;
  void answerBox.offsetWidth;
  requestAnimationFrame(() => {
    answerBox.classList.remove("no-transition");
  });

  showingAnswer = false;
}

function step() {
  if (!showingAnswer) {
    answerBox.classList.add("show");
    showingAnswer = true;
  } else {
    idx++;
    if (idx >= deck.length) {
      idx = 0;
      deck = makeDeck();
    }
    renderCard();
  }
  progressBar.style.width = "0%";
  startProgress();
}

function startProgress() {
  const seconds = currentPhaseSeconds();
  progressBar.style.transition = "none";
  progressBar.style.width = "0%";
  requestAnimationFrame(() => {
    progressBar.style.transition = "width " + seconds + "s linear";
    progressBar.style.width = "100%";
  });
}

function scheduleNext() {
  clearTimeout(timer);
  const seconds = currentPhaseSeconds();
  tickStart = Date.now();
  remainingOnPause = seconds * 1000;
  timer = setTimeout(() => {
    step();
    if (!paused) scheduleNext();
  }, seconds * 1000);
}

function pause() {
  paused = true;
  clearTimeout(timer);
  const elapsed = Date.now() - tickStart;
  remainingOnPause = Math.max(currentPhaseSeconds() * 1000 - elapsed, 0);
  progressBar.style.transition = "none";
  playPauseBtn.textContent = "▶ 再生";
}

function resume() {
  paused = false;
  playPauseBtn.textContent = "⏸ 一時停止";
  tickStart = Date.now();
  timer = setTimeout(() => {
    step();
    if (!paused) scheduleNext();
  }, remainingOnPause);
  const remainSec = remainingOnPause / 1000;
  requestAnimationFrame(() => {
    progressBar.style.transition = "width " + remainSec + "s linear";
    progressBar.style.width = "100%";
  });
}

playPauseBtn.addEventListener("click", () => {
  if (paused) resume(); else pause();
});

restartBtn.addEventListener("click", () => {
  orderMode = "shuffle";
  deck = makeDeck();
  idx = 0;
  renderCard();
  progressBar.style.width = "0%";
  if (!paused) {
    startProgress();
    scheduleNext();
  }
});

restartOrderBtn.addEventListener("click", () => {
  orderMode = "sequential";
  deck = makeDeck();
  idx = 0;
  renderCard();
  progressBar.style.width = "0%";
  if (!paused) {
    startProgress();
    scheduleNext();
  }
});

function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function updateFullscreenBtn() {
  fullscreenBtn.textContent = isFullscreen() ? "⛶ 全画面をやめる" : "⛶ 全画面";
}
fullscreenBtn.addEventListener("click", () => {
  const el = document.documentElement;
  if (!isFullscreen()) {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) {
      req.call(el);
    } else {
      alert("この端末のSafariでは全画面ボタンに対応していないようです。\nホーム画面に追加したアイコンから開くと、アドレスバーなしで表示できます。");
    }
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) exit.call(document);
  }
});
document.addEventListener("fullscreenchange", updateFullscreenBtn);
document.addEventListener("webkitfullscreenchange", updateFullscreenBtn);

document.querySelector(".card").addEventListener("click", () => {
  clearTimeout(timer);
  step();
  if (!paused) scheduleNext();
});

renderCard();
startProgress();
scheduleNext();
</script>
</body>
</html>
