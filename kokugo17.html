<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12181f">
<title>国語 語句のたしなみ（P28〜31・Aランク）</title>
<style>
  :root {
    --bg: #12181f;
    --card-bg: #1c2733;
    --accent: #ffb347;
    --answer: #7ed6a5;
    --text: #f5f7fa;
    --sub: #9fb0c3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    overflow: hidden;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    width: 100vw;
    height: 100vh;
    padding: 3vh 5vw;
  }
  .topbar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 2.2vw;
    color: var(--sub);
  }
  .category {
    background: rgba(255,179,71,0.15);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 0.6vh 2vw;
    font-weight: bold;
  }
  .progress-wrap {
    width: 100%;
    height: 1.2vh;
    background: #2a3644;
    border-radius: 999px;
    margin-top: 1.5vh;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s linear;
  }
  .card {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 4vh;
  }
  .qlabel {
    font-size: 2vw;
    letter-spacing: 0.3em;
    color: var(--sub);
  }
  .question {
    font-size: 4.4vw;
    font-weight: 800;
    line-height: 1.5;
    max-width: 90vw;
  }
  .answer-box {
    font-size: 3.6vw;
    font-weight: 800;
    color: var(--answer);
    line-height: 1.4;
    max-width: 90vw;
    min-height: 6vw;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .answer-box.show {
    opacity: 1;
    transform: translateY(0);
  }
  .answer-box.no-transition {
    transition: none !important;
  }
  .answer-box .arrow {
    color: var(--sub);
    font-size: 3vw;
    margin-right: 0.4em;
  }
  .meaning {
    display: block;
    font-size: 2.4vw;
    color: var(--sub);
    margin-top: 1vh;
  }
  .bottombar {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 3vw;
    font-size: 1.8vw;
    color: var(--sub);
  }
  button {
    background: #2a3644;
    color: var(--text);
    border: none;
    border-radius: 999px;
    padding: 1vh 2.2vw;
    font-size: 1.8vw;
    cursor: pointer;
  }
  button:hover { background: #34445a; }
  .hint {
    color: var(--sub);
    font-size: 1.6vw;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="category" id="category">語句のたしなみ（P28〜31・Aランク）</span>
    <span id="counter">1 / 53</span>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <div class="card">
    <div class="qlabel">Q</div>
    <div class="question" id="question">読み込み中…</div>
    <div class="answer-box" id="answerBox"><span class="arrow">A</span><span id="answerText"></span><span class="meaning" id="meaningText"></span></div>
  </div>

  <div class="bottombar">
    <button id="playPause">⏸ 一時停止</button>
    <button id="restart">🔀 シャッフルして最初から</button>
    <button id="fullscreenBtn">⛶ 全画面</button>
    <span class="hint">問題7秒→答え5秒で自動的に切り替わります（タップでも操作できます）</span>
  </div>
</div>

<script>
const DATA = [
  {cat:"P28", q:"「あんばい」の意味は？", a:"具合。", m:"例）体を悪くしたと聞いていましたが、最近のあんばいはどうですか。"},
  {cat:"P28", q:"「あわよくば」の意味は？", a:"うまくいけば。", m:"例）代理を務めつつ、あわよくば組織に君臨しようとたくらむ。"},
  {cat:"P28", q:"「あらまし」の意味は？", a:"おおまかな内容。", m:"例）事件のあらましを聞いて、何があったか理解しよう。"},
  {cat:"P28", q:"「あまねく」の意味は？", a:"及ばないところがなく、一般的に（＝広く行き渡って）。", m:"例）アメリカ大統領の名前は、あまねく知れ渡っている。"},
  {cat:"P28", q:"「あまつさえ」の意味は？", a:"さらに。（悪いことが重なる時に使う）", m:"例）雨が激しく降ってきた。あまつさえ風も出てきた。"},
  {cat:"P28", q:"「あながち」の意味は？", a:"必ずしも。", m:"例）彼の言っていることは、あながち間違いだとも言えない。"},
  {cat:"P28", q:"「あてこする」の意味は？", a:"他のことを口実にして、相手の悪口や皮肉を言う。", m:"例）優等生の彼をほめ、息子が宿題さえしないことをあてこする。"},
  {cat:"P28", q:"「あたかも」の意味は？", a:"まるで。", m:"例）空に浮かぶ雲は、あたかもわたがしのようだ。"},
  {cat:"P28", q:"「あしからず」の意味は？", a:"悪く思わないで。", m:"例）ご希望に添えませんが、あしからずご了承ください。"},
  {cat:"P28", q:"「あくまで」の意味は？", a:"どこまでも。", m:"例）君があくまで嘘をつきとおすなら、もう絶交だよ。"},
  {cat:"P28", q:"「あくせく」の意味は？", a:"小さなことを気にして落ち着かないさま。", m:"例）彼は趣味も持たず、生きるためにあくせく働いてきた。"},
  {cat:"P28", q:"「あからさま」の意味は？", a:"明白なさま。", m:"例）嫌いなピーマンを出され、あからさまにいやな顔をする。"},
  {cat:"P28", q:"「あえない」の意味は？", a:"あっけない。", m:"例）坂本龍馬は、あえない最期をとげた。"},

  {cat:"P29", q:"「いぶかる」の意味は？", a:"疑わしく思う。", m:"例）彼の不自然な態度をいぶかる。"},
  {cat:"P29", q:"「いなめない」の意味は？", a:"否定できない。", m:"例）チームの敗北に私の無気力が関係しているのはいなめない。"},
  {cat:"P29", q:"「いとう」の意味は？", a:"いやがって避ける。", m:"例）世話をいとうことなく、低学年と交流する六年生の姿に感心する。"},
  {cat:"P29", q:"「いつくしむ」の意味は？", a:"弱者などをかわいがって大切にする。", m:"例）先生は、命あるものをいつくしむ心が大切だと生徒たちに説いた。"},
  {cat:"P29", q:"「いたたまらない」の意味は？", a:"じっとしていられない。（「いたたまれない」ともいう）", m:"例）私は、画面に映し出された惨劇を見ていたたまらない気持ちになった。"},
  {cat:"P29", q:"「いたずらに」の意味は？", a:"無駄に。", m:"例）命は永遠ではないのだから、いたずらに時を過ごしてはならない。"},
  {cat:"P29", q:"「いたいけ」の意味は？", a:"子どものいじらしいさまや、かわいいさま。", m:"例）君の弟はまだいたいけな子どもなのだから、そう怒るな。"},
  {cat:"P29", q:"「いそしむ」の意味は？", a:"熱心にはげむ。", m:"例）朝早くから夜遅くまで、ボランティア活動にいそしむ。"},
  {cat:"P29", q:"「いじらしい」の意味は？", a:"幼い者の様子が同情したくなるほどかわいそうだ。", m:"例）幼い子が欲しいものを我慢する姿はいじらしい。"},
  {cat:"P29", q:"「いさめる」の意味は？", a:"（主に目上の人に対して）欠点を言って改めさせようとする。", m:"例）肝臓を悪くした父に、酒をやめるようにいさめる。"},
  {cat:"P29", q:"「いきさつ」の意味は？", a:"ことのなりゆき。", m:"例）彼を泣かせるに至ったいきさつを話し、理解を得る。"},
  {cat:"P29", q:"「いかんなく」の意味は？", a:"申し分なく十分に。", m:"例）実力をいかんなく発揮して、チームを勝利に導く。"},
  {cat:"P29", q:"「いささか」の意味は？", a:"少し。", m:"例）この問題は五年生が解くにはいささか難しい。"},

  {cat:"P30", q:"「うろたえる」の意味は？", a:"どうしてよいか分からず慌てる。", m:"例）みんなの前で突然、秘密を暴露され、うろたえる。"},
  {cat:"P30", q:"「うやうやしい」の意味は？", a:"相手を敬い、礼儀正しく丁寧なさま。", m:"例）二人は神前で、うやうやしい様子で深く頭を下げた。"},
  {cat:"P30", q:"「うとましい」の意味は？", a:"好ましくない。", m:"例）人を見下す言動が多い彼女をうとましい人は少なくない。"},
  {cat:"P30", q:"「うさんくさい」の意味は？", a:"様子や態度がなんとなくあやしい。", m:"例）何ともうさんくさい話なので、完全には信じられない。"},
  {cat:"P30", q:"「うそぶく」の意味は？", a:"わざととぼけたり、大きなことを言ったりする。", m:"例）自分が犯した罪なのに、無実であると平気な顔でうそぶく。"},
  {cat:"P30", q:"「うつつ」の意味は？", a:"正気。現実。", m:"例）夢かうつつか分からない不思議な気持ち。"},
  {cat:"P30", q:"「うつろ」の意味は？", a:"生気がないさま。ぼんやりしているさま。", m:"例）大好きな人にふられ、しばらくはうつろな日々を過ごした。"},
  {cat:"P30", q:"「いんねん」の意味は？", a:"運命によってつながっている関係。", m:"例）こんな所で出会ったのも何かのいんねんだろう。"},
  {cat:"P30", q:"「ういういしい」の意味は？", a:"物慣れない感じで新鮮にみえる。", m:"例）新入生のういういしい姿に、思わずほほえむ。"},
  {cat:"P30", q:"「うごめく」の意味は？", a:"もぞもぞと動く。", m:"例）土の下でたくさんの虫がうごめくさまを想像するとぞっとする。"},
  {cat:"P30", q:"「いまいましい」の意味は？", a:"腹立たしい。", m:"例）海に行く予定をだめにした雨がいまいましい。"},
  {cat:"P30", q:"「いましめる」の意味は？", a:"悪いことをしないよう、教えさとして禁止する。", m:"例）大量得点をしたところで、監督は選手に再度油断をいましめる。"},
  {cat:"P30", q:"「いまわしい」の意味は？", a:"いやで不愉快なこと。", m:"例）ひとりでに割れたコップは、いまわしいことが起きる前兆か。"},

  {cat:"P31", q:"「おりいって」の意味は？", a:"ぜひとも。", m:"例）この件に詳しい君に、おりいって頼みたいことがある。"},
  {cat:"P31", q:"「おりしも」の意味は？", a:"ちょうどその時。", m:"例）斡揚げをしようとしていたら、おりしも風が吹いてきた。"},
  {cat:"P31", q:"「かいがいしい」の意味は？", a:"手際よく、骨身を惜しまず働くさま。", m:"例）祖父を介護する母のかいがいしい働きぶりに頭が下がる。"},
  {cat:"P31", q:"「おびただしい」の意味は？", a:"非常に数の多い。", m:"例）川を埋め尽くすほどのおびただしい鮭が、次々と川をのぼっていく。"},
  {cat:"P31", q:"「おもねる」の意味は？", a:"人の機嫌をとって気に入られようとする。", m:"例）出世をたくらみ、上司におもねる。"},
  {cat:"P31", q:"「おもはゆい」の意味は？", a:"きまりが悪い。恥ずかしい。", m:"例）手放しにほめられ、おもはゆい気持ちになり、ほおがゆるんだ。"},
  {cat:"P31", q:"「おもむろに」の意味は？", a:"落ち着いてゆっくり行動するさま。", m:"例）本番をむかえ、心を落ち着かせておもむろに行動を開始する。"},
  {cat:"P31", q:"「おこたる」の意味は？", a:"なまけていい加減にする。", m:"例）日々のトレーニングをおこたると、よい結果は出ないだろう。"},
  {cat:"P31", q:"「おごる」の意味は？", a:"権力や財力を頼みにして、我が儘にふるまう。", m:"例）自分がチャンピオンであるとおごることなく、謙虚さを貫く。"},
  {cat:"P31", q:"「おしなべて」の意味は？", a:"全体に渡って。", m:"例）彼女は、四教科ともおしなべてよくできた子どもだった。"},
  {cat:"P31", q:"「えげつない」の意味は？", a:"露骨でいやらしい。", m:"例）金儲けが見え見えのえげつない商売方法。"},
  {cat:"P31", q:"「おくびにもださない」の意味は？", a:"それらしい様子もみせず、また口にもしない。（「おくび」とは、げっぷのこと）", m:"例）今までの苦労をおくびにもださないで、なおも仕事を続ける。"},
  {cat:"P31", q:"「おくゆかしい」の意味は？", a:"上品であったり、動作などが控え目だったりする。", m:"例）誰の前でも自己主張しすぎない彼女はおくゆかしい人だと思う。"},
  {cat:"P31", q:"「おこがましい」の意味は？", a:"生意気だ。", m:"例）先輩を差し置いて意見するのはおこがましいと思う。"},
];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const QUESTION_SECONDS = 7;
const ANSWER_SECONDS = 5;
function currentPhaseSeconds() {
  return showingAnswer ? ANSWER_SECONDS : QUESTION_SECONDS;
}
let deck = shuffle(DATA);
let idx = 0;
let showingAnswer = false;
let paused = false;
let timer = null;
let tickStart = 0;
let remainingOnPause = QUESTION_SECONDS * 1000;

const questionEl = document.getElementById("question");
const answerBox = document.getElementById("answerBox");
const answerText = document.getElementById("answerText");
const meaningText = document.getElementById("meaningText");
const categoryEl = document.getElementById("category");
const counterEl = document.getElementById("counter");
const progressBar = document.getElementById("progressBar");
const playPauseBtn = document.getElementById("playPause");
const restartBtn = document.getElementById("restart");
const fullscreenBtn = document.getElementById("fullscreenBtn");

function renderCard() {
  const item = deck[idx];
  counterEl.textContent = (idx + 1) + " / " + deck.length;
  questionEl.textContent = item.q;

  answerBox.classList.add("no-transition");
  answerBox.classList.remove("show");
  void answerBox.offsetWidth;
  answerText.textContent = item.a;
  meaningText.textContent = item.m;
  void answerBox.offsetWidth;
  requestAnimationFrame(() => {
    answerBox.classList.remove("no-transition");
  });

  showingAnswer = false;
}

function step() {
  if (!showingAnswer) {
    answerBox.classList.add("show");
    showingAnswer = true;
  } else {
    idx++;
    if (idx >= deck.length) {
      idx = 0;
      deck = shuffle(DATA);
    }
    renderCard();
  }
  progressBar.style.width = "0%";
  startProgress();
}

function startProgress() {
  const seconds = currentPhaseSeconds();
  progressBar.style.transition = "none";
  progressBar.style.width = "0%";
  requestAnimationFrame(() => {
    progressBar.style.transition = "width " + seconds + "s linear";
    progressBar.style.width = "100%";
  });
}

function scheduleNext() {
  clearTimeout(timer);
  const seconds = currentPhaseSeconds();
  tickStart = Date.now();
  remainingOnPause = seconds * 1000;
  timer = setTimeout(() => {
    step();
    if (!paused) scheduleNext();
  }, seconds * 1000);
}

function pause() {
  paused = true;
  clearTimeout(timer);
  const elapsed = Date.now() - tickStart;
  remainingOnPause = Math.max(currentPhaseSeconds() * 1000 - elapsed, 0);
  progressBar.style.transition = "none";
  playPauseBtn.textContent = "▶ 再生";
}

function resume() {
  paused = false;
  playPauseBtn.textContent = "⏸ 一時停止";
  tickStart = Date.now();
  timer = setTimeout(() => {
    step();
    if (!paused) scheduleNext();
  }, remainingOnPause);
  const remainSec = remainingOnPause / 1000;
  requestAnimationFrame(() => {
    progressBar.style.transition = "width " + remainSec + "s linear";
    progressBar.style.width = "100%";
  });
}

playPauseBtn.addEventListener("click", () => {
  if (paused) resume(); else pause();
});

restartBtn.addEventListener("click", () => {
  deck = shuffle(DATA);
  idx = 0;
  renderCard();
  progressBar.style.width = "0%";
  if (!paused) {
    startProgress();
    scheduleNext();
  }
});

function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function updateFullscreenBtn() {
  fullscreenBtn.textContent = isFullscreen() ? "⛶ 全画面をやめる" : "⛶ 全画面";
}
fullscreenBtn.addEventListener("click", () => {
  const el = document.documentElement;
  if (!isFullscreen()) {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) {
      req.call(el);
    } else {
      alert("この端末のSafariでは全画面ボタンに対応していないようです。\nホーム画面に追加したアイコンから開くと、アドレスバーなしで表示できます。");
    }
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) exit.call(document);
  }
});
document.addEventListener("fullscreenchange", updateFullscreenBtn);
document.addEventListener("webkitfullscreenchange", updateFullscreenBtn);

document.querySelector(".card").addEventListener("click", () => {
  clearTimeout(timer);
  step();
  if (!paused) scheduleNext();
});

renderCard();
startProgress();
scheduleNext();
</script>
</body>
</html>
