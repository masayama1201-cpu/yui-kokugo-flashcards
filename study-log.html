<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12181f">
<title>結衣さんの学習カレンダー</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    margin: 0;
    padding: 18px;
    padding-bottom: calc(18px + env(safe-area-inset-bottom));
    background: #f7f8fa;
    color: #1e293b;
    max-width: 680px;
    margin-left: auto;
    margin-right: auto;
  }
  h1 { font-size: 19px; margin: 4px 2px 2px; }
  .sub { color: #64748b; font-size: 12px; margin: 0 2px 16px; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: #64748b; margin: 0 2px 14px; }
  .legend span.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 3px; vertical-align: -1px; }
  .err { color: #dc2626; font-size: 13px; padding: 12px; background: #fef2f2; border-radius: 10px; margin-bottom: 14px; }
  .loading { color: #94a3b8; font-size: 13px; padding: 16px; text-align: center; }

  .monthbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .monthbar button { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; width: 38px; height: 38px; font-size: 15px; cursor: pointer; }
  .monthbar .label { font-size: 16px; font-weight: 700; }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .dow { text-align: center; font-size: 11px; color: #94a3b8; padding-bottom: 4px; }
  .day {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    min-height: 92px; padding: 4px 4px 5px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .day.pad { background: transparent; border: none; }
  .day.today { border: 2px solid #1e293b; }
  .daynum { font-size: 11px; color: #94a3b8; text-align: right; padding-right: 1px; }
  .day.today .daynum { color: #1e293b; font-weight: 700; }

  .dailyrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
  .dot {
    font-size: 9px; font-weight: 700; text-align: center; border-radius: 4px;
    padding: 2px 0; cursor: pointer; line-height: 1.2;
  }
  .dot.done { background: #dcfce7; color: #166534; }
  .dot.bad { background: #fee2e2; color: #b91c1c; }
  .dot.future { background: #f1f5f9; color: #cbd5e1; cursor: default; }

  .chip {
    font-size: 10px; border-radius: 6px; padding: 2px 4px;
    display: flex; align-items: center; justify-content: space-between; gap: 2px;
    cursor: pointer; line-height: 1.3;
  }
  .chip.done { background: #dcfce7; color: #166534; }
  .chip.undone-future { background: #f1f5f9; color: #94a3b8; }
  .chip.undone-overdue { background: #fff7ed; color: #c2410c; font-weight: 700; }

  footer { text-align: center; color: #cbd5e1; font-size: 11px; margin-top: 30px; }
</style>
</head>
<body>
  <h1>結衣さんの学習カレンダー</h1>
  <p class="sub">日々の課題（計・社・理・見）と宿題（国算社理＋回）をまとめて管理します。タップで完了/未完了を切り替えます。</p>
  <div class="legend">
    <span><span class="sw" style="background:#dcfce7"></span>済</span>
    <span><span class="sw" style="background:#fee2e2"></span>未（計算・基礎・見直し）</span>
    <span><span class="sw" style="background:#fff7ed"></span>未（宿題）</span>
    <span><span class="sw" style="background:#f1f5f9"></span>まだ先</span>
  </div>
  <div id="errBox"></div>

  <div class="monthbar">
    <button id="prevBtn">◀</button>
    <div class="label" id="monthLabel"></div>
    <button id="nextBtn">▶</button>
  </div>
  <div class="grid" id="grid"><div class="loading">読み込み中…</div></div>

  <footer>結衣さんの学習カレンダー（Firebase版）／ 計=計算　社=社会の基礎　理=理科の基礎　見=育成テストの見直し</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, deleteDoc, updateDoc, getDocs,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDGKn9yfsUngHa1vIvcE_Fi9ljBv901TD4",
  authDomain: "yui-stydy-log.firebaseapp.com",
  projectId: "yui-stydy-log",
  storageBucket: "yui-stydy-log.firebasestorage.app",
  messagingSenderId: "422930044760",
  appId: "1:422930044760:web:eeca389e974968d8cef72d",
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const LOGS = collection(db, "logs");
const HW = collection(db, "homework");

const DAILY_CATS = [
  { name: "計算", code: "calc", short: "計" },
  { name: "社会の基礎", code: "shakai", short: "社" },
  { name: "理科の基礎", code: "rika", short: "理" },
  { name: "育成テストの見直し", code: "review", short: "見" },
];
const SUBJECT_SHORT = { "国語": "国", "算数": "算", "社会": "社", "理科": "理" };
const DOW = ["日", "月", "火", "水", "木", "金", "土"];

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function pad(n) { return String(n).padStart(2, "0"); }
function showError(msg) { document.getElementById("errBox").innerHTML = '<div class="err">' + msg + "</div>"; }

let viewYear, viewMonth;
{
  const t = new Date();
  viewYear = t.getFullYear();
  viewMonth = t.getMonth();
}
let logItems = [];   // { date, category }
let hwItems = [];    // { id, title, subject, round, lessonDate, done }

async function readLogs() {
  const snap = await getDocs(LOGS);
  const items = [];
  snap.forEach((d) => items.push(d.data()));
  return items;
}
async function readHomework() {
  const snap = await getDocs(HW);
  const arr = [];
  snap.forEach((d) => arr.push({ id: d.id, ...d.data() }));
  return arr;
}

async function toggleDaily(dateStr, cat, isDoneNow) {
  const id = dateStr.replace(/-/g, "") + "-" + cat.code;
  try {
    if (isDoneNow) {
      await deleteDoc(doc(db, "logs", id));
      logItems = logItems.filter((it) => !(it.date === dateStr && it.category === cat.name));
    } else {
      await setDoc(doc(db, "logs", id), { date: dateStr, category: cat.name });
      logItems.push({ date: dateStr, category: cat.name });
    }
    renderCalendar();
  } catch (e) {
    showError("更新に失敗しました: " + e.message);
  }
}

async function toggleHomework(item) {
  try {
    await updateDoc(doc(db, "homework", item.id), { done: !item.done });
    item.done = !item.done;
    renderCalendar();
  } catch (e) {
    showError("更新に失敗しました: " + e.message);
  }
}

function renderCalendar() {
  const today = todayStr();
  const first = new Date(viewYear, viewMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  document.getElementById("monthLabel").textContent = viewYear + "年" + (viewMonth + 1) + "月";

  const doneSet = new Set(logItems.map((it) => it.date + "|" + it.category));
  const hwByDate = {};
  for (const it of hwItems) {
    if (!it.lessonDate) continue;
    (hwByDate[it.lessonDate] = hwByDate[it.lessonDate] || []).push(it);
  }

  const grid = document.getElementById("grid");
  grid.innerHTML = DOW.map((d) => '<div class="dow">' + d + "</div>").join("");
  for (let i = 0; i < startDow; i++) grid.innerHTML += '<div class="day pad"></div>';

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = viewYear + "-" + pad(viewMonth + 1) + "-" + pad(d);
    const isToday = dateStr === today;
    const isFuture = dateStr > today;
    const cell = document.createElement("div");
    cell.className = "day" + (isToday ? " today" : "");

    let html = '<div class="daynum">' + d + "</div>";
    html += '<div class="dailyrow">';
    for (const cat of DAILY_CATS) {
      const done = doneSet.has(dateStr + "|" + cat.name);
      let cls = "future", mark = cat.short;
      if (done) { cls = "done"; mark = cat.short + "✓"; }
      else if (!isFuture) { cls = "bad"; mark = cat.short + "！"; }
      html += '<div class="dot ' + cls + '" data-date="' + dateStr + '" data-code="' + cat.code + '" data-done="' + done + '">' + mark + "</div>";
    }
    html += "</div>";

    const dayHw = hwByDate[dateStr] || [];
    for (const it of dayHw) {
      let cls = "undone-future", mark = "・";
      if (it.done) { cls = "done"; mark = "✓"; }
      else if (dateStr <= today) { cls = "undone-overdue"; mark = "！"; }
      html += '<div class="chip ' + cls + '" data-id="' + it.id + '"><span>' + SUBJECT_SHORT[it.subject] + it.round + "</span><span>" + mark + "</span></div>";
    }
    cell.innerHTML = html;
    grid.appendChild(cell);
  }

  grid.querySelectorAll(".dot").forEach((dot) => {
    if (dot.classList.contains("future")) return;
    dot.onclick = () => {
      const cat = DAILY_CATS.find((c) => c.code === dot.dataset.code);
      toggleDaily(dot.dataset.date, cat, dot.dataset.done === "true");
    };
  });
  grid.querySelectorAll(".chip").forEach((chip) => {
    chip.onclick = () => {
      const item = hwItems.find((it) => it.id === chip.dataset.id);
      if (item) toggleHomework(item);
    };
  });
}

document.getElementById("prevBtn").onclick = () => {
  viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  renderCalendar();
};
document.getElementById("nextBtn").onclick = () => {
  viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderCalendar();
};

async function init() {
  try {
    [logItems, hwItems] = await Promise.all([readLogs(), readHomework()]);
    document.getElementById("errBox").innerHTML = "";
  } catch (e) {
    showError("読み込みに失敗しました: " + e.message);
    document.getElementById("grid").innerHTML = "";
    return;
  }
  renderCalendar();
}
init();
</script>
</body>
</html>
