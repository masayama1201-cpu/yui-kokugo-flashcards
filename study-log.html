<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12181f">
<title>学習カレンダー</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    margin: 0;
    padding: 12px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    background: #f7f8fa;
    color: #1e293b;
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
  }
  h1 { font-size: 24px; margin: 4px 2px 4px; }
  .sub { color: #64748b; font-size: 15px; margin: 0 2px 18px; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 14px; color: #475569; margin: 0 2px 16px; }
  .legend span.sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; margin-right: 5px; vertical-align: -2px; }
  .err { color: #dc2626; font-size: 15px; padding: 14px; background: #fef2f2; border-radius: 10px; margin-bottom: 16px; }
  .loading { color: #94a3b8; font-size: 15px; padding: 20px; text-align: center; }

  .monthbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .monthbar button { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; width: 48px; height: 48px; font-size: 18px; cursor: pointer; }
  .monthbar .label { font-size: 22px; font-weight: 700; }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .dow { text-align: center; font-size: 13px; font-weight: 700; color: #94a3b8; padding-bottom: 6px; }
  .day {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    min-height: 128px; padding: 4px 3px 4px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .day.pad { background: transparent; border: none; }
  .day.today { border: 3px solid #1e293b; }
  .daynum { font-size: 14px; color: #94a3b8; text-align: right; padding-right: 2px; font-weight: 600; }
  .day.today .daynum { color: #1e293b; font-weight: 800; }

  .dailyrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
  .dot {
    font-size: 15px; font-weight: 800; text-align: center; border-radius: 5px;
    padding: 3px 0; cursor: pointer; line-height: 1.3;
  }
  .dot.done { background: #dcfce7; color: #166534; }
  .dot.bad { background: #fef3c7; color: #b45309; }
  .dot.future { background: #f1f5f9; color: #cbd5e1; cursor: default; }
  .dot.skipped, .chip.skipped { background: #e2e8f0; color: #64748b; }
  .dot, .chip { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }

  .chip {
    font-size: 13px; font-weight: 700; border-radius: 6px; padding: 3px 5px;
    display: flex; align-items: center; justify-content: center; gap: 3px;
    cursor: pointer; line-height: 1.3;
  }
  .chip.done { background: #dcfce7; color: #166534; }
  .chip.undone-future { background: #f1f5f9; color: #94a3b8; }
  .chip.undone-overdue { background: #fff7ed; color: #c2410c; }
  .chip.undone-overdue.review { background: #ede9fe; color: #6d28d9; }

  h2 { font-size: 16px; color: #334155; margin: 24px 2px 10px; }
  .summary { display: flex; flex-wrap: wrap; gap: 10px; }
  .scard {
    flex: 1 1 130px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
    padding: 12px 14px; text-align: center;
  }
  .scard .n { font-size: 26px; font-weight: 800; line-height: 1.1; }
  .scard .l { font-size: 12px; color: #64748b; margin-top: 2px; }
  .scard.zero .n { color: #16a34a; }
  .scard.some .n { color: #b45309; }
  .scard.some.hw .n { color: #c2410c; }
  .scard.some.review .n { color: #6d28d9; }
  .scard .tdone { font-size: 12px; font-weight: 700; color: #16a34a; margin-top: 4px; }
  .scard .tdone.none { color: #cbd5e1; }
  .scard.todaycard { background: #f0fdf4; border-color: #86efac; }
  .scard.todaycard .n { color: #15803d; }

  #progress { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px 10px 10px; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 170px; }
  .bcol { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; }
  .bnum { font-size: 14px; font-weight: 800; color: #334155; height: 20px; }
  .bstack { flex: 1; width: 70%; max-width: 46px; display: flex; flex-direction: column-reverse; gap: 2px; }
  .bseg { width: 100%; border-radius: 4px; min-height: 3px; }
  .blab { font-size: 11px; color: #94a3b8; text-align: center; margin-top: 4px; line-height: 1.3; }
  .bcol.today .blab, .bcol.today .bnum { color: #1e293b; font-weight: 800; }
  .blegend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: #475569; margin-top: 10px; justify-content: center; }
  .blegend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .rangebar { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; margin-bottom: 10px; }
  .rbtn { background: #fff; border: 1px solid #e2e8f0; border-radius: 999px; padding: 6px 12px; font-size: 13px; color: #475569; cursor: pointer; }
  .rbtn.on { background: #1e293b; border-color: #1e293b; color: #fff; font-weight: 700; }
  @media (max-width: 480px) { .blab { font-size: 9px; } .bars { gap: 3px; } }
  .bars.dense { gap: 2px; }
  .bars.dense .bstack { width: 80%; }
  .bars.dense .bnum { font-size: 10px; }
  .bars.dense .blab { font-size: 9px; white-space: nowrap; }
  .bnote { font-size: 11px; color: #94a3b8; text-align: center; margin-top: 6px; }

  footer { text-align: center; color: #cbd5e1; font-size: 12px; margin-top: 30px; }

  @media (max-width: 480px) {
    .day { min-height: 110px; }
    .dot { font-size: 13px; }
    .chip { font-size: 11px; }
  }
</style>
</head>
<body>
  <h1 id="pageTitle">学習カレンダー</h1>
  <p class="sub">日々の課題（計・社・理）、授業の宿題、テストの見直しをまとめて管理します。タップで完了/未完了を切り替えます。長押しで「やったことにする（－）」になり、やり残しからは消えますが消化数には数えません。</p>
  <div class="legend">
    <span><span class="sw" style="background:#dcfce7"></span>済</span>
    <span><span class="sw" style="background:#fef3c7"></span>未（日々の課題）</span>
    <span><span class="sw" style="background:#fff7ed"></span>未（宿題）</span>
    <span><span class="sw" style="background:#ede9fe"></span>未（見直し）</span>
    <span><span class="sw" style="background:#e2e8f0"></span>やったことにした（長押し）</span>
    <span><span class="sw" style="background:#f1f5f9"></span>まだ先</span>
  </div>
  <div id="errBox"></div>

  <div class="monthbar">
    <button id="prevBtn">◀</button>
    <div class="label" id="monthLabel"></div>
    <button id="nextBtn">▶</button>
  </div>
  <div class="grid" id="grid"><div class="loading">読み込み中…</div></div>

  <h2 id="summaryHeading">現時点のやり残し</h2>
  <div class="summary" id="summary"></div>

  <h2 id="progressHeading">直近2週間の消化数</h2>
  <div id="progress"></div>

  <footer id="pageFooter">学習カレンダー（Firebase版）／ 計=計算　社=社会の基礎　理=理科の基礎／宿題チップは国算社理＋回、見直しチップは教科＋「見」</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, deleteDoc, updateDoc, getDocs, deleteField,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDGKn9yfsUngHa1vIvcE_Fi9ljBv901TD4",
  authDomain: "yui-stydy-log.firebaseapp.com",
  projectId: "yui-stydy-log",
  storageBucket: "yui-stydy-log.firebasestorage.app",
  messagingSenderId: "422930044760",
  appId: "1:422930044760:web:eeca389e974968d8cef72d",
};
const STUDENTS = {
  yui:    { name: "結衣", logsCol: "logs",         hwCol: "homework" },
  daichi: { name: "大智", logsCol: "logs_daichi",  hwCol: "homework_daichi" },
};
const studentKey = new URLSearchParams(location.search).get("student") in STUDENTS
  ? new URLSearchParams(location.search).get("student")
  : "yui";
const student = STUDENTS[studentKey];

document.title = student.name + "さんの学習カレンダー";
document.getElementById("pageTitle").textContent = student.name + "さんの学習カレンダー";
document.getElementById("pageFooter").textContent =
  student.name + "さんの学習カレンダー（Firebase版）／ 計=計算　社=社会の基礎　理=理科の基礎／宿題チップは国算社理＋回、見直しチップは教科＋「見」";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const LOGS = collection(db, student.logsCol);
const HW = collection(db, student.hwCol);

const DAILY_CATS = [
  { name: "計算", code: "calc", short: "計" },
  { name: "社会の基礎", code: "shakai", short: "社" },
  { name: "理科の基礎", code: "rika", short: "理" },
];
const SUBJECT_SHORT = { "国語": "国", "算数": "算", "社会": "社", "理科": "理" };
const SUBJECT_ORDER = ["国語", "算数", "社会", "理科"];
const DOW = ["日", "月", "火", "水", "木", "金", "土"];

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function pad(n) { return String(n).padStart(2, "0"); }
function showError(msg) { document.getElementById("errBox").innerHTML = '<div class="err">' + msg + "</div>"; }

let viewYear, viewMonth;
{
  const t = new Date();
  viewYear = t.getFullYear();
  viewMonth = t.getMonth();
}
let logItems = [];   // { date, category }
let hwItems = [];    // { id, title, subject, round, lessonDate, done }

async function readLogs() {
  const snap = await getDocs(LOGS);
  const items = [];
  snap.forEach((d) => items.push(d.data()));
  return items;
}
async function readHomework() {
  const snap = await getDocs(HW);
  const arr = [];
  snap.forEach((d) => arr.push({ id: d.id, ...d.data() }));
  return arr;
}

// 状態は3つ："none"（未）／"done"（やった＝消化数に数える）／"skip"（やったことにする＝やり残しからは消すが消化数には数えない）
// タップ：未→done、done/skip→未。長押し：skip⇔未（doneを長押しするとskipに変わる）
function rerenderAll() {
  renderCalendar();
  renderSummary();
  renderProgress();
}

async function setDailyState(dateStr, cat, state) {
  const id = dateStr.replace(/-/g, "") + "-" + cat.code;
  try {
    logItems = logItems.filter((it) => !(it.date === dateStr && it.category === cat.name));
    if (state === "none") {
      await deleteDoc(doc(db, student.logsCol, id));
    } else {
      const doneAt = todayStr();
      const rec = { date: dateStr, category: cat.name, doneAt, doneAtTs: new Date().toISOString(), skipped: state === "skip" };
      await setDoc(doc(db, student.logsCol, id), rec);
      logItems.push(rec);
    }
    rerenderAll();
  } catch (e) {
    showError("更新に失敗しました: " + e.message);
  }
}

async function setHomeworkState(item, state) {
  try {
    // 完了（やった／スキップ）にするときは完了日を記録、未完了に戻すときは完了日とスキップ印を消す
    if (state === "none") {
      await updateDoc(doc(db, student.hwCol, item.id), { done: false, skipped: deleteField(), doneAt: deleteField(), doneAtTs: deleteField() });
      item.done = false;
      delete item.skipped;
      delete item.doneAt;
    } else {
      const doneAt = todayStr();
      const skipped = state === "skip";
      await updateDoc(doc(db, student.hwCol, item.id), { done: true, skipped, doneAt, doneAtTs: new Date().toISOString() });
      item.done = true;
      item.skipped = skipped;
      item.doneAt = doneAt;
    }
    rerenderAll();
  } catch (e) {
    showError("更新に失敗しました: " + e.message);
  }
}

// タップと長押し（0.5秒）を見分けて、それぞれのハンドラを呼ぶ。指が動いたら（スクロール）どちらも呼ばない
const LONG_PRESS_MS = 500;
function bindPress(el, onTap, onLong) {
  let timer = null, fired = false, sx = 0, sy = 0;
  const cancel = () => { clearTimeout(timer); timer = null; };
  el.addEventListener("pointerdown", (e) => {
    fired = false; sx = e.clientX; sy = e.clientY;
    timer = setTimeout(() => {
      timer = null; fired = true;
      if (navigator.vibrate) navigator.vibrate(30);
      onLong();
    }, LONG_PRESS_MS);
  });
  el.addEventListener("pointermove", (e) => {
    if (timer && (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10)) cancel();
  });
  el.addEventListener("pointerup", cancel);
  el.addEventListener("pointercancel", cancel);
  el.addEventListener("pointerleave", cancel);
  el.addEventListener("contextmenu", (e) => e.preventDefault());
  el.addEventListener("click", (e) => {
    if (fired) { fired = false; e.preventDefault(); return; }
    onTap();
  });
}

const TRACKING_START_DATE = "2026-10-01";

function renderSummary() {
  const today = todayStr();
  const todayDate = new Date(today + "T00:00:00");
  const startDate = new Date(TRACKING_START_DATE + "T00:00:00");
  const totalDays = Math.max(1, Math.round((todayDate - startDate) / 86400000) + 1);

  const doneSet = new Set(logItems.map((it) => it.date + "|" + it.category));
  const dailyCounts = DAILY_CATS.map((cat) => {
    let n = 0;
    for (let i = 0; i < totalDays; i++) {
      const d = new Date(startDate);
      d.setDate(d.getDate() + i);
      const ds = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
      if (!doneSet.has(ds + "|" + cat.name)) n++;
    }
    return { label: cat.name, n };
  });

  const hwCount = hwItems.filter((it) => it.type !== "見直し" && !it.done && (it.lessonDate || "") <= today).length;
  const reviewCount = hwItems.filter((it) => it.type === "見直し" && !it.done && (it.lessonDate || "") <= today).length;

  const t = countDoneOn(today);
  const cards = [
    ...dailyCounts.map((c) => ({ ...c, today: t[c.label] })),
    { label: "宿題", n: hwCount, cls: "hw", today: t["宿題"] },
    { label: "テスト直し", n: reviewCount, cls: "review", today: t["テスト直し"] },
  ];

  const todayCard =
    '<div class="scard todaycard"><div class="n">' + t.total + '</div><div class="l">今日の消化<br>（合計）</div></div>';
  document.getElementById("summary").innerHTML = cards.map((c) =>
    '<div class="scard ' + (c.n === 0 ? "zero" : "some " + (c.cls || "")) + '">' +
    '<div class="n">' + c.n + '</div><div class="l">' + c.label + "</div>" +
    '<div class="tdone' + (c.today ? "" : " none") + '">今日 ' + (c.today ? "✓" + c.today : "0") + "</div></div>"
  ).join("") + todayCard;
}

// 「その日に完了にした数」を種類別に数える（doneAt＝チェックを付けた日。2026-11-16の改修以降の分のみ記録あり）
function countDoneOn(dateStr) {
  const r = { "計算": 0, "社会の基礎": 0, "理科の基礎": 0, "宿題": 0, "テスト直し": 0, total: 0 };
  for (const it of logItems) {
    if (!it.skipped && it.doneAt === dateStr && it.category in r) { r[it.category]++; r.total++; }
  }
  for (const it of hwItems) {
    if (it.done && !it.skipped && it.doneAt === dateStr) { r[it.type === "見直し" ? "テスト直し" : "宿題"]++; r.total++; }
  }
  return r;
}

const PROGRESS_START_DATE = "2026-11-16"; // 完了日の記録を始めた日。これより前は集計できない
const PROGRESS_PARTS = [
  { keys: ["計算", "社会の基礎", "理科の基礎"], label: "日々の課題", color: "#f59e0b" },
  { keys: ["宿題"], label: "宿題", color: "#ea580c" },
  { keys: ["テスト直し"], label: "テスト直し", color: "#7c3aed" },
];

// グラフの表示期間（日数）。0 は「記録開始から」
const PROGRESS_RANGES = [
  { days: 7, label: "1週間" },
  { days: 14, label: "2週間" },
  { days: 28, label: "4週間" },
  { days: 0, label: "記録開始から" },
];
let progressRange = 14;

function renderProgress() {
  const today = todayStr();
  let n = progressRange;
  if (n === 0) {
    n = Math.round((new Date(today + "T00:00:00") - new Date(PROGRESS_START_DATE + "T00:00:00")) / 86400000) + 1;
    n = Math.max(1, n);
  }
  const rangeObj = PROGRESS_RANGES.find((r) => r.days === progressRange);
  document.getElementById("progressHeading").textContent =
    progressRange === 0 ? "記録開始からの消化数" : "直近" + rangeObj.label + "の消化数";
  const dense = n > 14;
  const labelEvery = dense ? Math.ceil(n / 10) : 1; // 日数が多いときは日付ラベルを間引く（今日は必ず表示）
  const days = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(today + "T00:00:00");
    d.setDate(d.getDate() - i);
    const ds = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    days.push({ ds, d, c: countDoneOn(ds) });
  }
  const max = Math.max(1, ...days.map((x) => x.c.total));
  let html = '<div class="rangebar">' + PROGRESS_RANGES.map((r) =>
    '<button class="rbtn' + (r.days === progressRange ? " on" : "") + '" data-days="' + r.days + '">' + r.label + "</button>").join("") + "</div>";
  html += '<div class="bars' + (dense ? " dense" : "") + '">';
  days.forEach((x, idx) => {
    const before = x.ds < PROGRESS_START_DATE;
    const fromEnd = days.length - 1 - idx;
    const showLabel = fromEnd % labelEvery === 0;
    html += '<div class="bcol' + (x.ds === today ? " today" : "") + '">';
    html += '<div class="bnum">' + (before ? "–" : (dense && x.c.total === 0 ? "" : x.c.total)) + "</div>";
    html += '<div class="bstack">';
    for (const p of PROGRESS_PARTS) {
      const v = p.keys.reduce((s, k) => s + x.c[k], 0);
      if (v) html += '<div class="bseg" style="height:' + (v / max * 100) + "%;background:" + p.color + '"></div>';
    }
    html += "</div>";
    const md = (x.d.getMonth() + 1) + "/" + x.d.getDate();
    html += '<div class="blab">' + (showLabel ? (n > 7 ? md + (n <= 14 ? "<br>" + DOW[x.d.getDay()] : "") : md + "<br>(" + DOW[x.d.getDay()] + ")") : "&nbsp;") + "</div>";
    html += "</div>";
  });
  html += "</div>";
  html += '<div class="blegend">' + PROGRESS_PARTS.map((p) =>
    '<span><span class="sw" style="background:' + p.color + '"></span>' + p.label + "</span>").join("") + "</div>";
  html += '<div class="bnote">チェックを付けた日で数えています（11/16から記録開始。それより前に完了した分は含みません）</div>';
  const box = document.getElementById("progress");
  box.innerHTML = html;
  box.querySelectorAll(".rbtn").forEach((b) => {
    b.onclick = () => { progressRange = Number(b.dataset.days); renderProgress(); };
  });
}

function renderCalendar() {
  const today = todayStr();
  const first = new Date(viewYear, viewMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  document.getElementById("monthLabel").textContent = viewYear + "年" + (viewMonth + 1) + "月";

  const logMap = new Map(logItems.map((it) => [it.date + "|" + it.category, it]));
  const hwByDate = {};
  for (const it of hwItems) {
    if (!it.lessonDate) continue;
    (hwByDate[it.lessonDate] = hwByDate[it.lessonDate] || []).push(it);
  }

  const grid = document.getElementById("grid");
  grid.innerHTML = DOW.map((d) => '<div class="dow">' + d + "</div>").join("");
  for (let i = 0; i < startDow; i++) grid.innerHTML += '<div class="day pad"></div>';

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = viewYear + "-" + pad(viewMonth + 1) + "-" + pad(d);
    const isToday = dateStr === today;
    const isFuture = dateStr > today;
    const cell = document.createElement("div");
    cell.className = "day" + (isToday ? " today" : "");

    let html = '<div class="daynum">' + d + "</div>";
    html += '<div class="dailyrow">';
    for (const cat of DAILY_CATS) {
      const rec = logMap.get(dateStr + "|" + cat.name);
      const state = !rec ? "none" : rec.skipped ? "skip" : "done";
      let cls = "future";
      if (state === "done") cls = "done";
      else if (state === "skip") cls = "skipped";
      else if (!isFuture) cls = "bad";
      const label = cat.short + (state === "done" ? " ✓" : state === "skip" ? " －" : "");
      html += '<div class="dot ' + cls + '" data-date="' + dateStr + '" data-code="' + cat.code + '" data-state="' + state + '">' + label + "</div>";
    }
    html += "</div>";

    const dayHw = (hwByDate[dateStr] || []).slice().sort(
      (a, b) => SUBJECT_ORDER.indexOf(a.subject) - SUBJECT_ORDER.indexOf(b.subject)
    );
    for (const it of dayHw) {
      const isReview = it.type === "見直し";
      let cls = "undone-future";
      if (it.done && it.skipped) cls = "skipped";
      else if (it.done) cls = "done";
      else if (dateStr <= today) cls = "undone-overdue" + (isReview ? " review" : "");
      const reviewPrefix = it.testKind === "模試" ? "模試見直し" : it.testKind === "思考力" ? "思考力直し" : "テスト直し";
      const mark = !it.done ? "" : it.skipped ? " －" : " ✓";
      const label = (isReview ? reviewPrefix + " " + SUBJECT_SHORT[it.subject] : SUBJECT_SHORT[it.subject] + (it.round || "")) + mark;
      html += '<div class="chip ' + cls + '" data-id="' + it.id + '">' + label + "</div>";
    }
    cell.innerHTML = html;
    grid.appendChild(cell);
  }

  grid.querySelectorAll(".dot").forEach((dot) => {
    if (dot.classList.contains("future")) return;
    const cat = DAILY_CATS.find((c) => c.code === dot.dataset.code);
    const st = dot.dataset.state;
    bindPress(dot,
      () => setDailyState(dot.dataset.date, cat, st === "none" ? "done" : "none"),
      () => setDailyState(dot.dataset.date, cat, st === "skip" ? "none" : "skip"));
  });
  grid.querySelectorAll(".chip").forEach((chip) => {
    const item = hwItems.find((it) => it.id === chip.dataset.id);
    if (!item) return;
    const st = !item.done ? "none" : item.skipped ? "skip" : "done";
    bindPress(chip,
      () => setHomeworkState(item, st === "none" ? "done" : "none"),
      () => setHomeworkState(item, st === "skip" ? "none" : "skip"));
  });
}

const MIN_YEAR = 2026, MIN_MONTH = 9; // 2026年10月（0始まり月）= TRACKING_START_DATEと同じ月。これより前には戻れない

function updateNavButtons() {
  const atMin = viewYear === MIN_YEAR && viewMonth === MIN_MONTH;
  const prevBtn = document.getElementById("prevBtn");
  prevBtn.disabled = atMin;
  prevBtn.style.opacity = atMin ? "0.3" : "1";
  prevBtn.style.cursor = atMin ? "default" : "pointer";
}

document.getElementById("prevBtn").onclick = () => {
  if (viewYear === MIN_YEAR && viewMonth === MIN_MONTH) return;
  viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  renderCalendar();
  updateNavButtons();
};
document.getElementById("nextBtn").onclick = () => {
  viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderCalendar();
  updateNavButtons();
};

async function init() {
  try {
    [logItems, hwItems] = await Promise.all([readLogs(), readHomework()]);
    document.getElementById("errBox").innerHTML = "";
  } catch (e) {
    showError("読み込みに失敗しました: " + e.message);
    document.getElementById("grid").innerHTML = "";
    return;
  }
  renderCalendar();
  renderSummary();
  renderProgress();
  updateNavButtons();
}
init();
</script>
