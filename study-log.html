<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12181f">
<title>学習カレンダー</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    margin: 0;
    padding: 12px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    background: #f7f8fa;
    color: #1e293b;
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
  }
  h1 { font-size: 24px; margin: 4px 2px 4px; }
  .sub { color: #64748b; font-size: 15px; margin: 0 2px 18px; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 14px; color: #475569; margin: 0 2px 16px; }
  .legend span.sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; margin-right: 5px; vertical-align: -2px; }
  .err { color: #dc2626; font-size: 15px; padding: 14px; background: #fef2f2; border-radius: 10px; margin-bottom: 16px; }
  .loading { color: #94a3b8; font-size: 15px; padding: 20px; text-align: center; }

  .monthbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .monthbar button { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; width: 48px; height: 48px; font-size: 18px; cursor: pointer; }
  .monthbar .label { font-size: 22px; font-weight: 700; }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .dow { text-align: center; font-size: 13px; font-weight: 700; color: #94a3b8; padding-bottom: 6px; }
  .day {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
    min-height: 128px; padding: 4px 3px 4px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .day.pad { background: transparent; border: none; }
  .day.today { border: 3px solid #1e293b; }
  .daynum { font-size: 14px; color: #94a3b8; text-align: right; padding-right: 2px; font-weight: 600; }
  .day.today .daynum { color: #1e293b; font-weight: 800; }

  .dailyrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
  .dot {
    font-size: 15px; font-weight: 800; text-align: center; border-radius: 5px;
    padding: 3px 0; cursor: pointer; line-height: 1.3;
  }
  .dot.done { background: #dcfce7; color: #166534; }
  .dot.bad { background: #fef3c7; color: #b45309; }
  .dot.future { background: #f1f5f9; color: #cbd5e1; cursor: default; }

  .chip {
    font-size: 13px; font-weight: 700; border-radius: 6px; padding: 3px 5px;
    display: flex; align-items: center; justify-content: center; gap: 3px;
    cursor: pointer; line-height: 1.3;
  }
  .chip.done { background: #dcfce7; color: #166534; }
  .chip.undone-future { background: #f1f5f9; color: #94a3b8; }
  .chip.undone-overdue { background: #fff7ed; color: #c2410c; }
  .chip.undone-overdue.review { background: #ede9fe; color: #6d28d9; }

  footer { text-align: center; color: #cbd5e1; font-size: 12px; margin-top: 30px; }
  .switcher { margin: 0 2px 10px; font-size: 13px; }
  .switcher a { color: #94a3b8; text-decoration: none; margin-right: 12px; }
  .switcher a.active { color: #1e293b; font-weight: 800; border-bottom: 2px solid #1e293b; }

  @media (max-width: 480px) {
    .day { min-height: 110px; }
    .dot { font-size: 13px; }
    .chip { font-size: 11px; }
  }
</style>
</head>
<body>
  <div class="switcher" id="switcher"></div>
  <h1 id="pageTitle">学習カレンダー</h1>
  <p class="sub">日々の課題（計・社・理）、授業の宿題、育成テストの見直しをまとめて管理します。タップで完了/未完了を切り替えます。</p>
  <div class="legend">
    <span><span class="sw" style="background:#dcfce7"></span>済</span>
    <span><span class="sw" style="background:#fef3c7"></span>未（日々の課題）</span>
    <span><span class="sw" style="background:#fff7ed"></span>未（宿題）</span>
    <span><span class="sw" style="background:#ede9fe"></span>未（見直し）</span>
    <span><span class="sw" style="background:#f1f5f9"></span>まだ先</span>
  </div>
  <div id="errBox"></div>

  <div class="monthbar">
    <button id="prevBtn">◀</button>
    <div class="label" id="monthLabel"></div>
    <button id="nextBtn">▶</button>
  </div>
  <div class="grid" id="grid"><div class="loading">読み込み中…</div></div>

  <footer id="pageFooter">学習カレンダー（Firebase版）／ 計=計算　社=社会の基礎　理=理科の基礎／宿題チップは国算社理＋回、見直しチップは教科＋「見」</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, deleteDoc, updateDoc, getDocs,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDGKn9yfsUngHa1vIvcE_Fi9ljBv901TD4",
  authDomain: "yui-stydy-log.firebaseapp.com",
  projectId: "yui-stydy-log",
  storageBucket: "yui-stydy-log.firebasestorage.app",
  messagingSenderId: "422930044760",
  appId: "1:422930044760:web:eeca389e974968d8cef72d",
};
const STUDENTS = {
  yui:    { name: "結衣", logsCol: "logs",         hwCol: "homework" },
  daichi: { name: "大智", logsCol: "logs_daichi",  hwCol: "homework_daichi" },
};
const studentKey = new URLSearchParams(location.search).get("student") in STUDENTS
  ? new URLSearchParams(location.search).get("student")
  : "yui";
const student = STUDENTS[studentKey];

document.title = student.name + "さんの学習カレンダー";
document.getElementById("pageTitle").textContent = student.name + "さんの学習カレンダー";
document.getElementById("switcher").innerHTML = Object.entries(STUDENTS).map(([key, s]) =>
  '<a href="?student=' + key + '" class="' + (key === studentKey ? "active" : "") + '">' + s.name + "さん</a>"
).join("");
document.getElementById("pageFooter").textContent =
  student.name + "さんの学習カレンダー（Firebase版）／ 計=計算　社=社会の基礎　理=理科の基礎／宿題チップは国算社理＋回、見直しチップは教科＋「見」";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const LOGS = collection(db, student.logsCol);
const HW = collection(db, student.hwCol);

const DAILY_CATS = [
  { name: "計算", code: "calc", short: "計" },
  { name: "社会の基礎", code: "shakai", short: "社" },
  { name: "理科の基礎", code: "rika", short: "理" },
];
const SUBJECT_SHORT = { "国語": "国", "算数": "算", "社会": "社", "理科": "理" };
const SUBJECT_ORDER = ["国語", "算数", "社会", "理科"];
const DOW = ["日", "月", "火", "水", "木", "金", "土"];

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function pad(n) { return String(n).padStart(2, "0"); }
function showError(msg) { document.getElementById("errBox").innerHTML = '<div class="err">' + msg + "</div>"; }

let viewYear, viewMonth;
{
  const t = new Date();
  viewYear = t.getFullYear();
  viewMonth = t.getMonth();
}
let logItems = [];   // { date, category }
let hwItems = [];    // { id, title, subject, round, lessonDate, done }

async function readLogs() {
  const snap = await getDocs(LOGS);
  const items = [];
  snap.forEach((d) => items.push(d.data()));
  return items;
}
async function readHomework() {
  const snap = await getDocs(HW);
  const arr = [];
  snap.forEach((d) => arr.push({ id: d.id, ...d.data() }));
  return arr;
}

async function toggleDaily(dateStr, cat, isDoneNow) {
  const id = dateStr.replace(/-/g, "") + "-" + cat.code;
  try {
    if (isDoneNow) {
      await deleteDoc(doc(db, student.logsCol, id));
      logItems = logItems.filter((it) => !(it.date === dateStr && it.category === cat.name));
    } else {
      await setDoc(doc(db, student.logsCol, id), { date: dateStr, category: cat.name });
      logItems.push({ date: dateStr, category: cat.name });
    }
    renderCalendar();
  } catch (e) {
    showError("更新に失敗しました: " + e.message);
  }
}

async function toggleHomework(item) {
  try {
    await updateDoc(doc(db, student.hwCol, item.id), { done: !item.done });
    item.done = !item.done;
    renderCalendar();
  } catch (e) {
    showError("更新に失敗しました: " + e.message);
  }
}

function renderCalendar() {
  const today = todayStr();
  const first = new Date(viewYear, viewMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  document.getElementById("monthLabel").textContent = viewYear + "年" + (viewMonth + 1) + "月";

  const doneSet = new Set(logItems.map((it) => it.date + "|" + it.category));
  const hwByDate = {};
  for (const it of hwItems) {
    if (!it.lessonDate) continue;
    (hwByDate[it.lessonDate] = hwByDate[it.lessonDate] || []).push(it);
  }

  const grid = document.getElementById("grid");
  grid.innerHTML = DOW.map((d) => '<div class="dow">' + d + "</div>").join("");
  for (let i = 0; i < startDow; i++) grid.innerHTML += '<div class="day pad"></div>';

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = viewYear + "-" + pad(viewMonth + 1) + "-" + pad(d);
    const isToday = dateStr === today;
    const isFuture = dateStr > today;
    const cell = document.createElement("div");
    cell.className = "day" + (isToday ? " today" : "");

    let html = '<div class="daynum">' + d + "</div>";
    html += '<div class="dailyrow">';
    for (const cat of DAILY_CATS) {
      const done = doneSet.has(dateStr + "|" + cat.name);
      let cls = "future";
      if (done) cls = "done";
      else if (!isFuture) cls = "bad";
      const label = cat.short + (done ? " ✓" : "");
      html += '<div class="dot ' + cls + '" data-date="' + dateStr + '" data-code="' + cat.code + '" data-done="' + done + '">' + label + "</div>";
    }
    html += "</div>";

    const dayHw = (hwByDate[dateStr] || []).slice().sort(
      (a, b) => SUBJECT_ORDER.indexOf(a.subject) - SUBJECT_ORDER.indexOf(b.subject)
    );
    for (const it of dayHw) {
      const isReview = it.type === "見直し";
      let cls = "undone-future";
      if (it.done) cls = "done";
      else if (dateStr <= today) cls = "undone-overdue" + (isReview ? " review" : "");
      const label = (isReview ? "テスト直し " + SUBJECT_SHORT[it.subject] : SUBJECT_SHORT[it.subject] + (it.round || "")) + (it.done ? " ✓" : "");
      html += '<div class="chip ' + cls + '" data-id="' + it.id + '">' + label + "</div>";
    }
    cell.innerHTML = html;
    grid.appendChild(cell);
  }

  grid.querySelectorAll(".dot").forEach((dot) => {
    if (dot.classList.contains("future")) return;
    dot.onclick = () => {
      const cat = DAILY_CATS.find((c) => c.code === dot.dataset.code);
      toggleDaily(dot.dataset.date, cat, dot.dataset.done === "true");
    };
  });
  grid.querySelectorAll(".chip").forEach((chip) => {
    chip.onclick = () => {
      const item = hwItems.find((it) => it.id === chip.dataset.id);
      if (item) toggleHomework(item);
    };
  });
}

document.getElementById("prevBtn").onclick = () => {
  viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  renderCalendar();
};
document.getElementById("nextBtn").onclick = () => {
  viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderCalendar();
};

async function init() {
  try {
    [logItems, hwItems] = await Promise.all([readLogs(), readHomework()]);
    document.getElementById("errBox").innerHTML = "";
  } catch (e) {
    showError("読み込みに失敗しました: " + e.message);
    document.getElementById("grid").innerHTML = "";
    return;
  }
  renderCalendar();
}
init();
</script>
</body>
</html>
