<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12181f">
<title>結衣さんの学習ログ</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    margin: 0;
    padding: 20px;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
    background: #f7f8fa;
    color: #1e293b;
    max-width: 560px;
    margin-left: auto;
    margin-right: auto;
  }
  h1 { font-size: 19px; margin: 4px 2px 4px; }
  .sub { color: #64748b; font-size: 12px; margin: 0 2px 18px; }
  .cards { display: flex; flex-direction: column; gap: 10px; margin-bottom: 26px; }
  .card {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: #fff; border-radius: 14px; padding: 14px 18px;
    border: 1px solid #e2e8f0; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .card.ok { border-left: 6px solid #22c55e; }
  .card.warn { border-left: 6px solid #f59e0b; }
  .card.bad { border-left: 6px solid #ef4444; }
  .left { display: flex; flex-direction: column; gap: 2px; }
  .name { font-size: 15px; font-weight: 700; }
  .status { font-size: 13px; color: #475569; }
  .status b { font-size: 18px; }
  .card.ok .status { color: #16a34a; }
  .card.warn .status { color: #b45309; }
  .card.bad .status { color: #dc2626; }
  button.done {
    min-height: 44px;
    background: #1e293b; color: #fff; border: none; border-radius: 999px;
    padding: 10px 18px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  button.done:active { transform: scale(0.97); }
  button.done.today { background: #cbd5e1; color: #475569; }
  h2 { font-size: 14px; color: #334155; margin: 0 0 10px; }
  .log { background: #fff; border-radius: 14px; border: 1px solid #e2e8f0; overflow: hidden; }
  .log-row { display: flex; gap: 10px; padding: 9px 16px; font-size: 13px; border-bottom: 1px solid #f1f5f9; }
  .log-row:last-child { border-bottom: none; }
  .log-row .d { color: #94a3b8; width: 86px; flex-shrink: 0; }
  .empty, .loading { color: #94a3b8; font-size: 13px; padding: 16px; text-align: center; }
  .err { color: #dc2626; font-size: 13px; padding: 12px; background: #fef2f2; border-radius: 10px; margin-bottom: 14px; }
  footer { text-align: center; color: #cbd5e1; font-size: 11px; margin-top: 30px; }
</style>
</head>
<body>
  <h1>結衣さんの学習ログ</h1>
  <p class="sub">今日やった項目はボタンをタップ。数字は「最後にやった日からの経過日数」です。</p>
  <div id="errBox"></div>
  <div id="cards" class="cards"><div class="loading">読み込み中…</div></div>
  <h2>最近の実績</h2>
  <div id="log" class="log"></div>
  <footer>結衣さんの学習ログ（Firebase版）</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, getDocs,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDGKn9yfsUngHa1vIvcE_Fi9ljBv901TD4",
  authDomain: "yui-stydy-log.firebaseapp.com",
  projectId: "yui-stydy-log",
  storageBucket: "yui-stydy-log.firebasestorage.app",
  messagingSenderId: "422930044760",
  appId: "1:422930044760:web:eeca389e974968d8cef72d",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const LOGS = collection(db, "logs");

const CATS = [
  { name: "計算", code: "calc" },
  { name: "社会の基礎", code: "shakai" },
  { name: "理科の基礎", code: "rika" },
  { name: "宿題", code: "homework" },
  { name: "育成テストの見直し", code: "review" },
];

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function todayCompact() {
  return todayStr().replace(/-/g, "");
}
function daysBetween(dateStr, todayS) {
  const a = new Date(dateStr + "T00:00:00");
  const b = new Date(todayS + "T00:00:00");
  return Math.round((b - a) / 86400000);
}

async function readAll() {
  const snap = await getDocs(LOGS);
  const items = [];
  snap.forEach((d) => items.push(d.data()));
  return items;
}

async function markDone(cat) {
  const id = todayCompact() + "-" + cat.code;
  try {
    await setDoc(doc(db, "logs", id), { date: todayStr(), category: cat.name });
    render();
  } catch (e) {
    showError("記録に失敗しました: " + e.message);
  }
}

function showError(msg) {
  document.getElementById("errBox").innerHTML = '<div class="err">' + msg + "</div>";
}

async function render() {
  let items;
  try {
    items = await readAll();
    document.getElementById("errBox").innerHTML = "";
  } catch (e) {
    showError("読み込みに失敗しました: " + e.message);
    document.getElementById("cards").innerHTML = "";
    return;
  }

  const today = todayStr();
  const latest = {};
  for (const it of items) {
    if (!it.date || !it.category) continue;
    if (!latest[it.category] || it.date > latest[it.category]) latest[it.category] = it.date;
  }

  const rows = CATS.map((cat) => {
    const last = latest[cat.name];
    const backlog = last ? daysBetween(last, today) : null;
    return { cat, last, backlog };
  }).sort((a, b) => (b.backlog === null ? 9999 : b.backlog) - (a.backlog === null ? 9999 : a.backlog));

  const cardsEl = document.getElementById("cards");
  cardsEl.innerHTML = "";
  for (const row of rows) {
    const { cat, backlog } = row;
    const div = document.createElement("div");
    let level, statusText;
    if (backlog === null) {
      level = "bad"; statusText = "記録がありません";
    } else if (backlog <= 0) {
      level = "ok"; statusText = "今日やりました！";
    } else {
      level = backlog >= 3 ? "bad" : "warn";
      statusText = "<b>" + backlog + "日分</b> たまっています";
    }
    div.className = "card " + level;
    div.innerHTML =
      '<div class="left"><div class="name">' + cat.name + '</div><div class="status">' + statusText + "</div></div>" +
      '<button class="done' + (backlog === 0 ? " today" : "") + '" data-code="' + cat.code + '">' +
      (backlog === 0 ? "✓ 完了" : "今日やった") + "</button>";
    cardsEl.appendChild(div);
  }
  cardsEl.querySelectorAll("button.done").forEach((btn) => {
    btn.onclick = () => markDone(CATS.find((c) => c.code === btn.dataset.code));
  });

  const sorted = items.slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const logEl = document.getElementById("log");
  logEl.innerHTML = sorted.length === 0
    ? '<div class="empty">まだ記録がありません</div>'
    : sorted.slice(0, 20).map((it) =>
        '<div class="log-row"><span class="d">' + (it.date || "") + '</span><span>' + (it.category || "") +
        (it.note ? "　" + it.note : "") + "</span></div>"
      ).join("");
}

render();
</script>
</body>
</html>
