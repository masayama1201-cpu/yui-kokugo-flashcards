<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12181f">
<title>国語（5年後期 第3回：仮名づかい・符号の使い方）</title>
<style>
  :root {
    --bg: #12181f;
    --card-bg: #1c2733;
    --accent: #ffb347;
    --answer: #7ed6a5;
    --text: #f5f7fa;
    --sub: #9fb0c3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    overflow: hidden;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    width: 100vw;
    height: 100vh;
    padding: 3vh 5vw;
  }
  .topbar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 2.2vw;
    color: var(--sub);
  }
  .category {
    background: rgba(255,179,71,0.15);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 0.6vh 2vw;
    font-weight: bold;
  }
  .progress-wrap {
    width: 100%;
    height: 1.2vh;
    background: #2a3644;
    border-radius: 999px;
    margin-top: 1.5vh;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s linear;
  }
  .card {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 4vh;
  }
  .qlabel {
    font-size: 2vw;
    letter-spacing: 0.3em;
    color: var(--sub);
  }
  .question {
    font-size: 4vw;
    font-weight: 800;
    line-height: 1.4;
    max-width: 90vw;
  }
  .answer-box {
    font-size: 3.6vw;
    font-weight: 800;
    color: var(--answer);
    line-height: 1.4;
    max-width: 90vw;
    min-height: 6vw;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .answer-box.show {
    opacity: 1;
    transform: translateY(0);
  }
  .answer-box.no-transition {
    transition: none !important;
  }
  .answer-box .arrow {
    color: var(--sub);
    font-size: 3vw;
    margin-right: 0.4em;
  }
  .choice-wrap {
    display: none;
    flex-direction: column;
    gap: 2.5vh;
    width: 100%;
    align-items: center;
  }
  .choice-box {
    font-size: 3.4vw;
    font-weight: 800;
    padding: 2vh 4vw;
    border-radius: 18px;
    border: 2px solid var(--sub);
    background: var(--card-bg);
    color: var(--text);
    width: 82vw;
    max-width: 560px;
    opacity: 0.55;
    transition: all 0.5s ease;
  }
  .choice-box.correct {
    border-color: var(--answer);
    background: rgba(126,214,165,0.18);
    color: var(--answer);
    opacity: 1;
    transform: scale(1.03);
  }
  .bottombar {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 3vw;
    font-size: 1.8vw;
    color: var(--sub);
  }
  button.ctrl {
    background: #2a3644;
    color: var(--text);
    border: none;
    border-radius: 999px;
    padding: 1vh 2.2vw;
    font-size: 1.8vw;
    cursor: pointer;
  }
  button.ctrl:hover { background: #34445a; }
  .hint {
    color: var(--sub);
    font-size: 1.6vw;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="category" id="category">国語・かなづかいと符号</span>
    <span id="counter">1 / 40</span>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <div class="card">
    <div class="qlabel" id="qlabel">Q</div>
    <div class="question" id="question">読み込み中…</div>
    <div class="answer-box" id="answerBox"><span class="arrow">A</span><span id="answerText"></span></div>
    <div class="choice-wrap" id="choiceWrap">
      <div class="choice-box" id="choiceBoxA"></div>
      <div class="choice-box" id="choiceBoxB"></div>
    </div>
  </div>

  <div class="bottombar">
    <button class="ctrl" id="playPause">⏸ 一時停止</button>
    <button class="ctrl" id="restart">🔀 シャッフルして最初から</button>
    <button class="ctrl" id="fullscreenBtn">⛶ 全画面</button>
    <span class="hint">問題7秒→答え5秒で自動的に切り替わります（タップでも操作できます）</span>
  </div>
</div>

<script>
const DATA = [
  // ===== 栄冠 学び直し❶ 1（誤った仮名づかいを見分ける）=====
  {cat:"かなづかい・栄冠", q:"「大通り」の正しい仮名づかいは？", type:"choice", a:"おおどおり", wrong:"おおどうり"},
  {cat:"かなづかい・栄冠", q:"「短い」の正しい仮名づかいは？", type:"choice", a:"みじかい", wrong:"みぢかい"},
  {cat:"かなづかい・栄冠", q:"「言う」の正しい仮名づかいは？", type:"choice", a:"いう", wrong:"ゆう"},

  // ===== 本科 1（かなづかいが正しいか判定する）=====
  {cat:"かなづかい・本科①", q:"「鼻血」の正しい仮名づかいは？", type:"choice", a:"はなぢ", wrong:"はなじ"},
  {cat:"かなづかい・本科①", q:"「缶詰」の正しい仮名づかいは？", type:"choice", a:"かんづめ", wrong:"かんずめ"},
  {cat:"かなづかい・本科①", q:"「先生」の正しい仮名づかいは？", type:"choice", a:"せんせい", wrong:"せんせえ"},
  {cat:"かなづかい・本科①", q:"「お姉さん」の正しい仮名づかいは？", type:"choice", a:"おねえさん", wrong:"おねいさん"},
  {cat:"かなづかい・本科①", q:"「縮む」の正しい仮名づかいは？", type:"choice", a:"ちぢむ", wrong:"ちじむ"},
  {cat:"かなづかい・本科①", q:"虫の「こおろぎ」の正しい仮名づかいは？", type:"choice", a:"こおろぎ", wrong:"こうろぎ"},
  {cat:"かなづかい・本科①", q:"「遠い」の正しい仮名づかいは？", type:"choice", a:"とおい", wrong:"とうい"},
  {cat:"かなづかい・本科①", q:"「狼（おおかみ）」の正しい仮名づかいは？", type:"choice", a:"おおかみ", wrong:"おうかみ"},
  {cat:"かなづかい・本科①", q:"「王子様」の正しい仮名づかいは？", type:"choice", a:"おうじさま", wrong:"おおじさま"},
  {cat:"かなづかい・本科①", q:"植物の「ほおずき」の正しい仮名づかいは？", type:"choice", a:"ほおずき", wrong:"ほうずき"},
  {cat:"かなづかい・本科①", q:"「催す」の正しい仮名づかいは？", type:"choice", a:"もよおす", wrong:"もようす"},

  // ===== 本科 2（文中の空らんに入る「ず/づ」「じ/ぢ」）=====
  {cat:"かなづかい・本科②", q:"「この紙を二まい　配ってください」の正しい書き方は？", type:"choice", a:"二まいずつ", wrong:"二まいづつ"},
  {cat:"かなづかい・本科②", q:"「木の芽のにおいから季節を　た」の正しい書き方は？", type:"choice", a:"感じた", wrong:"感ぢた"},
  {cat:"かなづかい・本科②", q:"「だんだんと年末が　く」の正しい書き方は？", type:"choice", a:"近づく", wrong:"近ずく"},
  {cat:"かなづかい・本科②", q:"「　しゃくは鉄を吸いつける」の正しい書き方は？", type:"choice", a:"磁石（じしゃく）", wrong:"ぢしゃく"},

  // ===== 本科 3（漢字の読みをひらがなで書く）=====
  {cat:"かなづかい・本科③", q:"「火事」の正しい仮名づかいは？", type:"choice", a:"かじ", wrong:"かぢ"},
  {cat:"かなづかい・本科③", q:"「地震」の正しい仮名づかいは？", type:"choice", a:"じしん", wrong:"ぢしん"},
  {cat:"かなづかい・本科③", q:"「生地」の正しい仮名づかいは？", type:"choice", a:"きじ", wrong:"きぢ"},
  {cat:"かなづかい・本科③", q:"「絆」の正しい仮名づかいは？", type:"choice", a:"きずな", wrong:"きづな"},
  {cat:"かなづかい・本科③", q:"「築く」の正しい仮名づかいは？", type:"choice", a:"きずく", wrong:"きづく"},
  {cat:"かなづかい・本科③", q:"「難しい」の正しい仮名づかいは？", type:"choice", a:"むずかしい", wrong:"むづかしい"},
  {cat:"かなづかい・本科③", q:"「家中」の正しい仮名づかいは？", type:"choice", a:"いえじゅう", wrong:"いえぢゅう"},
  {cat:"かなづかい・本科③", q:"「氷」の正しい仮名づかいは？", type:"choice", a:"こおり", wrong:"こうり"},
  {cat:"かなづかい・本科③", q:"「大きい」の正しい仮名づかいは？", type:"choice", a:"おおきい", wrong:"おうきい"},
  {cat:"かなづかい・本科③", q:"「炎」の正しい仮名づかいは？", type:"choice", a:"ほのお", wrong:"ほのう"},
  {cat:"かなづかい・本科③", q:"「三日月」の正しい仮名づかいは？", type:"choice", a:"みかづき", wrong:"みかずき"},

  // ===== かなづかいのルール（本科 説明ページ）=====
  {cat:"かなづかいのルール", q:"エ音をのばして発音する言葉（せんせい・けいなど）は、書くときに何をそえる？", a:"エ音のかなに「い」をそえる（例：せんせい・けい）。ただし『おねえさん』は例外で「え」をそえる。"},
  {cat:"かなづかいのルール", q:"オ音をのばして発音する言葉は、書くときに何をそえる？", a:"基本はオ音のかなに「う」をそえる（例：ゆうがた・きょう）。ただし、とおい・こおり・こおろぎ・おおきい・ほおずき・おおかみ などは「お」をそえる例外。"},
  {cat:"かなづかいのルール", q:"「ぢ」「づ」を使うのはどんなとき？", a:"①同じ音が続いてにごる場合（ちぢむ・つづく）②複合語でもとの言葉の「ち・つ」とわかる場合（鼻血→はなぢ、三日月→みかづき）。ただし地面・地震はじ・じしんと書く例外。"},

  // ===== 符号のはたらき（本科 4）=====
  {cat:"符号のはたらき", q:"句点「。」の使い方は？", a:"文の終わりに使う。"},
  {cat:"符号のはたらき", q:"読点「、」の使い方は？", a:"文の切れ目につけて読みやすくしたり、意味の関係をはっきりさせたりするときに使う。"},
  {cat:"符号のはたらき", q:"中点「・」の使い方は？", a:"同じ仲間の言葉をならべるときなどに使う。"},
  {cat:"符号のはたらき", q:"感嘆符「！」の使い方は？", a:"おどろきや感動、強調の意味を表すときに使う。"},
  {cat:"符号のはたらき", q:"疑問符「？」の使い方は？", a:"疑問や質問の気持ちを表すときに使う。"},
  {cat:"符号のはたらき", q:"点線「……」（三点リーダー）の使い方は？", a:"あとに続く言葉を省略したり、感動などの心情を暗示したりするときに使う。"},
  {cat:"符号のはたらき", q:"かぎかっこ「」の使い方は？", a:"会話・発言や、ほかの文からの引用などを表すときに使う。"},
  {cat:"符号のはたらき", q:"二重かぎかっこ『』の使い方は？", a:"会話の中に、さらに別の会話（発言）を入れるときに使う。"},
];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const QUESTION_SECONDS = 7;
const ANSWER_SECONDS = 5;
function currentPhaseSeconds() {
  return showingAnswer ? ANSWER_SECONDS : QUESTION_SECONDS;
}
let deck = shuffle(DATA);
let idx = 0;
let showingAnswer = false;
let paused = false;
let timer = null;
let tickStart = 0;
let remainingOnPause = QUESTION_SECONDS * 1000;
let currentOpts = null; // shuffled [{text, correct}] for the active choice card

const questionEl = document.getElementById("question");
const qlabelEl = document.getElementById("qlabel");
const answerBox = document.getElementById("answerBox");
const answerText = document.getElementById("answerText");
const choiceWrap = document.getElementById("choiceWrap");
const choiceBoxA = document.getElementById("choiceBoxA");
const choiceBoxB = document.getElementById("choiceBoxB");
const categoryEl = document.getElementById("category");
const counterEl = document.getElementById("counter");
const progressBar = document.getElementById("progressBar");
const playPauseBtn = document.getElementById("playPause");
const restartBtn = document.getElementById("restart");
const fullscreenBtn = document.getElementById("fullscreenBtn");

function renderCard() {
  const item = deck[idx];
  categoryEl.textContent = item.cat;
  counterEl.textContent = (idx + 1) + " / " + deck.length;
  questionEl.textContent = item.q;
  showingAnswer = false;

  if (item.type === "choice") {
    qlabelEl.style.display = "none";
    answerBox.style.display = "none";
    choiceWrap.style.display = "flex";
    currentOpts = shuffle([
      { text: item.a, correct: true },
      { text: item.wrong, correct: false },
    ]);
    choiceBoxA.textContent = currentOpts[0].text;
    choiceBoxB.textContent = currentOpts[1].text;
    choiceBoxA.classList.remove("correct");
    choiceBoxB.classList.remove("correct");
  } else {
    qlabelEl.style.display = "";
    choiceWrap.style.display = "none";
    answerBox.style.display = "";
    answerBox.classList.add("no-transition");
    answerBox.classList.remove("show");
    void answerBox.offsetWidth;
    answerText.textContent = item.a;
    void answerBox.offsetWidth;
    requestAnimationFrame(() => {
      answerBox.classList.remove("no-transition");
    });
  }
}

function revealAnswer() {
  const item = deck[idx];
  if (item.type === "choice") {
    const boxes = [choiceBoxA, choiceBoxB];
    boxes.forEach((box, i) => {
      if (currentOpts[i].correct) box.classList.add("correct");
    });
  } else {
    answerBox.classList.add("show");
  }
}

function step() {
  if (!showingAnswer) {
    revealAnswer();
    showingAnswer = true;
  } else {
    idx++;
    if (idx >= deck.length) {
      idx = 0;
      deck = shuffle(DATA);
    }
    renderCard();
  }
  progressBar.style.width = "0%";
  startProgress();
}

function startProgress() {
  const seconds = currentPhaseSeconds();
  progressBar.style.transition = "none";
  progressBar.style.width = "0%";
  requestAnimationFrame(() => {
    progressBar.style.transition = "width " + seconds + "s linear";
    progressBar.style.width = "100%";
  });
}

function scheduleNext() {
  clearTimeout(timer);
  const seconds = currentPhaseSeconds();
  tickStart = Date.now();
  remainingOnPause = seconds * 1000;
  timer = setTimeout(() => {
    step();
    if (!paused) scheduleNext();
  }, seconds * 1000);
}

function pause() {
  paused = true;
  clearTimeout(timer);
  const elapsed = Date.now() - tickStart;
  remainingOnPause = Math.max(currentPhaseSeconds() * 1000 - elapsed, 0);
  progressBar.style.transition = "none";
  playPauseBtn.textContent = "▶ 再生";
}

function resume() {
  paused = false;
  playPauseBtn.textContent = "⏸ 一時停止";
  tickStart = Date.now();
  timer = setTimeout(() => {
    step();
    if (!paused) scheduleNext();
  }, remainingOnPause);
  const remainSec = remainingOnPause / 1000;
  requestAnimationFrame(() => {
    progressBar.style.transition = "width " + remainSec + "s linear";
    progressBar.style.width = "100%";
  });
}

playPauseBtn.addEventListener("click", () => {
  if (paused) resume(); else pause();
});

restartBtn.addEventListener("click", () => {
  deck = shuffle(DATA);
  idx = 0;
  renderCard();
  progressBar.style.width = "0%";
  if (!paused) {
    startProgress();
    scheduleNext();
  }
});

function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function updateFullscreenBtn() {
  fullscreenBtn.textContent = isFullscreen() ? "⛶ 全画面をやめる" : "⛶ 全画面";
}
fullscreenBtn.addEventListener("click", () => {
  const el = document.documentElement;
  if (!isFullscreen()) {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) {
      req.call(el);
    } else {
      alert("この端末のSafariでは全画面ボタンに対応していないようです。\nホーム画面に追加したアイコンから開くと、アドレスバーなしで表示できます。");
    }
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) exit.call(document);
  }
});
document.addEventListener("fullscreenchange", updateFullscreenBtn);
document.addEventListener("webkitfullscreenchange", updateFullscreenBtn);

document.querySelector(".card").addEventListener("click", () => {
  clearTimeout(timer);
  step();
  if (!paused) scheduleNext();
});

renderCard();
startProgress();
scheduleNext();
</script>
</body>
</html>
