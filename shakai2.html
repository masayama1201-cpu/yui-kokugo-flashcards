<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12181f">
<title>社会（5年後期 第1回：原始の人々のくらし／本科+栄冠 重要事項）</title>
<style>
  :root {
    --bg: #12181f;
    --card-bg: #1c2733;
    --accent: #ffb347;
    --answer: #7ed6a5;
    --text: #f5f7fa;
    --sub: #9fb0c3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    overflow: hidden;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    width: 100vw;
    height: 100vh;
    padding: 3vh 5vw;
  }
  .topbar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 2.2vw;
    color: var(--sub);
  }
  .category {
    background: rgba(255,179,71,0.15);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 0.6vh 2vw;
    font-weight: bold;
  }
  .progress-wrap {
    width: 100%;
    height: 1.2vh;
    background: #2a3644;
    border-radius: 999px;
    margin-top: 1.5vh;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s linear;
  }
  .card {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 4vh;
  }
  .qlabel {
    font-size: 2vw;
    letter-spacing: 0.3em;
    color: var(--sub);
  }
  .question {
    font-size: 4.4vw;
    font-weight: 800;
    line-height: 1.4;
    max-width: 90vw;
  }
  .answer-box {
    font-size: 3.6vw;
    font-weight: 800;
    color: var(--answer);
    line-height: 1.4;
    max-width: 90vw;
    min-height: 6vw;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .answer-box.show {
    opacity: 1;
    transform: translateY(0);
  }
  .answer-box.no-transition {
    transition: none !important;
  }
  .answer-box .arrow {
    color: var(--sub);
    font-size: 3vw;
    margin-right: 0.4em;
  }
  .bottombar {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 3vw;
    font-size: 1.8vw;
    color: var(--sub);
  }
  button {
    background: #2a3644;
    color: var(--text);
    border: none;
    border-radius: 999px;
    padding: 1vh 2.2vw;
    font-size: 1.8vw;
    cursor: pointer;
  }
  button:hover { background: #34445a; }
  .hint {
    color: var(--sub);
    font-size: 1.6vw;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="category" id="category">社会・② 完成編</span>
    <span id="counter">1 / 56</span>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <div class="card">
    <div class="qlabel">Q</div>
    <div class="question" id="question">読み込み中…</div>
    <div class="answer-box" id="answerBox"><span class="arrow">A</span><span id="answerText"></span></div>
  </div>

  <div class="bottombar">
    <button id="playPause">⏸ 一時停止</button>
    <button id="restart">🔀 シャッフルして最初から</button>
    <button id="restartOrder">📖 テキスト順に最初から</button>
    <button id="fullscreenBtn">⛶ 全画面</button>
    <span class="hint">問題7秒→答え5秒で自動的に切り替わります（タップでも操作できます）</span>
  </div>
</div>

<script>
const DATA = [
  {cat:"旧石器時代・基本", q:"日本列島に人が住み始めた、土器がまだなかった時代を何という？", a:"旧石器時代"},
  {cat:"旧石器時代・基本", q:"旧石器時代の人々が、石を打ち欠いて作った石器を何という？", a:"打製石器"},
  {cat:"旧石器時代・基本", q:"旧石器時代、日本列島は何と陸続きだった？", a:"ユーラシア大陸（氷河時代で気候が寒冷、海面が今より低かったため）"},
  {cat:"旧石器時代・基本", q:"旧石器時代の人々はどんな生活をしていた？", a:"ナウマンゾウやオオツノジカなどの大型動物を追って、移動しながら狩りや採集をする生活"},
  {cat:"旧石器時代・基本", q:"旧石器時代の人々の住まいとして考えられているものは？", a:"ほら穴（洞窟）など"},
  {cat:"旧石器時代・遺跡", q:"群馬県にあり、関東ローム層（赤土の層）から打製石器が発見された遺跡は？", a:"岩宿遺跡"},
  {cat:"旧石器時代・遺跡", q:"岩宿遺跡を発見し、日本にも旧石器時代があったことを証明した人物は？", a:"相沢忠洋"},
  {cat:"旧石器時代・遺跡", q:"相沢忠洋はどんな人物だった？", a:"日用品を売り歩く行商をしながら、独学で考古学を学んでいた青年"},
  {cat:"旧石器時代・遺跡", q:"岩宿遺跡の打製石器は、今からおよそ何年前のもの？", a:"約3万5000年前〜約2万5000年前"},
  {cat:"旧石器時代・遺跡", q:"岩宿で見つかった打製石器の材料になった石は？", a:"黒曜石"},
  {cat:"旧石器時代・遺跡", q:"黒曜石とはどんな石？", a:"割れると鋭い切り口になる、打製石器の材料に使われた黒っぽい石（マグマが急に冷えてできる）"},
  {cat:"旧石器時代・遺跡", q:"関東ローム層とは何？", a:"関東平野をおおう赤褐色（赤土）の火山灰の地層"},
  {cat:"旧石器時代・遺跡", q:"長野県にあり、ナウマンゾウやオオツノジカの化石が見つかった遺跡は？", a:"野尻湖遺跡"},
  {cat:"旧石器時代・遺跡", q:"野尻湖遺跡で化石が見つかった地層は、今からおよそ何年前のもの？", a:"約3万年以上前"},
  {cat:"旧石器時代・遺跡", q:"北海道など寒い地域で見つかっている、ナウマンゾウ・オオツノジカ以外の大型動物の化石は？", a:"マンモスの化石"},
  {cat:"縄文時代のはじまり", q:"縄文時代は今からおよそ何年前に始まった？", a:"約1万年前（〜1万数千年前）"},
  {cat:"縄文時代のはじまり", q:"縄文時代は今からおよそ何年前ごろまで続いた？", a:"約2500年前ごろ"},
  {cat:"縄文時代のはじまり", q:"縄文時代が始まるきっかけとなった気候の変化は？", a:"気候が温暖化し、氷がとけて海面が上昇したこと"},
  {cat:"縄文時代のはじまり", q:"海面が上昇した結果、日本列島はどうなった？", a:"ユーラシア大陸と切り離され、現在に近い形の島々になった"},
  {cat:"縄文時代・道具", q:"打製石器に代わって縄文時代に使われるようになった、表面を磨いて作る石器は？", a:"磨製石器"},
  {cat:"縄文時代・道具", q:"磨製石器はどのようにして作られた？", a:"打製石器を磨いて、切れ味を鋭くして作られた"},
  {cat:"縄文時代・道具", q:"動物の骨や角を加工して作った、縄文時代の道具（釣り針など）を何という？", a:"骨角器"},
  {cat:"縄文時代・道具", q:"縄文時代の人々が土をこねて焼いて作った、表面に縄目の文様がある厚手の土器は？", a:"縄文土器"},
  {cat:"縄文時代・道具", q:"縄文土器はどんな焼き方の特徴がある？", a:"低い温度で焼かれていて、もろく、黒っぽい色をしている"},
  {cat:"縄文時代・道具", q:"土器の発明で、人々の食生活はどう変わった？", a:"食材を「煮る」ことができるようになり、あく抜きや硬い食材の調理などができ食生活が豊かになった"},
  {cat:"縄文時代・道具", q:"土器は最初何に使われ、その後どんな用途が増えた？", a:"最初は調理・保存の容器、その後盛りつけ用・保存用・祭器用など多様な種類が作られるようになった"},
  {cat:"縄文時代・道具", q:"地面を掘り下げて柱を立て、屋根をふいて作った縄文時代の住居を何という？", a:"たて穴住居"},
  {cat:"縄文時代・くらし", q:"たて穴住居は、ふつう1つの遺跡から何戸くらいまとまって見つかる？", a:"4〜5戸"},
  {cat:"縄文時代・くらし", q:"1戸に4〜5人住んでいたとすると、1つの集落はおよそ何人くらいの規模？", a:"20〜30人くらい"},
  {cat:"縄文時代・くらし", q:"縄文時代の人々はどんな場所に住んでいた？", a:"狩りや漁に都合のよい、水辺（川や海）の近くの住みやすい場所"},
  {cat:"貝塚", q:"貝塚とは何？", a:"縄文時代の人々が貝がらや魚・動物の骨、こわれた土器などを捨てた場所"},
  {cat:"貝塚", q:"貝塚は「縄文人の何」と言われるほど重要な手がかりとされている？", a:"タイムカプセル"},
  {cat:"貝塚", q:"東京都にある代表的な貝塚は？", a:"大森貝塚"},
  {cat:"貝塚", q:"大森貝塚を発見したアメリカ人動物学者は？", a:"モース"},
  {cat:"貝塚", q:"モースが大森貝塚を発見したのは西暦何年、何に乗っていたとき？", a:"1877年、汽車の車窓から"},
  {cat:"貝塚", q:"ある貝塚から発見された人骨は何体以上？", a:"300体以上"},
  {cat:"貝塚", q:"貝塚の位置と現在の海岸線を比べるとわかることは？", a:"縄文時代は今より気温が高く、海岸線が今より内陸にあったこと"},
  {cat:"三内丸山遺跡", q:"青森県にある、縄文時代の大規模な集落跡が発見された遺跡は？", a:"三内丸山遺跡"},
  {cat:"三内丸山遺跡", q:"三内丸山遺跡の面積はおよそどれくらい？", a:"約42ヘクタール"},
  {cat:"三内丸山遺跡", q:"三内丸山遺跡で見つかったたて穴住居の跡はおよそ何戸？", a:"約500戸"},
  {cat:"三内丸山遺跡", q:"三内丸山遺跡の巨大な柱穴から推定される建物の高さは？", a:"約15m"},
  {cat:"三内丸山遺跡", q:"三内丸山遺跡が発見される前、縄文時代の集落はどう考えられていた？", a:"4〜6世帯ほどの小規模な集落だと考えられていた"},
  {cat:"三内丸山遺跡", q:"三内丸山遺跡の発見によって、何が明らかになった？", a:"縄文時代にも数百人規模の大規模な集落が存在したこと"},
  {cat:"信仰・風習", q:"縄文時代、女性をかたどって作られた土製の人形を何という？", a:"土偶"},
  {cat:"信仰・風習", q:"土偶に女性をかたどったものが多い理由は？", a:"女性が子どもを産む性であることから、収穫の豊かさ（豊作）を祈ったと考えられているため"},
  {cat:"信仰・風習", q:"縄文時代、成人になるための儀式として健康な歯を抜く風習を何という？", a:"抜歯"},
  {cat:"信仰・風習", q:"足を折り曲げて埋葬する方法を何という？", a:"屈葬"},
  {cat:"信仰・風習", q:"屈葬が行われた理由は？", a:"死者の魂がぬけ出して悪霊にならないようにするため"},
  {cat:"信仰・風習", q:"自然のすべてのものに霊が宿ると考える、縄文時代の人々の信仰のあり方を何という？", a:"アニミズム"},
  {cat:"交易", q:"縄文時代の交易品として紹介されている石を2つ挙げると？", a:"黒曜石・ひすい"},
  {cat:"交易", q:"土器の修理などにも使われた、産地の限られる交易品は？", a:"（天然の）アスファルト（コハクも産地が限られる交易品）"},
  {cat:"交易", q:"これらの品が産地から遠く離れた遺跡でも見つかる理由は？", a:"物々交換などの交易を通じて、人から人へと渡っていったから"},
  {cat:"比較・整理", q:"打製石器と磨製石器のちがいは？", a:"打製石器は石を打ち欠いて作る、磨製石器は表面を磨いて作る"},
  {cat:"比較・整理", q:"打製石器・磨製石器は、それぞれどちらの時代の代表的な道具？", a:"打製石器＝旧石器時代／磨製石器＝縄文時代"},
  {cat:"比較・整理", q:"旧石器時代の代表遺跡を2つ挙げると？", a:"岩宿遺跡（群馬県）・野尻湖遺跡（長野県）"},
  {cat:"比較・整理", q:"縄文時代の代表遺跡を2つ挙げると？", a:"大森貝塚（東京都）・三内丸山遺跡（青森県）"},
];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const QUESTION_SECONDS = 7;
const ANSWER_SECONDS = 5;
function currentPhaseSeconds() {
  return showingAnswer ? ANSWER_SECONDS : QUESTION_SECONDS;
}
let orderMode = "shuffle"; // "shuffle" | "sequential"
function makeDeck() {
  return orderMode === "sequential" ? DATA.slice() : shuffle(DATA);
}
let deck = makeDeck();
let idx = 0;
let showingAnswer = false;
let paused = false;
let timer = null;
let tickStart = 0;
let remainingOnPause = QUESTION_SECONDS * 1000;

const questionEl = document.getElementById("question");
const answerBox = document.getElementById("answerBox");
const answerText = document.getElementById("answerText");
const categoryEl = document.getElementById("category");
const counterEl = document.getElementById("counter");
const progressBar = document.getElementById("progressBar");
const playPauseBtn = document.getElementById("playPause");
const restartBtn = document.getElementById("restart");
const restartOrderBtn = document.getElementById("restartOrder");
const fullscreenBtn = document.getElementById("fullscreenBtn");

function renderCard() {
  const item = deck[idx];
  categoryEl.textContent = item.cat;
  counterEl.textContent = (idx + 1) + " / " + deck.length;
  questionEl.textContent = item.q;

  answerBox.classList.add("no-transition");
  answerBox.classList.remove("show");
  void answerBox.offsetWidth;
  answerText.textContent = item.a;
  void answerBox.offsetWidth;
  requestAnimationFrame(() => {
    answerBox.classList.remove("no-transition");
  });

  showingAnswer = false;
}

function step() {
  if (!showingAnswer) {
    answerBox.classList.add("show");
    showingAnswer = true;
  } else {
    idx++;
    if (idx >= deck.length) {
      idx = 0;
      deck = makeDeck();
    }
    renderCard();
  }
  progressBar.style.width = "0%";
  startProgress();
}

function startProgress() {
  const seconds = currentPhaseSeconds();
  progressBar.style.transition = "none";
  progressBar.style.width = "0%";
  requestAnimationFrame(() => {
    progressBar.style.transition = "width " + seconds + "s linear";
    progressBar.style.width = "100%";
  });
}

function scheduleNext() {
  clearTimeout(timer);
  const seconds = currentPhaseSeconds();
  tickStart = Date.now();
  remainingOnPause = seconds * 1000;
  timer = setTimeout(() => {
    step();
    if (!paused) scheduleNext();
  }, seconds * 1000);
}

function pause() {
  paused = true;
  clearTimeout(timer);
  const elapsed = Date.now() - tickStart;
  remainingOnPause = Math.max(currentPhaseSeconds() * 1000 - elapsed, 0);
  progressBar.style.transition = "none";
  playPauseBtn.textContent = "▶ 再生";
}

function resume() {
  paused = false;
  playPauseBtn.textContent = "⏸ 一時停止";
  tickStart = Date.now();
  timer = setTimeout(() => {
    step();
    if (!paused) scheduleNext();
  }, remainingOnPause);
  const remainSec = remainingOnPause / 1000;
  requestAnimationFrame(() => {
    progressBar.style.transition = "width " + remainSec + "s linear";
    progressBar.style.width = "100%";
  });
}

playPauseBtn.addEventListener("click", () => {
  if (paused) resume(); else pause();
});

restartBtn.addEventListener("click", () => {
  orderMode = "shuffle";
  deck = makeDeck();
  idx = 0;
  renderCard();
  progressBar.style.width = "0%";
  if (!paused) {
    startProgress();
    scheduleNext();
  }
});

restartOrderBtn.addEventListener("click", () => {
  orderMode = "sequential";
  deck = makeDeck();
  idx = 0;
  renderCard();
  progressBar.style.width = "0%";
  if (!paused) {
    startProgress();
    scheduleNext();
  }
});

function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function updateFullscreenBtn() {
  fullscreenBtn.textContent = isFullscreen() ? "⛶ 全画面をやめる" : "⛶ 全画面";
}
fullscreenBtn.addEventListener("click", () => {
  const el = document.documentElement;
  if (!isFullscreen()) {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) {
      req.call(el);
    } else {
      alert("この端末のSafariでは全画面ボタンに対応していないようです。\nホーム画面に追加したアイコンから開くと、アドレスバーなしで表示できます。");
    }
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) exit.call(document);
  }
});
document.addEventListener("fullscreenchange", updateFullscreenBtn);
document.addEventListener("webkitfullscreenchange", updateFullscreenBtn);

document.querySelector(".card").addEventListener("click", () => {
  clearTimeout(timer);
  step();
  if (!paused) scheduleNext();
});

renderCard();
startProgress();
scheduleNext();
</script>
</body>
</html>
