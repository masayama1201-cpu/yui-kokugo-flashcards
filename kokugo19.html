  {cat:"漢字の書き取り（ヨウイ等・栄冠）", type:"mc", q:"かれは犯人の足取りを自分自身でオうことにした。", choices:["<ruby>追<rt>お</rt></ruby>う","<ruby>負<rt>お</rt></ruby>う"], correct:0},
  {cat:"漢字の書き取り（ヨウイ等・栄冠）", type:"mc", q:"かれは責任をオっていさぎよく辞職した。", choices:["<ruby>追<rt>お</rt></ruby>う","<ruby>負<rt>お</rt></ruby>う"], correct:1},
  {cat:"漢字の書き取り（ヨウイ等・栄冠）", type:"mc", q:"カゼをひくとカンセツがいたくなるときがある。", choices:["<ruby>間接<rt>かんせつ</rt></ruby>","<ruby>関節<rt>かんせつ</rt></ruby>"], correct:1},
  {cat:"漢字の書き取り（ヨウイ等・栄冠）", type:"mc", q:"自分が過ごしてきたハンセイをふりかえる。", choices:["<ruby>半生<rt>はんせい</rt></ruby>","<ruby>反省<rt>はんせい</rt></ruby>"], correct:0},
  {cat:"漢字の書き取り（ヨウイ等・栄冠）", type:"mc", q:"うそをついたことをハンセイする。", choices:["<ruby>半生<rt>はんせい</rt></ruby>","<ruby>反省<rt>はんせい</rt></ruby>"], correct:1},

  {cat:"漢字の読み取り（栄冠・記号選択）", q:"「入院して二週間たつころ、やっとカイホウに向かった」　ア解放／イ快方／ウ開放", a:"イ（<ruby>快方<rt>かいほう</rt></ruby>）"},
  {cat:"漢字の読み取り（栄冠・記号選択）", q:"「コウセイに名を残す大発見」　ア後世／イ攻勢／ウ構成", a:"ア（<ruby>後世<rt>こうせい</rt></ruby>）"},
  {cat:"漢字の読み取り（栄冠・記号選択）", q:"「祖父のイシをついで山を守る」　ア意思／イ遺志／ウ医師", a:"イ（<ruby>遺志<rt>いし</rt></ruby>）"},
  {cat:"漢字の読み取り（栄冠・記号選択）", q:"「地球にエイセイの平和が訪れることを願う」　ア衛生／イ衛星／ウ永世", a:"ウ（<ruby>永世<rt>えいせい</rt></ruby>）"},
  {cat:"漢字の読み取り（栄冠・記号選択）", q:"「妹はキショウがはげしいので、友だちとよくけんかする」　ア気象／イ気性／ウ起床", a:"イ（<ruby>気性<rt>きしょう</rt></ruby>）"},
  {cat:"漢字の読み取り（栄冠・記号選択）", q:"「シュウカン誌を定期的に読んでいる」　ア週間／イ週刊／ウ習慣", a:"イ（<ruby>週刊<rt>しゅうかん</rt></ruby>）"},
  {cat:"漢字の読み取り（栄冠・記号選択）", q:"「学習に取り組むタイセイをととのえる」　ア体勢／イ大勢／ウ体制", a:"ウ（<ruby>体制<rt>たいせい</rt></ruby>）"},
  {cat:"漢字の読み取り（栄冠・記号選択）", q:"「試合の後半、コウキをとらえて攻めに転じた」　ア好機／イ高貴／ウ好奇", a:"ア（<ruby>好機<rt>こうき</rt></ruby>）"},
  {cat:"漢字の読み取り（栄冠・記号選択）", q:"「無茶な行動をとる若者が増えて、カンシンに堪えない」　ア感心／イ寒心／ウ関心", a:"イ（<ruby>寒心<rt>かんしん</rt></ruby>）"},
  {cat:"漢字の読み取り（栄冠・記号選択）", q:"「いきなりキカイだから、よく話し合おう」　ア機械／イ機会／ウ器械", a:"イ（<ruby>機会<rt>きかい</rt></ruby>）"},
];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const CELEBRATION_PHOTOS = ["images/shakai10-complete.jpg", "images/celebration3.jpg", "images/celebration4.jpg", "images/celebration5.jpg", "images/celebration7.jpg", "images/celebration9.jpg", "images/celebration10.jpg", "images/celebration11.jpg", "images/celebration12.jpg"];
const QUESTION_SECONDS = 7;
const ANSWER_SECONDS = 5;
function currentPhaseSeconds() {
  return showingAnswer ? ANSWER_SECONDS : QUESTION_SECONDS;
}
DATA.forEach((item, i) => { item._id = i; });
const TOTAL_COUNT = DATA.length;
let known = new Set();
try {
  const saved = sessionStorage.getItem("kokugo19_known");
  if (saved) known = new Set(JSON.parse(saved));
} catch (e) {}
function saveKnown() {
  try { sessionStorage.setItem("kokugo19_known", JSON.stringify([...known])); } catch (e) {}
}
function activeData() {
  return DATA.filter(item => !known.has(item._id));
}
let orderMode = "sequential"; // "shuffle" | "sequential"
function makeDeck() {
  const pool = activeData();
  return orderMode === "sequential" ? pool.slice() : shuffle(pool);
}
let deck = makeDeck();
let idx = 0;
let showingAnswer = false;
let paused = false;
let timer = null;
let tickStart = 0;
let remainingOnPause = QUESTION_SECONDS * 1000;
let finished = false;
let currentMcOrder = null; // shuffled original-indices for the mc card currently on screen

const questionEl = document.getElementById("question");
const answerBox = document.getElementById("answerBox");
const answerText = document.getElementById("answerText");
const arrowLabel = document.getElementById("arrowLabel");
const choiceWrap = document.getElementById("choiceWrap");
const choiceBoxes = [
  document.getElementById("choiceBox0"),
  document.getElementById("choiceBox1"),
  document.getElementById("choiceBox2"),
  document.getElementById("choiceBox3"),
];
const CHOICE_LABELS = ["ア", "イ", "ウ", "エ"];
const categoryEl = document.getElementById("category");
const counterEl = document.getElementById("counter");
const masteredCounterEl = document.getElementById("masteredCounter");
const progressBar = document.getElementById("progressBar");
const playPauseBtn = document.getElementById("playPause");
const restartBtn = document.getElementById("restart");
const restartOrderBtn = document.getElementById("restartOrder");
const masterBtn = document.getElementById("masterBtn");
const resetMasteredBtn = document.getElementById("resetMastered");

function updateMasteredCounter() {
  masteredCounterEl.textContent = "✓ おぼえた " + known.size + " / " + TOTAL_COUNT;
}

function renderCard() {
  if (deck.length === 0) {
    finished = true;
    clearTimeout(timer);
    categoryEl.textContent = "🎉 全問クリア";
    counterEl.textContent = TOTAL_COUNT + " / " + TOTAL_COUNT;
    const celebPhoto = CELEBRATION_PHOTOS[Math.floor(Math.random() * CELEBRATION_PHOTOS.length)];
    questionEl.innerHTML = "🎉 全問「おぼえた」にしました！<br><img src=\"" + celebPhoto + "\" alt=\"おめでとう\" style=\"max-width:70vw; max-height:38vh; border-radius:20px; margin-top:2vh; box-shadow:0 4px 20px rgba(0,0,0,0.4);\">";
    answerBox.classList.add("no-transition");
    answerBox.classList.add("show");
    answerText.textContent = "";
    arrowLabel.style.display = "none";
    choiceWrap.style.display = "none";
    resetProgressBar();
    return;
  }
  finished = false;
  arrowLabel.style.display = "";
  const item = deck[idx];
  categoryEl.textContent = item.cat;
  counterEl.textContent = (idx + 1) + " / " + deck.length;
  questionEl.textContent = item.q;

  if (item.type === "mc") {
    answerBox.style.display = "none";
    choiceWrap.style.display = "flex";
    currentMcOrder = shuffle(item.choices.map((_, i) => i));
    choiceBoxes.forEach((box, slot) => {
      box.classList.remove("correct");
      if (slot < currentMcOrder.length) {
        const origIndex = currentMcOrder[slot];
        box.classList.remove("hidden-choice");
        box.innerHTML = CHOICE_LABELS[slot] + "．" + item.choices[origIndex];
      } else {
        box.classList.add("hidden-choice");
        box.innerHTML = "";
      }
    });
  } else {
    answerBox.style.display = "";
    choiceWrap.style.display = "none";
    answerBox.classList.add("no-transition");
    answerBox.classList.remove("show");
    void answerBox.offsetWidth;
    answerText.innerHTML = item.a;
    void answerBox.offsetWidth;
    requestAnimationFrame(() => {
      answerBox.classList.remove("no-transition");
    });
  }

  showingAnswer = false;
}

function step() {
  if (finished) return;
  if (!showingAnswer) {
    const item = deck[idx];
    if (item.type === "mc") {
      const correctSlot = currentMcOrder.indexOf(item.correct);
      choiceBoxes[correctSlot].classList.add("correct");
    } else {
      answerBox.classList.add("show");
    }
    showingAnswer = true;
  } else {
    idx++;
    if (idx >= deck.length) {
      idx = 0;
      deck = makeDeck();
    }
    renderCard();
  }
  startProgress();
}

function resetProgressBar() {
  progressBar.style.transition = "none";
  progressBar.style.width = "0%";
  void progressBar.offsetWidth; // force reflow so the reset is committed before re-enabling the transition
}

function startProgress() {
  const seconds = currentPhaseSeconds();
  resetProgressBar();
  requestAnimationFrame(() => {
    progressBar.style.transition = "width " + seconds + "s linear";
    progressBar.style.width = "100%";
  });
}

function scheduleNext() {
  clearTimeout(timer);
  const seconds = currentPhaseSeconds();
  tickStart = Date.now();
  remainingOnPause = seconds * 1000;
  timer = setTimeout(() => {
    step();
    if (!paused) scheduleNext();
  }, seconds * 1000);
}

function pause() {
  paused = true;
  clearTimeout(timer);
  const elapsed = Date.now() - tickStart;
  remainingOnPause = Math.max(currentPhaseSeconds() * 1000 - elapsed, 0);
  progressBar.style.transition = "none";
  playPauseBtn.textContent = "▶ 再生";
}

function resume() {
  paused = false;
  playPauseBtn.textContent = "⏸ 停止";
  tickStart = Date.now();
  timer = setTimeout(() => {
    step();
    if (!paused) scheduleNext();
  }, remainingOnPause);
  const remainSec = remainingOnPause / 1000;
  requestAnimationFrame(() => {
    progressBar.style.transition = "width " + remainSec + "s linear";
    progressBar.style.width = "100%";
  });
}

playPauseBtn.addEventListener("click", () => {
  if (paused) resume(); else pause();
});

restartBtn.addEventListener("click", () => {
  orderMode = "shuffle";
  deck = makeDeck();
  idx = 0;
  renderCard();
  resetProgressBar();
  if (!paused && !finished) {
    startProgress();
    scheduleNext();
  }
});

restartOrderBtn.addEventListener("click", () => {
  orderMode = "sequential";
  deck = makeDeck();
  idx = 0;
  renderCard();
  resetProgressBar();
  if (!paused && !finished) {
    startProgress();
    scheduleNext();
  }
});

masterBtn.addEventListener("click", () => {
  if (finished || deck.length === 0) return;
  clearTimeout(timer);
  const item = deck[idx];
  known.add(item._id);
  saveKnown();
  updateMasteredCounter();
  deck.splice(idx, 1);
  if (idx >= deck.length) idx = 0;
  renderCard();
  resetProgressBar();
  if (!paused && !finished) {
    startProgress();
    scheduleNext();
  }
});

resetMasteredBtn.addEventListener("click", () => {
  known = new Set();
  saveKnown();
  updateMasteredCounter();
  clearTimeout(timer);
  deck = makeDeck();
  idx = 0;
  renderCard();
  resetProgressBar();
  if (!paused && !finished) {
    startProgress();
    scheduleNext();
  }
});

document.querySelector(".card").addEventListener("click", () => {
  clearTimeout(timer);
  step();
  if (!paused) scheduleNext();
});

updateMasteredCounter();
renderCard();
startProgress();
scheduleNext();
</script>
</body>
