  {cat:"農業・商工業の発達と影響", q:"<span style=\"display:inline-block;font-size:0.5em;line-height:1.5;\">惣村の「掟」としてふさわしくない内容はどれ？<br><br>ア　村の森で、青い生木の葉をかき集めた者は、村人としての身分を失う。<br>イ　他所の者を、村人の身分保証人なしに住まわせてはならない。<br>ウ　村の共有地と私有地の境界争いは、お金で解決すること。<br>エ　豪族が持っている私有地や私有民を廃止せよ。</span>", a:"エ<span style=\"display:block;font-size:0.6em;color:var(--sub);font-weight:500;margin-top:1vh;\">これは律令制以前の公地公民の原則に関する内容で、室町時代の惣村の掟にはふさわしくない</span>"},

  {cat:"農業・商工業の発達と影響", q:"商工業者たちの同業者組合を漢字1字で何という？", a:"<ruby>座<rt>ざ</rt></ruby>"},
  {cat:"農業・商工業の発達と影響", q:"平安時代末に大輪田泊を整備し、宋との貿易を開始した人物は？", a:"<ruby>平清盛<rt>たいらのきよもり</rt></ruby>"},
  {cat:"農業・商工業の発達と影響", q:"室町時代に明との正式な貿易を開始した人物は？", a:"<ruby>足利義満<rt>あしかがよしみつ</rt></ruby>"},
  {cat:"農業・商工業の発達と影響", q:"1428年、金を貸す業者を襲う暴動が起こった。この暴動の名は？", a:"<ruby>正長の土一揆<rt>しょうちょうのつちいっき</rt></ruby>"},
];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const CELEBRATION_PHOTOS = ["images/shakai10-complete.jpg", "images/celebration3.jpg", "images/celebration4.jpg", "images/celebration5.jpg", "images/celebration7.jpg", "images/celebration9.jpg", "images/celebration10.jpg", "images/celebration11.jpg", "images/celebration12.jpg", "images/celebration13.jpg", "images/celebration14.jpg", "images/celebration15.jpg", "images/celebration16.jpg", "images/celebration17.jpg", "images/celebration18.jpg", "images/celebration19.jpg", "images/celebration20.jpg", "images/celebration21.jpg", "images/celebration22.jpg"];
const QUESTION_SECONDS = 7;
const ANSWER_SECONDS = 5;
function currentPhaseSeconds() {
  return showingAnswer ? ANSWER_SECONDS : QUESTION_SECONDS;
}

DATA.forEach((item, i) => { item._id = i; });
const TOTAL_COUNT = DATA.length;

// ---- ステージ分割（同じカテゴリの連続した問題を1ステージとし、STAGE_UNIT問を超える場合はさらに分割する）----
const STAGE_UNIT = 10;
function buildStages(data) {
  const runs = [];
  let i = 0;
  while (i < data.length) {
    let j = i;
    while (j < data.length && data[j].cat === data[i].cat) j++;
    runs.push({ cat: data[i].cat, start: i, end: j });
    i = j;
  }
  const catCount = {};
  const stages = [];
  runs.forEach(run => {
    catCount[run.cat] = (catCount[run.cat] || 0) + 1;
    const occurrence = catCount[run.cat];
    const total = run.end - run.start;
    const numChunks = Math.ceil(total / STAGE_UNIT);
    const chunkBase = Math.floor(total / numChunks);
    const remainder = total % numChunks;
    let pos = run.start;
    for (let c = 0; c < numChunks; c++) {
      const size = chunkBase + (c < remainder ? 1 : 0);
      const ids = [];
      for (let k = 0; k < size; k++) { ids.push(pos); pos++; }
      let label = run.cat;
      if (occurrence > 1) label += "（つづき" + (occurrence > 2 ? occurrence - 1 : "") + "）";
      if (numChunks > 1) label += "　" + (c + 1) + "/" + numChunks;
      stages.push({ label, ids });
    }
  });
  stages.forEach((s, idx) => {
    s.ids.forEach(id => { data[id]._stage = idx; });
  });
  return stages;
}
const STAGES = buildStages(DATA);

let known = new Set();
try {
  const saved = sessionStorage.getItem("shakai18_known");
  if (saved) known = new Set(JSON.parse(saved));
} catch (e) {}
function saveKnown() {
  try { sessionStorage.setItem("shakai18_known", JSON.stringify([...known])); } catch (e) {}
}

let currentStage = null;
function activeData() {
  return DATA.filter(item => item._stage === currentStage && !known.has(item._id));
}
let orderMode = "sequential"; // "shuffle" | "sequential"
function makeDeck() {
  const pool = activeData();
  return orderMode === "sequential" ? pool.slice() : shuffle(pool);
}
let deck = [];
let idx = 0;
let showingAnswer = false;
let paused = false;
let timer = null;
let tickStart = 0;
let remainingOnPause = QUESTION_SECONDS * 1000;
let finished = false;

const stageSelectEl = document.getElementById("stageSelect");
const stageListEl = document.getElementById("stageList");
const overallCounterEl = document.getElementById("overallCounter");
const allClearMsgEl = document.getElementById("allClearMsg");
const wrapEl = document.getElementById("wrap");

const questionEl = document.getElementById("question");
const answerBox = document.getElementById("answerBox");
const answerText = document.getElementById("answerText");
const arrowLabel = document.getElementById("arrowLabel");
const categoryEl = document.getElementById("category");
const counterEl = document.getElementById("counter");
const masteredCounterEl = document.getElementById("masteredCounter");
const progressBar = document.getElementById("progressBar");
const playPauseBtn = document.getElementById("playPause");
const restartBtn = document.getElementById("restart");
const restartOrderBtn = document.getElementById("restartOrder");
const masterBtn = document.getElementById("masterBtn");
const resetMasteredBtn = document.getElementById("resetMastered");
const backToStagesBtn = document.getElementById("backToStages");
const resetAllBtn = document.getElementById("resetAllBtn");

function stageMasteredCount(i) {
  return STAGES[i].ids.filter(id => known.has(id)).length;
}
function isStageUnlocked(i) {
  if (i === 0) return true;
  return stageMasteredCount(i - 1) === STAGES[i - 1].ids.length;
}
function renderStageList() {
  stageListEl.innerHTML = "";
  STAGES.forEach((stage, i) => {
    const unlocked = isStageUnlocked(i);
    const masteredN = stageMasteredCount(i);
    const total = stage.ids.length;
    const cleared = masteredN === total;
    const btn = document.createElement("button");
    btn.className = "stage-item" + (unlocked ? "" : " locked") + (cleared ? " cleared" : "");
    btn.innerHTML =
      "<span class=\"stage-left\">" +
      "<span class=\"stage-num\">" + (i + 1) + "</span>" +
      "<span class=\"stage-label\">" + stage.label + "</span>" +
      "</span>" +
      "<span class=\"stage-progress\">" + (unlocked ? (cleared ? "✓ クリア（" + total + "問）" : masteredN + " / " + total + " 問") : "🔒 ロック中") + "</span>";
    if (unlocked) {
      btn.addEventListener("click", () => startStage(i));
    } else {
      btn.disabled = true;
    }
    stageListEl.appendChild(btn);
  });
  overallCounterEl.textContent = known.size + " / " + TOTAL_COUNT;
  allClearMsgEl.style.display = known.size === TOTAL_COUNT ? "" : "none";
}

function showStageSelect() {
  clearTimeout(timer);
  wrapEl.classList.remove("active");
  stageSelectEl.classList.add("active");
  renderStageList();
}

function startStage(i) {
  currentStage = i;
  stageSelectEl.classList.remove("active");
  wrapEl.classList.add("active");
  orderMode = "sequential";
  deck = makeDeck();
  idx = 0;
  paused = false;
  playPauseBtn.textContent = "⏸";
  renderCard();
  resetProgressBar();
  updateMasteredCounter();
  if (!finished) {
    startProgress();
    scheduleNext();
  }
}

function updateMasteredCounter() {
  if (currentStage === null) return;
  const total = STAGES[currentStage].ids.length;
  const n = stageMasteredCount(currentStage);
  masteredCounterEl.textContent = "✓ このステージ " + n + " / " + total;
}

function resetProgressBar() {
  progressBar.style.transition = "none";
  progressBar.style.width = "0%";
  void progressBar.offsetWidth;
}

function renderCard() {
  if (deck.length === 0) {
    finished = true;
    clearTimeout(timer);
    const stageTotal = STAGES[currentStage].ids.length;
    categoryEl.textContent = "🎉 ステージクリア";
    counterEl.textContent = stageTotal + " / " + stageTotal;
    const celebPhoto = CELEBRATION_PHOTOS[Math.floor(Math.random() * CELEBRATION_PHOTOS.length)];
    questionEl.innerHTML = "🎉 このステージ、全部「おぼえた」！<br><img src=\"" + celebPhoto + "\" alt=\"おめでとう\" style=\"max-width:60vw; max-height:34vh; border-radius:20px; margin-top:2vh; box-shadow:0 4px 20px rgba(0,0,0,0.4);\">";
    answerBox.classList.add("no-transition");
    answerBox.classList.add("show");
    answerText.innerHTML = "タップしてステージ選択にもどる";
    arrowLabel.style.display = "none";
    resetProgressBar();
    return;
  }
  finished = false;
  arrowLabel.style.display = "";
  const item = deck[idx];
  categoryEl.textContent = item.cat;
  counterEl.textContent = (idx + 1) + " / " + deck.length;
  questionEl.innerHTML = item.q;

  answerBox.classList.add("no-transition");
  answerBox.classList.remove("show");
  void answerBox.offsetWidth;
  answerText.innerHTML = item.a;
  void answerBox.offsetWidth;
  requestAnimationFrame(() => {
    answerBox.classList.remove("no-transition");
  });

  showingAnswer = false;
}

function step() {
  if (finished) return;
  if (!showingAnswer) {
    answerBox.classList.add("show");
    showingAnswer = true;
  } else {
    idx++;
    if (idx >= deck.length) {
      idx = 0;
      deck = makeDeck();
    }
    renderCard();
  }
  startProgress();
}

function startProgress() {
  const seconds = currentPhaseSeconds();
  resetProgressBar();
  requestAnimationFrame(() => {
    progressBar.style.transition = "width " + seconds + "s linear";
    progressBar.style.width = "100%";
  });
}

function scheduleNext() {
  clearTimeout(timer);
  const seconds = currentPhaseSeconds();
  tickStart = Date.now();
  remainingOnPause = seconds * 1000;
  timer = setTimeout(() => {
    step();
    if (!paused) scheduleNext();
  }, seconds * 1000);
}

function pause() {
  paused = true;
  clearTimeout(timer);
  const elapsed = Date.now() - tickStart;
  remainingOnPause = Math.max(currentPhaseSeconds() * 1000 - elapsed, 0);
  progressBar.style.transition = "none";
  playPauseBtn.textContent = "▶";
}

function resume() {
  paused = false;
  playPauseBtn.textContent = "⏸";
  tickStart = Date.now();
  timer = setTimeout(() => {
    step();
    if (!paused) scheduleNext();
  }, remainingOnPause);
  const remainSec = remainingOnPause / 1000;
  requestAnimationFrame(() => {
    progressBar.style.transition = "width " + remainSec + "s linear";
    progressBar.style.width = "100%";
  });
}

playPauseBtn.addEventListener("click", () => {
  if (paused) resume(); else pause();
});

restartBtn.addEventListener("click", () => {
  orderMode = "shuffle";
  deck = makeDeck();
  idx = 0;
  renderCard();
  resetProgressBar();
  if (!paused && !finished) {
    startProgress();
    scheduleNext();
  }
});

restartOrderBtn.addEventListener("click", () => {
  orderMode = "sequential";
  deck = makeDeck();
  idx = 0;
  renderCard();
  resetProgressBar();
  if (!paused && !finished) {
    startProgress();
    scheduleNext();
  }
});

masterBtn.addEventListener("click", () => {
  if (finished || deck.length === 0) return;
  clearTimeout(timer);
  const item = deck[idx];
  known.add(item._id);
  saveKnown();
  updateMasteredCounter();
  deck.splice(idx, 1);
  if (idx >= deck.length) idx = 0;
  renderCard();
  resetProgressBar();
  if (!paused && !finished) {
    startProgress();
    scheduleNext();
  }
});

resetMasteredBtn.addEventListener("click", () => {
  if (currentStage === null) return;
  STAGES[currentStage].ids.forEach(id => known.delete(id));
  saveKnown();
  updateMasteredCounter();
  clearTimeout(timer);
  deck = makeDeck();
  idx = 0;
  renderCard();
  resetProgressBar();
  if (!paused && !finished) {
    startProgress();
    scheduleNext();
  }
});

backToStagesBtn.addEventListener("click", () => {
  showStageSelect();
});

resetAllBtn.addEventListener("click", () => {
  if (!confirm("すべてのステージの「おぼえた」記録をリセットします。よろしいですか？")) return;
  known = new Set();
  saveKnown();
  renderStageList();
});

document.querySelector(".card").addEventListener("click", () => {
  if (finished) {
    showStageSelect();
    return;
  }
  clearTimeout(timer);
  step();
  if (!paused) scheduleNext();
});

renderStageList();
</script>
</body>
