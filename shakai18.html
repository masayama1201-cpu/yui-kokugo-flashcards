<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12181f">
<title>社会（5年後期 第7回：武士の世の中と人々のくらし 外国から攻められた日本／栄冠 学び直し③演習）</title>
<style>
  :root {
    --bg: #12181f;
    --card-bg: #1c2733;
    --accent: #ffb347;
    --answer: #7ed6a5;
    --text: #f5f7fa;
    --sub: #9fb0c3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    overflow: hidden;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    width: 100vw;
    height: 100vh;
    padding: 3vh 5vw;
  }
  .topbar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 2.2vw;
    color: var(--sub);
  }
  .category {
    background: rgba(255,179,71,0.15);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 0.6vh 2vw;
    font-weight: bold;
  }
  .progress-wrap {
    width: 100%;
    height: 1.2vh;
    background: #2a3644;
    border-radius: 999px;
    margin-top: 1.5vh;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s linear;
  }
  .card {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 4vh;
  }
  .qlabel {
    font-size: 2vw;
    letter-spacing: 0.3em;
    color: var(--sub);
  }
  .question {
    font-size: 0.52em;
    font-weight: 800;
    line-height: 1.5;
    max-width: 90vw;
    font-size: 3.4vw;
  }
  .question .choices {
    display: block;
    text-align: left;
    font-size: 0.6em;
    line-height: 1.8;
    margin-top: 1.5vh;
    max-width: 80vw;
    margin-left: auto;
    margin-right: auto;
  }
  .answer-box {
    font-size: 3vw;
    font-weight: 800;
    color: var(--answer);
    line-height: 1.4;
    max-width: 90vw;
    min-height: 6vw;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .answer-box.show {
    opacity: 1;
    transform: translateY(0);
  }
  .answer-box.no-transition {
    transition: none !important;
  }
  .answer-box .arrow {
    color: var(--sub);
    font-size: 3vw;
    margin-right: 0.4em;
  }
  .answer-box .note {
    display: block;
    font-size: 0.55em;
    color: var(--sub);
    font-weight: 500;
    margin-top: 1vh;
  }
  .bottombar {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 3vw;
    font-size: 1.8vw;
    color: var(--sub);
  }
  button {
    background: #2a3644;
    color: var(--text);
    border: none;
    border-radius: 999px;
    padding: 2.5vh 2.2vw;
    font-size: 1.8vw;
    cursor: pointer;
  }
  button:hover { background: #34445a; }
  ruby { ruby-position: over; }
  rt {
    font-size: 0.42em;
    font-weight: 600;
    color: var(--sub);
    user-select: none;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="category" id="category">社会・第7回・学び直し③演習</span>
    <span id="counter">1 / 14</span>
    <span id="masteredCounter">✓ おぼえた 0 / 14</span>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <div class="card">
    <div class="qlabel">Q</div>
    <div class="question" id="question">読み込み中…</div>
    <div class="answer-box" id="answerBox"><span class="arrow" id="arrowLabel">A</span><span id="answerText"></span></div>
  </div>

  <div class="bottombar">
    <button id="playPause">⏸ 停止</button>
    <button id="restart">🔀 シャッフル</button>
    <button id="restartOrder">📖 テキスト順</button>
    <button id="masterBtn">✓ 覚えた</button>
    <button id="resetMastered">🔄 リセット</button>
  </div>
</div>

<script>
const DATA = [
  {cat:"史料読解｜御成敗式目", q:"【史料】1232年につくられた、この史料のきまりを何という？", a:"<ruby>御成敗式目<rt>ごせいばいしきもく</rt></ruby>"},
  {cat:"史料読解｜御成敗式目", q:"この史料（御成敗式目）をつくった人物はだれ？", a:"<ruby>北条泰時<rt>ほうじょうやすとき</rt></ruby>"},
  {cat:"史料読解｜御成敗式目", q:"御成敗式目第3条にある、国ごとの軍事や警察を担当した役職（空らん1）は？", a:"<ruby>守護<rt>しゅご</rt></ruby>"},
  {cat:"史料読解｜御成敗式目", q:"御成敗式目第3条にある、荘園ごとに置かれ年貢の取り立てなどをおこなった役職（空らん3）は？", a:"<ruby>地頭<rt>じとう</rt></ruby>"},
  {cat:"史料読解｜御成敗式目", q:"地頭の仕事として正しいものはどれ？<span class=\"choices\">ア　荘園の管理や年貢の取り立てをおこなう。<br>イ　村人の戸籍を作成して、口分田を割り当てる。<br>ウ　国ごとの軍事や警察の仕事をおこなう。<br>エ　農民を集めて都まで税を運搬させる。</span>", a:"ア"},
  {cat:"史料読解｜御成敗式目", q:"御成敗式目の条文に出てくる「（空らん2）公」とは、鎌倉幕府の初代将軍のこと。だれのこと？", a:"<ruby>源頼朝<rt>みなもとのよりとも</rt></ruby>"},
  {cat:"史料読解｜御成敗式目", q:"御成敗式目に書かれている、朝廷や貴族が守るべききまりを漢字2字で何という？", a:"<ruby>律令<rt>りつりょう</rt></ruby>"},
  {cat:"史料読解｜御成敗式目", q:"御成敗式目の内容として書かれていないものはどれ？<span class=\"choices\">ア　諸国に置いた鎌倉幕府の役人は、国司の仕事をじゃましてはいけない。<br>イ　鎌倉幕府の武士は、かならず鎌倉と京都を往復するのが義務である。<br>ウ　跡継ぎのいない女性が、養子をとって自分の土地をゆずることをみとめる。</span>", a:"イ<span class=\"note\">「鎌倉と京都を往復するのが義務」という内容は書かれていない</span>"},

  {cat:"文章読解｜元寇", q:"鎌倉幕府の実権をにぎった、北条氏による政治を何という？", a:"<ruby>執権政治<rt>しっけんせいじ</rt></ruby>"},
  {cat:"文章読解｜元寇", q:"元の軍隊が最初に上陸したのは、九州のどのあたり？", a:"<ruby>博多湾<rt>はかたわん</rt></ruby>一帯（九州北部）<span class=\"note\">原文は地図から選ぶ問題（答え：イ）</span>"},
  {cat:"文章読解｜元寇", q:"元との2度にわたる戦いを指揮した鎌倉幕府の指導者はだれ？", a:"<ruby>北条時宗<rt>ほうじょうときむね</rt></ruby>"},
  {cat:"文章読解｜元寇", q:"元との戦いのようすを描いた絵についての説明で、あやまっているものはどれ？<span class=\"choices\">ア　馬にのった日本の武士が苦戦している。<br>イ　元軍は、戦いの中で火薬を使った兵器を使っている。<br>ウ　日本の武士たちが集団を組み、弓を放っている。<br>エ　日本の武士は、鎧や兜を身につけ、一騎討ちの戦法をとっている。</span>", a:"ウ<span class=\"note\">集団で弓を放ったのは元軍。日本の武士は一騎討ちの戦法をとった</span>"},
  {cat:"文章読解｜元寇", q:"元との最初の戦いを何という？", a:"<ruby>文永<rt>ぶんえい</rt></ruby>の役"},
  {cat:"文章読解｜元寇", q:"元との2度にわたる戦いの結果について、あやまっている文はどれ？<span class=\"choices\">ア　幕府は御家人以外の全国の武士にも命令をくだすことができるようになった。<br>イ　武士たちは、3度目の元の来襲に備えなければならなかった。<br>ウ　2度にわたる元との戦いに勝ち、武士には十分な恩賞があたえられた。</span>", a:"ウ<span class=\"note\">日本は元の土地を奪ったわけではなかったため、武士に十分な恩賞は与えられなかった</span>"},
];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const CELEBRATION_PHOTOS = ["images/shakai10-complete.jpg", "images/celebration3.jpg", "images/celebration4.jpg", "images/celebration5.jpg", "images/celebration7.jpg", "images/celebration9.jpg", "images/celebration10.jpg", "images/celebration11.jpg", "images/celebration12.jpg"];
const QUESTION_SECONDS = 9;
const ANSWER_SECONDS = 6;
function currentPhaseSeconds() {
  return showingAnswer ? ANSWER_SECONDS : QUESTION_SECONDS;
}
DATA.forEach((item, i) => { item._id = i; });
const TOTAL_COUNT = DATA.length;
let known = new Set();
try {
  const saved = sessionStorage.getItem("shakai18_known");
  if (saved) known = new Set(JSON.parse(saved));
} catch (e) {}
function saveKnown() {
  try { sessionStorage.setItem("shakai18_known", JSON.stringify([...known])); } catch (e) {}
}
function activeData() {
  return DATA.filter(item => !known.has(item._id));
}
let orderMode = "sequential"; // "shuffle" | "sequential"
function makeDeck() {
  const pool = activeData();
  return orderMode === "sequential" ? pool.slice() : shuffle(pool);
}
let deck = makeDeck();
let idx = 0;
let showingAnswer = false;
let paused = false;
let timer = null;
let tickStart = 0;
let remainingOnPause = QUESTION_SECONDS * 1000;
let finished = false;

const questionEl = document.getElementById("question");
const answerBox = document.getElementById("answerBox");
const answerText = document.getElementById("answerText");
const arrowLabel = document.getElementById("arrowLabel");
const categoryEl = document.getElementById("category");
const counterEl = document.getElementById("counter");
const masteredCounterEl = document.getElementById("masteredCounter");
const progressBar = document.getElementById("progressBar");
const playPauseBtn = document.getElementById("playPause");
const restartBtn = document.getElementById("restart");
const restartOrderBtn = document.getElementById("restartOrder");
const masterBtn = document.getElementById("masterBtn");
const resetMasteredBtn = document.getElementById("resetMastered");

function updateMasteredCounter() {
  masteredCounterEl.textContent = "✓ おぼえた " + known.size + " / " + TOTAL_COUNT;
}

function resetProgressBar() {
  progressBar.style.transition = "none";
  progressBar.style.width = "0%";
  void progressBar.offsetWidth;
}

function renderCard() {
  if (deck.length === 0) {
    finished = true;
    clearTimeout(timer);
    categoryEl.textContent = "🎉 全問クリア";
    counterEl.textContent = TOTAL_COUNT + " / " + TOTAL_COUNT;
    const celebPhoto = CELEBRATION_PHOTOS[Math.floor(Math.random() * CELEBRATION_PHOTOS.length)];
    questionEl.innerHTML = "🎉 全問「おぼえた」にしました！<br><img src=\"" + celebPhoto + "\" alt=\"おめでとう\" style=\"max-width:70vw; max-height:38vh; border-radius:20px; margin-top:2vh; box-shadow:0 4px 20px rgba(0,0,0,0.4);\">";
    answerBox.classList.add("no-transition");
    answerBox.classList.add("show");
    answerText.innerHTML = "";
    arrowLabel.style.display = "none";
    resetProgressBar();
    return;
  }
  finished = false;
  arrowLabel.style.display = "";
  const item = deck[idx];
  categoryEl.textContent = item.cat;
  counterEl.textContent = (idx + 1) + " / " + deck.length;
  questionEl.innerHTML = item.q;

  answerBox.classList.add("no-transition");
  answerBox.classList.remove("show");
  void answerBox.offsetWidth;
  answerText.innerHTML = item.a;
  void answerBox.offsetWidth;
  requestAnimationFrame(() => {
    answerBox.classList.remove("no-transition");
  });

  showingAnswer = false;
}

function step() {
  if (finished) return;
  if (!showingAnswer) {
    answerBox.classList.add("show");
    showingAnswer = true;
  } else {
    idx++;
    if (idx >= deck.length) {
      idx = 0;
      deck = makeDeck();
    }
    renderCard();
  }
  startProgress();
}

function startProgress() {
  const seconds = currentPhaseSeconds();
  resetProgressBar();
  requestAnimationFrame(() => {
    progressBar.style.transition = "width " + seconds + "s linear";
    progressBar.style.width = "100%";
  });
}

function scheduleNext() {
  clearTimeout(timer);
  const seconds = currentPhaseSeconds();
  tickStart = Date.now();
  remainingOnPause = seconds * 1000;
  timer = setTimeout(() => {
    step();
    if (!paused) scheduleNext();
  }, seconds * 1000);
}

function pause() {
  paused = true;
  clearTimeout(timer);
  const elapsed = Date.now() - tickStart;
  remainingOnPause = Math.max(currentPhaseSeconds() * 1000 - elapsed, 0);
  progressBar.style.transition = "none";
  playPauseBtn.textContent = "▶ 再生";
}

function resume() {
  paused = false;
  playPauseBtn.textContent = "⏸ 停止";
  tickStart = Date.now();
  timer = setTimeout(() => {
    step();
    if (!paused) scheduleNext();
  }, remainingOnPause);
  const remainSec = remainingOnPause / 1000;
  requestAnimationFrame(() => {
    progressBar.style.transition = "width " + remainSec + "s linear";
    progressBar.style.width = "100%";
  });
}

playPauseBtn.addEventListener("click", () => {
  if (paused) resume(); else pause();
});

restartBtn.addEventListener("click", () => {
  orderMode = "shuffle";
  deck = makeDeck();
  idx = 0;
  renderCard();
  resetProgressBar();
  if (!paused && !finished) {
    startProgress();
    scheduleNext();
  }
});

restartOrderBtn.addEventListener("click", () => {
  orderMode = "sequential";
  deck = makeDeck();
  idx = 0;
  renderCard();
  resetProgressBar();
  if (!paused && !finished) {
    startProgress();
    scheduleNext();
  }
});

masterBtn.addEventListener("click", () => {
  if (finished || deck.length === 0) return;
  clearTimeout(timer);
  const item = deck[idx];
  known.add(item._id);
  saveKnown();
  updateMasteredCounter();
  deck.splice(idx, 1);
  if (idx >= deck.length) idx = 0;
  renderCard();
  resetProgressBar();
  if (!paused && !finished) {
    startProgress();
    scheduleNext();
  }
});

resetMasteredBtn.addEventListener("click", () => {
  known = new Set();
  saveKnown();
  updateMasteredCounter();
  clearTimeout(timer);
  deck = makeDeck();
  idx = 0;
  renderCard();
  resetProgressBar();
  if (!paused && !finished) {
    startProgress();
    scheduleNext();
  }
});

document.querySelector(".card").addEventListener("click", () => {
  clearTimeout(timer);
  step();
  if (!paused) scheduleNext();
});

updateMasteredCounter();
renderCard();
startProgress();
scheduleNext();
</script>
</body>
</html>
