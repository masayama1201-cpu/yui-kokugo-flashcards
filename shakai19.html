<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12181f">
<title>社会（5年後期 第8回：武士の世の中と人々のくらし 立ち上がる農民たち／栄冠 学び直し①）</title>
<style>
  :root {
    --bg: #12181f;
    --card-bg: #1c2733;
    --accent: #ffb347;
    --answer: #7ed6a5;
    --text: #f5f7fa;
    --sub: #9fb0c3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    overflow: hidden;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    width: 100vw;
    height: 100vh;
    padding: 3vh 5vw;
  }
  .topbar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 2.2vw;
    color: var(--sub);
  }
  .category {
    background: rgba(255,179,71,0.15);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 0.6vh 2vw;
    font-weight: bold;
  }
  .progress-wrap {
    width: 100%;
    height: 1.2vh;
    background: #2a3644;
    border-radius: 999px;
    margin-top: 1.5vh;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s linear;
  }
  .card {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 4vh;
  }
  .qlabel {
    font-size: 2vw;
    letter-spacing: 0.3em;
    color: var(--sub);
  }
  .question {
    font-size: 4.4vw;
    font-weight: 800;
    line-height: 1.4;
    max-width: 90vw;
  }
  .answer-box {
    font-size: 3.6vw;
    font-weight: 800;
    color: var(--answer);
    line-height: 1.4;
    max-width: 90vw;
    min-height: 6vw;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .answer-box.show {
    opacity: 1;
    transform: translateY(0);
  }
  .answer-box.no-transition {
    transition: none !important;
  }
  .answer-box .arrow {
    color: var(--sub);
    font-size: 3vw;
    margin-right: 0.4em;
  }
  .bottombar {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 3vw;
    font-size: 1.8vw;
    color: var(--sub);
  }
  button {
    background: #2a3644;
    color: var(--text);
    border: none;
    border-radius: 999px;
    padding: 2.5vh 2.2vw;
    font-size: 1.8vw;
    cursor: pointer;
  }
  button:hover { background: #34445a; }
  ruby { ruby-position: over; }
  rt {
    font-size: 0.42em;
    font-weight: 600;
    color: var(--sub);
    user-select: none;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="category" id="category">社会・第8回・学び直し①</span>
    <span id="counter">1 / 39</span>
    <span id="masteredCounter">✓ おぼえた 0 / 39</span>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <div class="card">
    <div class="qlabel">Q</div>
    <div class="question" id="question">読み込み中…</div>
    <div class="answer-box" id="answerBox"><span class="arrow" id="arrowLabel">A</span><span id="answerText"></span></div>
  </div>

  <div class="bottombar">
    <button id="playPause">⏸ 停止</button>
    <button id="restart">🔀 シャッフル</button>
    <button id="restartOrder">📖 テキスト順</button>
    <button id="masterBtn">✓ 覚えた</button>
    <button id="resetMastered">🔄 リセット</button>
  </div>
</div>

<script>
const DATA = [
  {cat:"年表｜南北朝〜室町幕府全盛", q:"1334年、後醍醐天皇が始めた、天皇中心の政治を何という？", a:"<ruby>建武の新政<rt>けんむのしんせい</rt></ruby>"},
  {cat:"年表｜南北朝〜室町幕府全盛", q:"1336年、後醍醐天皇がのがれた奈良の地名は？", a:"<ruby>吉野<rt>よしの</rt></ruby>"},
  {cat:"年表｜南北朝〜室町幕府全盛", q:"1338年、北朝の天皇から征夷大将軍に任命されたのはだれ？", a:"<ruby>足利尊氏<rt>あしかがたかうじ</rt></ruby>"},
  {cat:"年表｜南北朝〜室町幕府全盛", q:"1378年、室町に花の御所をつくって移り住んだのはだれ？", a:"<ruby>足利義満<rt>あしかがよしみつ</rt></ruby>"},
  {cat:"年表｜南北朝〜室町幕府全盛", q:"1392年、南北朝を合一したのはだれ？", a:"<ruby>足利義満<rt>あしかがよしみつ</rt></ruby>"},
  {cat:"年表｜南北朝〜室町幕府全盛", q:"1397年、北山に金箔をはって建てられた建物は？", a:"<ruby>金閣<rt>きんかく</rt></ruby>"},
  {cat:"年表｜南北朝〜室町幕府全盛", q:"1401年、その取りしまりを求めて明との国交が開かれるきっかけとなった海賊は？", a:"<ruby>倭寇<rt>わこう</rt></ruby>"},
  {cat:"年表｜南北朝〜室町幕府全盛", q:"1404年、日明貿易で用いられるようになったものは？", a:"<ruby>勘合<rt>かんごう</rt></ruby>"},
  {cat:"年表｜南北朝〜室町幕府全盛", q:"1428年、近畿地方で民衆が酒屋や土倉を襲って起こったできごとは？", a:"<ruby>正長の土一揆<rt>しょうちょうのつちいっき</rt></ruby>"},

  {cat:"新しく始まった政治", q:"1334年、天皇自らが政治をおこなった人物はだれ？", a:"<ruby>後醍醐天皇<rt>ごだいごてんのう</rt></ruby>"},
  {cat:"新しく始まった政治", q:"<ruby>後醍醐天皇<rt>ごだいごてんのう</rt></ruby>が始めた、天皇自らがおこなう政治を何という？", a:"<ruby>建武の新政<rt>けんむのしんせい</rt></ruby>"},
  {cat:"新しく始まった政治", q:"建武の新政の失敗後、後醍醐天皇がのがれた奈良の地名は？", a:"<ruby>吉野<rt>よしの</rt></ruby>"},
  {cat:"新しく始まった政治", q:"京都に別の天皇を立て、その天皇から征夷大将軍に任命されて幕府を開いたのはだれ？", a:"<ruby>足利尊氏<rt>あしかがたかうじ</rt></ruby>"},
  {cat:"新しく始まった政治", q:"室町幕府で、将軍を補佐する役職として置かれたのは？", a:"<ruby>管領<rt>かんれい</rt></ruby>"},

  {cat:"室町幕府の全盛期", q:"室町幕府が全盛期をむかえたのは、何代将軍のとき？", a:"3代将軍<ruby>足利義満<rt>あしかがよしみつ</rt></ruby>"},
  {cat:"室町幕府の全盛期", q:"3代将軍が京都の室町に建てて政治をおこなった御所は？", a:"<ruby>花の御所<rt>はなのごしょ</rt></ruby>"},
  {cat:"室町幕府の全盛期", q:"南北朝の合一が実現した年は西暦何年？", a:"1392年"},
  {cat:"室町幕府の全盛期", q:"1394年、足利義満が任ぜられた朝廷の最高職は？", a:"<ruby>太政大臣<rt>だいじょうだいじん</rt></ruby>"},
  {cat:"室町幕府の全盛期", q:"3代将軍が貿易を開始した、当時の中国の王朝は？", a:"<ruby>明<rt>みん</rt></ruby>"},
  {cat:"室町幕府の全盛期", q:"中国や朝鮮半島の沿岸部で海賊行為をはたらいていた集団は？", a:"<ruby>倭寇<rt>わこう</rt></ruby>"},
  {cat:"室町幕府の全盛期", q:"正式な貿易船と海賊を区別するために用いられたものは？", a:"<ruby>勘合<rt>かんごう</rt></ruby>"},
  {cat:"室町幕府の全盛期", q:"3代将軍が金箔をふんだんに使って建てた建物は？", a:"<ruby>金閣<rt>きんかく</rt></ruby>"},
  {cat:"室町幕府の全盛期", q:"公家文化と武家文化が融合した、室町時代前半の文化を何という？（建物が建てられた場所の名にちなむ）", a:"<ruby>北山文化<rt>きたやまぶんか</rt></ruby>"},
  {cat:"室町幕府の全盛期", q:"観阿弥・世阿弥父子によって大成された芸能は？", a:"<ruby>能<rt>のう</rt></ruby>"},
  {cat:"室町幕府の全盛期", q:"能を大成した観阿弥の子はだれ？", a:"<ruby>世阿弥<rt>ぜあみ</rt></ruby>"},

  {cat:"農業・商工業の発達", q:"鎌倉時代に近畿地方で始まり、室町時代に各地へ広まった農法は？", a:"<ruby>二毛作<rt>にもうさく</rt></ruby>"},
  {cat:"農業・商工業の発達", q:"草木の灰に加えて肥料として利用されるようになったものは？（牛馬や人のふん）", a:"<ruby>肥料<rt>ひりょう</rt></ruby>"},
  {cat:"農業・商工業の発達", q:"耕地面積を増やすために灌漑に利用されるようになった道具は？", a:"<ruby>水車<rt>すいしゃ</rt></ruby>"},
  {cat:"農業・商工業の発達", q:"三河で栽培が始まり、庶民の衣服の材料となった作物は？", a:"<ruby>綿花<rt>めんか</rt></ruby>"},
  {cat:"農業・商工業の発達", q:"紀伊の特産物は？", a:"みかん"},
  {cat:"農業・商工業の発達", q:"甲斐の特産物は？", a:"ぶどう"},
  {cat:"農業・商工業の発達", q:"京都で始まった、現在も特産品として知られる絹織物は？", a:"<ruby>西陣織<rt>にしじんおり</rt></ruby>"},
  {cat:"農業・商工業の発達", q:"室町時代に毎月6日ほど開かれるようになった市を何という？", a:"<ruby>定期市<rt>ていきいち</rt></ruby>"},
  {cat:"農業・商工業の発達", q:"定期市で用いられた、中国から輸入された貨幣は？", a:"<ruby>銅銭<rt>どうせん</rt></ruby>"},
  {cat:"農業・商工業の発達", q:"商工業者たちの同業者組合を何という？", a:"<ruby>座<rt>ざ</rt></ruby>"},
  {cat:"農業・商工業の発達", q:"室町時代の農民たちが村のことを決めるためにおこなった話し合いは？", a:"<ruby>寄合<rt>よりあい</rt></ruby>"},
  {cat:"農業・商工業の発達", q:"自治的なまとまりを持った村を何という？", a:"<ruby>惣村<rt>そうそん</rt></ruby>"},
  {cat:"農業・商工業の発達", q:"1428年、近畿地方の民衆が襲った、金貸しを営んでいた業者を2つ答えよう。", a:"<ruby>酒屋<rt>さかや</rt></ruby>・<ruby>土倉<rt>どそう</rt></ruby>"},
  {cat:"農業・商工業の発達", q:"1428年に起こった、借金帳消しを求める暴動は？", a:"<ruby>正長の土一揆<rt>しょうちょうのつちいっき</rt></ruby>"},
];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const CELEBRATION_PHOTOS = ["images/shakai10-complete.jpg", "images/celebration3.jpg", "images/celebration4.jpg", "images/celebration5.jpg", "images/celebration7.jpg", "images/celebration9.jpg", "images/celebration10.jpg", "images/celebration11.jpg", "images/celebration12.jpg"];
const QUESTION_SECONDS = 7;
const ANSWER_SECONDS = 5;
function currentPhaseSeconds() {
  return showingAnswer ? ANSWER_SECONDS : QUESTION_SECONDS;
}
DATA.forEach((item, i) => { item._id = i; });
const TOTAL_COUNT = DATA.length;
let known = new Set();
try {
  const saved = sessionStorage.getItem("shakai19_known");
  if (saved) known = new Set(JSON.parse(saved));
} catch (e) {}
function saveKnown() {
  try { sessionStorage.setItem("shakai19_known", JSON.stringify([...known])); } catch (e) {}
}
function activeData() {
  return DATA.filter(item => !known.has(item._id));
}
let orderMode = "sequential"; // "shuffle" | "sequential"
function makeDeck() {
  const pool = activeData();
  return orderMode === "sequential" ? pool.slice() : shuffle(pool);
}
let deck = makeDeck();
let idx = 0;
let showingAnswer = false;
let paused = false;
let timer = null;
let tickStart = 0;
let remainingOnPause = QUESTION_SECONDS * 1000;
let finished = false;

const questionEl = document.getElementById("question");
const answerBox = document.getElementById("answerBox");
const answerText = document.getElementById("answerText");
const arrowLabel = document.getElementById("arrowLabel");
const categoryEl = document.getElementById("category");
const counterEl = document.getElementById("counter");
const masteredCounterEl = document.getElementById("masteredCounter");
const progressBar = document.getElementById("progressBar");
const playPauseBtn = document.getElementById("playPause");
const restartBtn = document.getElementById("restart");
const restartOrderBtn = document.getElementById("restartOrder");
const masterBtn = document.getElementById("masterBtn");
const resetMasteredBtn = document.getElementById("resetMastered");

function updateMasteredCounter() {
  masteredCounterEl.textContent = "✓ おぼえた " + known.size + " / " + TOTAL_COUNT;
}

function resetProgressBar() {
  progressBar.style.transition = "none";
  progressBar.style.width = "0%";
  void progressBar.offsetWidth;
}

function renderCard() {
  if (deck.length === 0) {
    finished = true;
    clearTimeout(timer);
    categoryEl.textContent = "🎉 全問クリア";
    counterEl.textContent = TOTAL_COUNT + " / " + TOTAL_COUNT;
    const celebPhoto = CELEBRATION_PHOTOS[Math.floor(Math.random() * CELEBRATION_PHOTOS.length)];
    questionEl.innerHTML = "🎉 全問「おぼえた」にしました！<br><img src=\"" + celebPhoto + "\" alt=\"おめでとう\" style=\"max-width:70vw; max-height:38vh; border-radius:20px; margin-top:2vh; box-shadow:0 4px 20px rgba(0,0,0,0.4);\">";
    answerBox.classList.add("no-transition");
    answerBox.classList.add("show");
    answerText.innerHTML = "";
    arrowLabel.style.display = "none";
    resetProgressBar();
    return;
  }
  finished = false;
  arrowLabel.style.display = "";
  const item = deck[idx];
  categoryEl.textContent = item.cat;
  counterEl.textContent = (idx + 1) + " / " + deck.length;
  questionEl.innerHTML = item.q;

  answerBox.classList.add("no-transition");
  answerBox.classList.remove("show");
  void answerBox.offsetWidth;
  answerText.innerHTML = item.a;
  void answerBox.offsetWidth;
  requestAnimationFrame(() => {
    answerBox.classList.remove("no-transition");
  });

  showingAnswer = false;
}

function step() {
  if (finished) return;
  if (!showingAnswer) {
    answerBox.classList.add("show");
    showingAnswer = true;
  } else {
    idx++;
    if (idx >= deck.length) {
      idx = 0;
      deck = makeDeck();
    }
    renderCard();
  }
  startProgress();
}

function startProgress() {
  const seconds = currentPhaseSeconds();
  resetProgressBar();
  requestAnimationFrame(() => {
    progressBar.style.transition = "width " + seconds + "s linear";
    progressBar.style.width = "100%";
  });
}

function scheduleNext() {
  clearTimeout(timer);
  const seconds = currentPhaseSeconds();
  tickStart = Date.now();
  remainingOnPause = seconds * 1000;
  timer = setTimeout(() => {
    step();
    if (!paused) scheduleNext();
  }, seconds * 1000);
}

function pause() {
  paused = true;
  clearTimeout(timer);
  const elapsed = Date.now() - tickStart;
  remainingOnPause = Math.max(currentPhaseSeconds() * 1000 - elapsed, 0);
  progressBar.style.transition = "none";
  playPauseBtn.textContent = "▶ 再生";
}

function resume() {
  paused = false;
  playPauseBtn.textContent = "⏸ 停止";
  tickStart = Date.now();
  timer = setTimeout(() => {
    step();
    if (!paused) scheduleNext();
  }, remainingOnPause);
  const remainSec = remainingOnPause / 1000;
  requestAnimationFrame(() => {
    progressBar.style.transition = "width " + remainSec + "s linear";
    progressBar.style.width = "100%";
  });
}

playPauseBtn.addEventListener("click", () => {
  if (paused) resume(); else pause();
});

restartBtn.addEventListener("click", () => {
  orderMode = "shuffle";
  deck = makeDeck();
  idx = 0;
  renderCard();
  resetProgressBar();
  if (!paused && !finished) {
    startProgress();
    scheduleNext();
  }
});

restartOrderBtn.addEventListener("click", () => {
  orderMode = "sequential";
  deck = makeDeck();
  idx = 0;
  renderCard();
  resetProgressBar();
  if (!paused && !finished) {
    startProgress();
    scheduleNext();
  }
});

masterBtn.addEventListener("click", () => {
  if (finished || deck.length === 0) return;
  clearTimeout(timer);
  const item = deck[idx];
  known.add(item._id);
  saveKnown();
  updateMasteredCounter();
  deck.splice(idx, 1);
  if (idx >= deck.length) idx = 0;
  renderCard();
  resetProgressBar();
  if (!paused && !finished) {
    startProgress();
    scheduleNext();
  }
});

resetMasteredBtn.addEventListener("click", () => {
  known = new Set();
  saveKnown();
  updateMasteredCounter();
  clearTimeout(timer);
  deck = makeDeck();
  idx = 0;
  renderCard();
  resetProgressBar();
  if (!paused && !finished) {
    startProgress();
    scheduleNext();
  }
});

document.querySelector(".card").addEventListener("click", () => {
  clearTimeout(timer);
  step();
  if (!paused) scheduleNext();
});

updateMasteredCounter();
renderCard();
startProgress();
scheduleNext();
</script>
</body>
</html>
