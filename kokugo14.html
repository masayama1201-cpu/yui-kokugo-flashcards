<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12181f">
<title>国語（5年後期：おくりがな2択）</title>
<style>
  :root {
    --bg: #12181f;
    --card-bg: #1c2733;
    --accent: #ffb347;
    --answer: #7ed6a5;
    --text: #f5f7fa;
    --sub: #9fb0c3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    overflow: hidden;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    width: 100vw;
    height: 100vh;
    padding: 3vh 5vw;
  }
  .topbar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 2.2vw;
    color: var(--sub);
  }
  .category {
    background: rgba(255,179,71,0.15);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 0.6vh 2vw;
    font-weight: bold;
  }
  .progress-wrap {
    width: 100%;
    height: 1.2vh;
    background: #2a3644;
    border-radius: 999px;
    margin-top: 1.5vh;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s linear;
  }
  .card {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 4vh;
  }
  .qlabel {
    font-size: 2vw;
    letter-spacing: 0.3em;
    color: var(--sub);
  }
  .question {
    font-size: 4vw;
    font-weight: 800;
    line-height: 1.4;
    max-width: 90vw;
  }
  .answer-box {
    font-size: 3.6vw;
    font-weight: 800;
    color: var(--answer);
    line-height: 1.4;
    max-width: 90vw;
    min-height: 6vw;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .answer-box.show {
    opacity: 1;
    transform: translateY(0);
  }
  .answer-box.no-transition {
    transition: none !important;
  }
  .answer-box .arrow {
    color: var(--sub);
    font-size: 3vw;
    margin-right: 0.4em;
  }
  .choice-wrap {
    display: none;
    flex-direction: column;
    gap: 2.5vh;
    width: 100%;
    align-items: center;
  }
  .choice-box {
    font-size: 3.4vw;
    font-weight: 800;
    padding: 2vh 4vw;
    border-radius: 18px;
    border: 2px solid var(--sub);
    background: var(--card-bg);
    color: var(--text);
    width: 82vw;
    max-width: 560px;
    opacity: 0.55;
    transition: all 0.5s ease;
  }
  .choice-box.correct {
    border-color: var(--answer);
    background: rgba(126,214,165,0.18);
    color: var(--answer);
    opacity: 1;
    transform: scale(1.03);
  }
  .bottombar {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 3vw;
    font-size: 1.8vw;
    color: var(--sub);
  }
  button.ctrl {
    background: #2a3644;
    color: var(--text);
    border: none;
    border-radius: 999px;
    padding: 1vh 2.2vw;
    font-size: 1.8vw;
    cursor: pointer;
  }
  button.ctrl:hover { background: #34445a; }
  .hint {
    color: var(--sub);
    font-size: 1.6vw;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="category" id="category">国語・おくりがな</span>
    <span id="counter">1 / 30</span>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <div class="card">
    <div class="qlabel" id="qlabel">Q</div>
    <div class="question" id="question">読み込み中…</div>
    <div class="answer-box" id="answerBox"><span class="arrow">A</span><span id="answerText"></span></div>
    <div class="choice-wrap" id="choiceWrap">
      <div class="choice-box" id="choiceBoxA"></div>
      <div class="choice-box" id="choiceBoxB"></div>
    </div>
  </div>

  <div class="bottombar">
    <button class="ctrl" id="playPause">⏸ 一時停止</button>
    <button class="ctrl" id="restart">🔀 シャッフルして最初から</button>
    <button class="ctrl" id="fullscreenBtn">⛶ 全画面</button>
    <span class="hint">問題7秒→答え5秒で自動的に切り替わります（タップでも操作できます）</span>
  </div>
</div>

<script>
const DATA = [
  {cat:"おくりがな・本科①", q:"「朝早くわたしはお母さんにオコサレタ。」のオコサレタを漢字＋おくりがなで書くと？", type:"choice", a:"起こされた", wrong:"起された"},
  {cat:"おくりがな・本科①", q:"「このアタリはとても静かな住宅地だ。」のアタリを漢字＋おくりがなで書くと？", type:"choice", a:"辺り", wrong:"辺"},
  {cat:"おくりがな・本科①", q:"「多くの人々とマジワルことは大切だ。」のマジワルを漢字＋おくりがなで書くと？", type:"choice", a:"交わる", wrong:"交る"},
  {cat:"おくりがな・本科①", q:"「強風で、雨戸がハズレテしまった。」のハズレテを漢字＋おくりがなで書くと？", type:"choice", a:"外れて", wrong:"外て"},
  {cat:"おくりがな・本科①", q:"「両親に、アラタメテ感謝の気持ちを伝えたい。」のアラタメテを漢字＋おくりがなで書くと？", type:"choice", a:"改めて", wrong:"改て"},
  {cat:"おくりがな・本科①", q:"「セーターがチヂンでしまった。」のチヂンでを漢字＋おくりがなで書くと？", type:"choice", a:"縮んで", wrong:"縮で"},
  {cat:"おくりがな・本科①", q:"「不器用だからコマカイ作業は苦手だ。」のコマカイを漢字＋おくりがなで書くと？", type:"choice", a:"細かい", wrong:"細い"},
  {cat:"おくりがな・本科①", q:"「春のおとずれとともに気候もヤワライてきた。」のヤワライてを漢字＋おくりがなで書くと？", type:"choice", a:"和らいで", wrong:"和らんで"},
  {cat:"おくりがな・本科①", q:"「オトシものを交番にとどける。」のオトシを漢字＋おくりがなで書くと？", type:"choice", a:"落とし", wrong:"落し"},
  {cat:"おくりがな・本科①", q:"「かれはわたしのシタシイ友達の一人だ。」のシタシイを漢字＋おくりがなで書くと？", type:"choice", a:"親しい", wrong:"親い"},
  {cat:"おくりがな・本科②", q:"「今年は晴天の日がスクナカッタ。」のスクナカッタを漢字＋おくりがなで書くと？", type:"choice", a:"少なかった", wrong:"少かった"},
  {cat:"おくりがな・本科②", q:"「アタタカナ春の日差しが待ち遠しい。」のアタタカナを漢字＋おくりがなで書くと？", type:"choice", a:"暖かな", wrong:"暖な"},
  {cat:"おくりがな・本科②", q:"「わたしはシアワセな毎日を送っていた。」のシアワセを漢字＋おくりがなで書くと？", type:"choice", a:"幸せ", wrong:"幸わせ"},
  {cat:"おくりがな・本科②", q:"「人生はタイラナことばかりではない。」のタイラナを漢字＋おくりがなで書くと？", type:"choice", a:"平らな", wrong:"平な"},
  {cat:"おくりがな・本科②", q:"「だれかがアラワレルことは大切なことだ。」のアラワレルを漢字＋おくりがなで書くと？", type:"choice", a:"現れる", wrong:"現われる"},
  {cat:"おくりがな・本科②", q:"「他人にオソワルことは大切なことだ。」のオソワルを漢字＋おくりがなで書くと？", type:"choice", a:"教わる", wrong:"教る"},
  {cat:"おくりがな・本科②", q:"「子どものスコヤカナ成長を願っている。」のスコヤカナを漢字＋おくりがなで書くと？", type:"choice", a:"健やかな", wrong:"健かな"},
  {cat:"おくりがな・本科②", q:"「子どもだけでの川遊びはアブナイ。」のアブナイを漢字＋おくりがなで書くと？", type:"choice", a:"危ない", wrong:"危い"},
  {cat:"おくりがな・本科②", q:"「二人は最後までキソイあった。」のキソイを漢字＋おくりがなで書くと？", type:"choice", a:"競い", wrong:"競そい"},
  {cat:"おくりがな・本科②", q:"「祖母がお経をトナエている。」のトナエを漢字＋おくりがなで書くと？", type:"choice", a:"唱え", wrong:"唱"},
  {cat:"おくりがな・栄冠", q:"「身長がイチジルシクのびた。」のイチジルシクを漢字＋おくりがなで書くと？", type:"choice", a:"著しく", wrong:"著るしく"},
  {cat:"おくりがな・栄冠", q:"「ココロヨイ風がふいてきた。」のココロヨイを漢字＋おくりがなで書くと？", type:"choice", a:"快い", wrong:"快よい"},
  {cat:"おくりがな・栄冠", q:"「万が一にソナエル。」のソナエルを漢字＋おくりがなで書くと？", type:"choice", a:"備える", wrong:"備る"},
  {cat:"おくりがな・栄冠", q:"「畑をタガヤス。」のタガヤスを漢字＋おくりがなで書くと？", type:"choice", a:"耕す", wrong:"耕やす"},
  {cat:"おくりがな・栄冠", q:"「新しいアキナイを始める。」のアキナイを漢字＋おくりがなで書くと？", type:"choice", a:"商い", wrong:"商ない"},
  {cat:"おくりがな・栄冠", q:"「自分のこれまでの行いをカエリミル。」のカエリミルを漢字＋おくりがなで書くと？", type:"choice", a:"省みる", wrong:"省りみる"},
  {cat:"おくりがな・栄冠", q:"「多くのお金をツイヤス。」のツイヤスを漢字＋おくりがなで書くと？", type:"choice", a:"費やす", wrong:"費す"},
  {cat:"おくりがな・栄冠", q:"「その件は、確かにウケタマワリました。」のウケタマワリを漢字＋おくりがなで書くと？", type:"choice", a:"承り", wrong:"承わり"},
  {cat:"おくりがな・栄冠", q:"「本当にできるかどうかココロミル。」のココロミルを漢字＋おくりがなで書くと？", type:"choice", a:"試みる", wrong:"試る"},
  {cat:"おくりがな・栄冠", q:"「フタタビ、京都をおとずれる。」のフタタビを漢字＋おくりがなで書くと？", type:"choice", a:"再び", wrong:"再たび"},
];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const QUESTION_SECONDS = 7;
const ANSWER_SECONDS = 5;
function currentPhaseSeconds() {
  return showingAnswer ? ANSWER_SECONDS : QUESTION_SECONDS;
}
let deck = shuffle(DATA);
let idx = 0;
let showingAnswer = false;
let paused = false;
let timer = null;
let tickStart = 0;
let remainingOnPause = QUESTION_SECONDS * 1000;
let currentOpts = null; // shuffled [{text, correct}] for the active choice card

const questionEl = document.getElementById("question");
const qlabelEl = document.getElementById("qlabel");
const answerBox = document.getElementById("answerBox");
const answerText = document.getElementById("answerText");
const choiceWrap = document.getElementById("choiceWrap");
const choiceBoxA = document.getElementById("choiceBoxA");
const choiceBoxB = document.getElementById("choiceBoxB");
const categoryEl = document.getElementById("category");
const counterEl = document.getElementById("counter");
const progressBar = document.getElementById("progressBar");
const playPauseBtn = document.getElementById("playPause");
const restartBtn = document.getElementById("restart");
const fullscreenBtn = document.getElementById("fullscreenBtn");

function renderCard() {
  const item = deck[idx];
  categoryEl.textContent = item.cat;
  counterEl.textContent = (idx + 1) + " / " + deck.length;
  questionEl.textContent = item.q;
  showingAnswer = false;

  if (item.type === "choice") {
    qlabelEl.style.display = "none";
    answerBox.style.display = "none";
    choiceWrap.style.display = "flex";
    currentOpts = shuffle([
      { text: item.a, correct: true },
      { text: item.wrong, correct: false },
    ]);
    choiceBoxA.textContent = currentOpts[0].text;
    choiceBoxB.textContent = currentOpts[1].text;
    choiceBoxA.classList.remove("correct");
    choiceBoxB.classList.remove("correct");
  } else {
    qlabelEl.style.display = "";
    choiceWrap.style.display = "none";
    answerBox.style.display = "";
    answerBox.classList.add("no-transition");
    answerBox.classList.remove("show");
    void answerBox.offsetWidth;
    answerText.textContent = item.a;
    void answerBox.offsetWidth;
    requestAnimationFrame(() => {
      answerBox.classList.remove("no-transition");
    });
  }
}

function revealAnswer() {
  const item = deck[idx];
  if (item.type === "choice") {
    const boxes = [choiceBoxA, choiceBoxB];
    boxes.forEach((box, i) => {
      if (currentOpts[i].correct) box.classList.add("correct");
    });
  } else {
    answerBox.classList.add("show");
  }
}

function step() {
  if (!showingAnswer) {
    revealAnswer();
    showingAnswer = true;
  } else {
    idx++;
    if (idx >= deck.length) {
      idx = 0;
      deck = shuffle(DATA);
    }
    renderCard();
  }
  progressBar.style.width = "0%";
  startProgress();
}

function startProgress() {
  const seconds = currentPhaseSeconds();
  progressBar.style.transition = "none";
  progressBar.style.width = "0%";
  requestAnimationFrame(() => {
    progressBar.style.transition = "width " + seconds + "s linear";
    progressBar.style.width = "100%";
  });
}

function scheduleNext() {
  clearTimeout(timer);
  const seconds = currentPhaseSeconds();
  tickStart = Date.now();
  remainingOnPause = seconds * 1000;
  timer = setTimeout(() => {
    step();
    if (!paused) scheduleNext();
  }, seconds * 1000);
}

function pause() {
  paused = true;
  clearTimeout(timer);
  const elapsed = Date.now() - tickStart;
  remainingOnPause = Math.max(currentPhaseSeconds() * 1000 - elapsed, 0);
  progressBar.style.transition = "none";
  playPauseBtn.textContent = "▶ 再生";
}

function resume() {
  paused = false;
  playPauseBtn.textContent = "⏸ 一時停止";
  tickStart = Date.now();
  timer = setTimeout(() => {
    step();
    if (!paused) scheduleNext();
  }, remainingOnPause);
  const remainSec = remainingOnPause / 1000;
  requestAnimationFrame(() => {
    progressBar.style.transition = "width " + remainSec + "s linear";
    progressBar.style.width = "100%";
  });
}

playPauseBtn.addEventListener("click", () => {
  if (paused) resume(); else pause();
});

restartBtn.addEventListener("click", () => {
  deck = shuffle(DATA);
  idx = 0;
  renderCard();
  progressBar.style.width = "0%";
  if (!paused) {
    startProgress();
    scheduleNext();
  }
});

function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function updateFullscreenBtn() {
  fullscreenBtn.textContent = isFullscreen() ? "⛶ 全画面をやめる" : "⛶ 全画面";
}
fullscreenBtn.addEventListener("click", () => {
  const el = document.documentElement;
  if (!isFullscreen()) {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) {
      req.call(el);
    } else {
      alert("この端末のSafariでは全画面ボタンに対応していないようです。\nホーム画面に追加したアイコンから開くと、アドレスバーなしで表示できます。");
    }
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) exit.call(document);
  }
});
document.addEventListener("fullscreenchange", updateFullscreenBtn);
document.addEventListener("webkitfullscreenchange", updateFullscreenBtn);

document.querySelector(".card").addEventListener("click", () => {
  clearTimeout(timer);
  step();
  if (!paused) scheduleNext();
});

renderCard();
startProgress();
scheduleNext();
</script>
</body>
</html>
