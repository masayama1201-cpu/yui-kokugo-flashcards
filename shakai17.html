function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function saveKnown() {
  try { sessionStorage.setItem("shakai17_known", JSON.stringify([...known])); } catch (e) {}
}
function activeData() {
  return DATA.filter(item => !known.has(item._id));
}
let orderMode = "sequential"; // "shuffle" | "sequential"
function makeDeck() {
  const pool = activeData();
  return orderMode === "sequential" ? pool.slice() : shuffle(pool);
}

  counterEl.textContent = (idx + 1) + " / " + deck.length;
  questionEl.innerHTML = item.q;

  answerBox.classList.add("no-transition");
  answerBox.classList.remove("show");
  void answerBox.offsetWidth;
  answerText.innerHTML = item.a;
  void answerBox.offsetWidth;
  requestAnimationFrame(() => {
    answerBox.classList.remove("no-transition");
  });

  showingAnswer = false;
}

function step() {
  if (finished) return;
  if (!showingAnswer) {
    answerBox.classList.add("show");
    showingAnswer = true;
  } else {
    idx++;
    if (idx >= deck.length) {
      idx = 0;
      deck = makeDeck();
    }
    renderCard();
  }
  startProgress();
}

function startProgress() {
  const seconds = currentPhaseSeconds();
  resetProgressBar();
  requestAnimationFrame(() => {
    progressBar.style.transition = "width " + seconds + "s linear";
    progressBar.style.width = "100%";
  });
}

function scheduleNext() {
  clearTimeout(timer);
  const seconds = currentPhaseSeconds();
  tickStart = Date.now();
  remainingOnPause = seconds * 1000;
  timer = setTimeout(() => {
    step();
    if (!paused) scheduleNext();
  }, seconds * 1000);
}

function pause() {
  paused = true;
  clearTimeout(timer);
  const elapsed = Date.now() - tickStart;
  remainingOnPause = Math.max(currentPhaseSeconds() * 1000 - elapsed, 0);
  progressBar.style.transition = "none";
  playPauseBtn.textContent = "▶ 再生";
}

function resume() {
  paused = false;
  playPauseBtn.textContent = "⏸ 停止";
  tickStart = Date.now();
  timer = setTimeout(() => {
    step();
    if (!paused) scheduleNext();
  }, remainingOnPause);
  const remainSec = remainingOnPause / 1000;
  requestAnimationFrame(() => {
    progressBar.style.transition = "width " + remainSec + "s linear";
    progressBar.style.width = "100%";
  });
}

playPauseBtn.addEventListener("click", () => {
  if (paused) resume(); else pause();
});

restartBtn.addEventListener("click", () => {
  orderMode = "shuffle";
  deck = makeDeck();
  idx = 0;
  renderCard();
  resetProgressBar();
  if (!paused && !finished) {
    startProgress();
    scheduleNext();
  }
});

restartOrderBtn.addEventListener("click", () => {
  orderMode = "sequential";
  deck = makeDeck();
  idx = 0;
  renderCard();
  resetProgressBar();
  if (!paused && !finished) {
    startProgress();
    scheduleNext();
  }
});

masterBtn.addEventListener("click", () => {
  if (finished || deck.length === 0) return;
  clearTimeout(timer);
  const item = deck[idx];
  known.add(item._id);
  saveKnown();
  updateMasteredCounter();
  deck.splice(idx, 1);
  if (idx >= deck.length) idx = 0;
  renderCard();
  resetProgressBar();
  if (!paused && !finished) {
    startProgress();
    scheduleNext();
  }
});

resetMasteredBtn.addEventListener("click", () => {
  known = new Set();
  saveKnown();
  updateMasteredCounter();
  clearTimeout(timer);
  deck = makeDeck();
  idx = 0;
  renderCard();
  resetProgressBar();
  if (!paused && !finished) {
    startProgress();
    scheduleNext();
  }
});

document.querySelector(".card").addEventListener("click", () => {
  clearTimeout(timer);
  step();
  if (!paused) scheduleNext();
});

updateMasteredCounter();
renderCard();
startProgress();
scheduleNext();
</script>
</body>
</html>
