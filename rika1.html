<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12181f">
<title>理科（5年後期 第1回：大地の変化 地形と岩石）</title>
<style>
  :root {
    --bg: #12181f;
    --card-bg: #1c2733;
    --accent: #ffb347;
    --answer: #7ed6a5;
    --text: #f5f7fa;
    --sub: #9fb0c3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    overflow: hidden;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    width: 100vw;
    height: 100vh;
    padding: 3vh 5vw;
  }
  .topbar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 2.2vw;
    color: var(--sub);
  }
  .category {
    background: rgba(255,179,71,0.15);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 0.6vh 2vw;
    font-weight: bold;
  }
  .progress-wrap {
    width: 100%;
    height: 1.2vh;
    background: #2a3644;
    border-radius: 999px;
    margin-top: 1.5vh;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s linear;
  }
  .card {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 4vh;
  }
  .qlabel {
    font-size: 2vw;
    letter-spacing: 0.3em;
    color: var(--sub);
  }
  .question {
    font-size: 4.2vw;
    font-weight: 800;
    line-height: 1.4;
    max-width: 90vw;
  }
  .answer-box {
    font-size: 3.6vw;
    font-weight: 800;
    color: var(--answer);
    line-height: 1.4;
    max-width: 90vw;
    min-height: 6vw;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .answer-box.show {
    opacity: 1;
    transform: translateY(0);
  }
  .answer-box.no-transition {
    transition: none !important;
  }
  .answer-box .arrow {
    color: var(--sub);
    font-size: 3vw;
    margin-right: 0.4em;
  }
  .bottombar {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 3vw;
    font-size: 1.8vw;
    color: var(--sub);
  }
  button {
    background: #2a3644;
    color: var(--text);
    border: none;
    border-radius: 999px;
    padding: 1vh 2.2vw;
    font-size: 1.8vw;
    cursor: pointer;
  }
  button:hover { background: #34445a; }
  .hint {
    color: var(--sub);
    font-size: 1.6vw;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="category" id="category">理科・第1回</span>
    <span id="counter">1 / 46</span>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <div class="card">
    <div class="qlabel">Q</div>
    <div class="question" id="question">読み込み中…</div>
    <div class="answer-box" id="answerBox"><span class="arrow">A</span><span id="answerText"></span></div>
  </div>

  <div class="bottombar">
    <button id="playPause">⏸ 一時停止</button>
    <button id="restart">🔀 シャッフルして最初から</button>
    <button id="fullscreenBtn">⛶ 全画面</button>
    <span class="hint">問題7秒→答え5秒で自動的に切り替わります（タップでも操作できます）</span>
  </div>
</div>

<script>
const DATA = [
  {cat:"地形がてきた原因", q:"川の上流にできる、両側が切り立った深い谷を何という？", a:"V字谷"},
  {cat:"地形がてきた原因", q:"V字谷はどのようにしてできる？", a:"川底の傾きが急で川の流れが速く、しん食作用がさかんなためにできる"},
  {cat:"地形がてきた原因", q:"山から平野に出た部分にできる、扇を広げたような地形を何という？", a:"扇状地"},
  {cat:"地形がてきた原因", q:"扇状地はどのようにしてできる？", a:"川底の傾きが急からゆるやかに変わり、たい積作用がさかんになることでできる"},
  {cat:"地形がてきた原因", q:"河口付近にできる、川の中央部に土砂が積もった地形を何という？", a:"三角州"},
  {cat:"地形がてきた原因", q:"三角州はどのようにしてできる？", a:"川底の傾きが非常にゆるやかになり、たい積作用がさかんになって小さな粒が積もることでできる"},
  {cat:"地形がてきた原因", q:"曲がって流れる川では、内側と外側どちらの流れが速い？", a:"外側（内側はおそい）"},
  {cat:"地形がてきた原因", q:"三日月湖はどのようにしてできる？", a:"曲がって流れる川で外側のしん食・内側のたい積が進んで曲がり方が大きくなり、川がはんらんするなどして川の一部が取り残されてできる"},
  {cat:"河口付近の土砂の積もり方", q:"海底に積もる土砂は、河口に近い方からどんな順に積もる？", a:"小石→砂→ねん土の順"},
  {cat:"河口付近の土砂の積もり方", q:"川の流れが速くなると、土砂の積もる場所は河口からどうなる？", a:"遠くなる"},
  {cat:"河口付近の土砂の積もり方", q:"川の流れがおそくなると、土砂の積もる場所は河口にどうなる？", a:"近づく"},
  {cat:"河口付近の土砂の積もり方", q:"海面が高くなると、土砂の積もる場所はどうずれる？", a:"陸側にずれる"},
  {cat:"河口付近の土砂の積もり方", q:"海面が低くなると、土砂の積もる場所はどうずれる？", a:"沖側にずれる"},
  {cat:"岩石のでき方", q:"マグマが冷えて固まった岩石を何という？", a:"火成岩"},
  {cat:"岩石のでき方", q:"火成岩のうち、マグマが地表付近で急に冷えて固まった岩石を何という？", a:"火山岩"},
  {cat:"岩石のでき方", q:"火山岩の代表的な3つの岩石を、色の白い順に挙げると？", a:"リュウモン岩・アンザン岩・ゲンブ岩"},
  {cat:"岩石のでき方", q:"火成岩のうち、マグマが地下深くでゆっくり冷えて固まった岩石を何という？", a:"深成岩"},
  {cat:"岩石のでき方", q:"深成岩の代表的な3つの岩石を、色の白い順に挙げると？", a:"カコウ岩・センリョク岩・ハンレイ岩"},
  {cat:"岩石のでき方", q:"火山岩の粒の大きさと、そろい方の特徴は？", a:"粒が小さく、大きさがそろっていない"},
  {cat:"岩石のでき方", q:"深成岩の粒の大きさと、そろい方の特徴は？", a:"粒が大きく、大きさがそろっている"},
  {cat:"岩石のでき方", q:"上に積もったものに押されて固まった岩石を何という？", a:"たい積岩"},
  {cat:"岩石のでき方", q:"たい積岩の粒には、流水の作用によってどんな特徴が見られる？", a:"角がけずられて丸みを帯びている"},
  {cat:"岩石のでき方", q:"ねん土が固まってできたたい積岩は？", a:"デイ岩"},
  {cat:"岩石のでき方", q:"砂が固まってできたたい積岩は？", a:"サ岩"},
  {cat:"岩石のでき方", q:"小石が主で、すき間に砂やねん土がつまって固まってできたたい積岩は？", a:"レキ岩"},
  {cat:"岩石のでき方", q:"火山灰が押し固められてできたたい積岩は？", a:"ギョウカイ岩"},
  {cat:"岩石のでき方", q:"生物の死がいなどが押し固められてできたたい積岩は？", a:"セッカイ岩"},
  {cat:"岩石のでき方", q:"レキ岩・サ岩・デイ岩を、粒の大きい順に並べると？", a:"レキ岩→サ岩→デイ岩"},
  {cat:"岩石のでき方", q:"たい積岩のうち、流水の作用に関係なくできるものを2つ挙げると？", a:"セッカイ岩・ギョウカイ岩"},
  {cat:"岩石のでき方", q:"ある岩石が熱や圧力によって性質が変化してできた岩石を何という？", a:"変成岩"},
  {cat:"岩石のでき方", q:"セッカイ岩が変化してできた変成岩は？", a:"大理石"},
  {cat:"火山の形とマグマ", q:"マグマのねばり気が弱いとできる、傾斜がゆるやかな盾のような形の火山の例は？", a:"キラウエア・マウナロア"},
  {cat:"火山の形とマグマ", q:"マグマのねばり気が中くらいの、円すい形の火山の例は？", a:"富士山・浅間山"},
  {cat:"火山の形とマグマ", q:"マグマのねばり気が強い、盛り上がったドーム状の火山の例は？", a:"昭和新山・雲仙普賢岳"},
  {cat:"火山の形とマグマ", q:"マグマのねばり気が弱いと、溶岩はどうなる？", a:"水のように流れる"},
  {cat:"火山の形とマグマ", q:"マグマのねばり気が強いと、火口付近で何が起きることがある？", a:"溶岩が流れずにたまってくずれ、火砕流が起きることがある"},
  {cat:"火山の形とマグマ", q:"マグマのねばり気が強いと火口付近にできる、おわんをふせたような地形は？", a:"溶岩ドーム"},
  {cat:"学び直し①（流れと地形）", q:"上流で地面の傾きが急なとき、流れる水の速さはどうなる？", a:"速くなる"},
  {cat:"学び直し①（流れと地形）", q:"下流で地面の傾きがゆるやかなとき、流れる水の速さはどうなる？", a:"おそくなる"},
  {cat:"学び直し①（流れと地形）", q:"上流から下流に行くにしたがって、次第に強くなっていくのはしん食作用とたい積作用のどちら？", a:"たい積作用"},
  {cat:"学び直し①（流れと地形）", q:"水の流れがおそくなるほど、積もっている石の大きさはどうなる？", a:"小さくなる"},
  {cat:"学び直し③（岩石と地形の演習）", q:"レキ岩とゲンブ岩、粒が角ばっているのはどちら？", a:"ゲンブ岩（急に冷えて固まった火山岩のため角ばった結晶になる。レキ岩は流水で運ばれて丸みを帯びる）"},
  {cat:"学び直し③（岩石と地形の演習）", q:"マグマがゆっくり冷えて固まるまでの時間が長いほど、粒（結晶）の大きさはどうなる？", a:"大きくなる"},
  {cat:"学び直し③（岩石と地形の演習）", q:"川原の石は、上流と下流でどちらが大きい？", a:"上流の方が大きい（下流に行くほど小さくなる）"},
  {cat:"学び直し③（岩石と地形の演習）", q:"曲がって流れる川の外側と内側で、それぞれ見られる地形は？", a:"外側＝がけ（しん食が強い）／内側＝川原（たい積が強い）"},
  {cat:"学び直し③（岩石と地形の演習）", q:"曲がって流れる川の断面はどのような形になる？", a:"外側（がけ）は深く切り立ち、内側（川原）はゆるやかに浅くなる、左右非対称の形になる"},
];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const QUESTION_SECONDS = 7;
const ANSWER_SECONDS = 5;
function currentPhaseSeconds() {
  return showingAnswer ? ANSWER_SECONDS : QUESTION_SECONDS;
}
let deck = shuffle(DATA);
let idx = 0;
let showingAnswer = false;
let paused = false;
let timer = null;
let tickStart = 0;
let remainingOnPause = QUESTION_SECONDS * 1000;

const questionEl = document.getElementById("question");
const answerBox = document.getElementById("answerBox");
const answerText = document.getElementById("answerText");
const categoryEl = document.getElementById("category");
const counterEl = document.getElementById("counter");
const progressBar = document.getElementById("progressBar");
const playPauseBtn = document.getElementById("playPause");
const restartBtn = document.getElementById("restart");
const fullscreenBtn = document.getElementById("fullscreenBtn");

function renderCard() {
  const item = deck[idx];
  categoryEl.textContent = item.cat;
  counterEl.textContent = (idx + 1) + " / " + deck.length;
  questionEl.textContent = item.q;

  answerBox.classList.add("no-transition");
  answerBox.classList.remove("show");
  void answerBox.offsetWidth;
  answerText.textContent = item.a;
  void answerBox.offsetWidth;
  requestAnimationFrame(() => {
    answerBox.classList.remove("no-transition");
  });

  showingAnswer = false;
}

function step() {
  if (!showingAnswer) {
    answerBox.classList.add("show");
    showingAnswer = true;
  } else {
    idx++;
    if (idx >= deck.length) {
      idx = 0;
      deck = shuffle(DATA);
    }
    renderCard();
  }
  progressBar.style.width = "0%";
  startProgress();
}

function startProgress() {
  const seconds = currentPhaseSeconds();
  progressBar.style.transition = "none";
  progressBar.style.width = "0%";
  requestAnimationFrame(() => {
    progressBar.style.transition = "width " + seconds + "s linear";
    progressBar.style.width = "100%";
  });
}

function scheduleNext() {
  clearTimeout(timer);
  const seconds = currentPhaseSeconds();
  tickStart = Date.now();
  remainingOnPause = seconds * 1000;
  timer = setTimeout(() => {
    step();
    if (!paused) scheduleNext();
  }, seconds * 1000);
}

function pause() {
  paused = true;
  clearTimeout(timer);
  const elapsed = Date.now() - tickStart;
  remainingOnPause = Math.max(currentPhaseSeconds() * 1000 - elapsed, 0);
  progressBar.style.transition = "none";
  playPauseBtn.textContent = "▶ 再生";
}

function resume() {
  paused = false;
  playPauseBtn.textContent = "⏸ 一時停止";
  tickStart = Date.now();
  timer = setTimeout(() => {
    step();
    if (!paused) scheduleNext();
  }, remainingOnPause);
  const remainSec = remainingOnPause / 1000;
  requestAnimationFrame(() => {
    progressBar.style.transition = "width " + remainSec + "s linear";
    progressBar.style.width = "100%";
  });
}

playPauseBtn.addEventListener("click", () => {
  if (paused) resume(); else pause();
});

restartBtn.addEventListener("click", () => {
  deck = shuffle(DATA);
  idx = 0;
  renderCard();
  progressBar.style.width = "0%";
  if (!paused) {
    startProgress();
    scheduleNext();
  }
});

function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function updateFullscreenBtn() {
  fullscreenBtn.textContent = isFullscreen() ? "⛶ 全画面をやめる" : "⛶ 全画面";
}
fullscreenBtn.addEventListener("click", () => {
  const el = document.documentElement;
  if (!isFullscreen()) {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) {
      req.call(el);
    } else {
      alert("この端末のSafariでは全画面ボタンに対応していないようです。\nホーム画面に追加したアイコンから開くと、アドレスバーなしで表示できます。");
    }
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) exit.call(document);
  }
});
document.addEventListener("fullscreenchange", updateFullscreenBtn);
document.addEventListener("webkitfullscreenchange", updateFullscreenBtn);

document.querySelector(".card").addEventListener("click", () => {
  clearTimeout(timer);
  step();
  if (!paused) scheduleNext();
});

renderCard();
startProgress();
scheduleNext();
</script>
</body>
</html>
